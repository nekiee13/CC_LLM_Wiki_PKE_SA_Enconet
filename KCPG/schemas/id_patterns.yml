# Local ID grammar for audit records. Shape does not grant source approval.
# The same pattern works for any company that uses this framework.
# Criterion tokens use uppercase letters, digits, and single underscores.
# A matching token is not an approved criterion or source edition.
schema_version: "1.0"

patterns:
  doc_id:
    example: "DOC-0001"
    regex: '^DOC-\d{4}$'
  chunk_id:
    example: "CHUNK-DOC-0001-0001"
    regex: '^CHUNK-DOC-\d{4}-\d{4}$'
  quote_id:
    example: "QUOTE-DOC-0001-0001-01"
    regex: '^QUOTE-DOC-\d{4}-\d{4}-\d{2}$'
  crumb_id:
    example: "CRUMB-DOC-0001-AREA_2-0001"
    regex: '^CRUMB-DOC-\d{4}-[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*-\d{4}$'
  requirement_id:
    example: "REQ-AREA_2-01"
    regex: '^REQ-[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*-\d{2}$'
  evaluation_id:
    example: "EVAL-AREA_2"
    regex: '^EVAL-[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$'
  gap_id:
    example: "GAP-AREA_2-01"
    regex: '^GAP-[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*-\d{2}$'
  finding_id:
    example: "FIND-0001"
    regex: '^FIND-\d{4}$'
  action_id:
    example: "ACT-0001"
    regex: '^ACT-\d{4}$'
  run_id:
    example: "RUN-20260704-01"
    regex: '^RUN-\d{8}-\d{2}$'
  dashboard_id:
    example: "DASH-20260704-0001"
    regex: '^DASH-\d{8}-\d{4}$'
