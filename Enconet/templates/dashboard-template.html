<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <style>
    :root{--ink:#17202a;--muted:#607080;--paper:#f4f7f8;--card:#fff;--line:#d7e0e4;--accent:#005b66;--good:#287a45;--warn:#a85d00;--bad:#a12a2a}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
    header,main,footer{max-width:1180px;margin:auto;padding:1.2rem}header{background:var(--accent);color:#fff;max-width:none}
    header>div{max-width:1138px;margin:auto}.eyebrow{letter-spacing:.12em;text-transform:uppercase;opacity:.8}
    .metric-bar,.distribution,.criteria-grid{display:grid;gap:1rem}.metric-bar{grid-template-columns:repeat(3,1fr);margin:1rem 0}
    .metric,.panel,.criterion-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem}
    .metric strong{display:block;font-size:1.6rem}.distribution{grid-template-columns:repeat(7,minmax(80px,1fr))}
    .distribution div{text-align:center}.controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
    input,select,button{font:inherit;padding:.55rem;border:1px solid var(--line);border-radius:5px;background:#fff}button{cursor:pointer}
    .criteria-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.criterion-card h3{margin:.2rem 0}.rating{font-weight:700;color:var(--accent)}
    .criterion-body[hidden]{display:none}.evidence{font-family:ui-monospace,monospace;font-size:.88rem;color:var(--muted)}
    .evidence-controls{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.7rem}.evidence-control{font-family:ui-monospace,monospace;font-size:.82rem;color:var(--accent);text-align:left}
    .evidence-backdrop{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:10}.evidence-drawer{position:fixed;z-index:11;top:0;right:0;width:min(720px,94vw);height:100vh;overflow:auto;background:var(--card);border-left:1px solid var(--line);padding:1.2rem;box-shadow:-8px 0 24px rgb(0 0 0/.2)}
    .evidence-drawer header{display:flex;justify-content:space-between;align-items:start;background:transparent;color:var(--ink);padding:0}.evidence-drawer h2{margin-top:0}.evidence-drawer dl{display:grid;grid-template-columns:max-content 1fr;gap:.25rem .7rem}.evidence-drawer dt{font-weight:700}.evidence-drawer dd{margin:0;overflow-wrap:anywhere}.evidence-quote,.evidence-chunk{border:1px solid var(--line);border-radius:6px;padding:.75rem;margin:.6rem 0}.evidence-source{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);padding:.65rem;border-radius:4px}.evidence-error{color:var(--bad);font-weight:700}
    .evidence-source mark{background:#ffe36e;color:inherit;padding:0}.chunk-nav,.evidence-action-controls{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.highlight-note{color:var(--warn);font-weight:700}.quote-match-status{color:var(--muted)}
    .citation-fallback{display:block;width:100%;min-height:16rem;white-space:pre;font:inherit;font-family:ui-monospace,monospace}.citation-print{display:none;white-space:pre-wrap;overflow-wrap:anywhere}
    [hidden]{display:none!important}
    table{width:100%;border-collapse:collapse}th,td{padding:.55rem;border-bottom:1px solid var(--line);text-align:left}
    .scroll{overflow:auto}.empty{color:var(--muted)}footer{color:var(--muted);text-align:center}
    @media(max-width:700px){.metric-bar,.distribution{grid-template-columns:1fr 1fr}.criteria-grid{grid-template-columns:1fr}}
    @media print{body{background:#fff}.controls,button,.evidence-backdrop{display:none!important}.criterion-body[hidden]{display:block}.panel,.criterion-card{break-inside:avoid;box-shadow:none}.evidence-drawer{position:static;width:auto;height:auto;box-shadow:none;border:1px solid var(--line)}body.evidence-print>header,body.evidence-print>main,body.evidence-print>footer,body.evidence-print>noscript{display:none!important}body.evidence-print>.evidence-drawer{display:block!important}body.evidence-print .citation-fallback{display:none!important}body.evidence-print .citation-print{display:block!important}}
  </style>
</head>
<body>
  <header id="dashboard-header" data-section="header"><div><div class="eyebrow" id="header-kicker"></div><h1 id="dashboard-title"></h1><div id="header-run"></div></div></header>
  <main>
    <section id="metric-bar" class="metric-bar" data-section="metric-bar">
      <div class="metric"><span id="label-score"></span><strong data-bind="weighted_score" id="metric-score"></strong></div>
      <div class="metric"><span id="label-applicable"></span><strong data-bind="applicable_count" id="metric-applicable"></strong></div>
      <div class="metric"><span id="label-classification"></span><strong data-bind="classification" id="metric-classification"></strong></div>
    </section>
    <section id="executive-summary" class="panel" data-section="executive-summary"><h2 id="heading-summary"></h2><p id="summary-text"></p></section>
    <section id="distribution" class="panel" data-section="distribution"><h2 id="heading-distribution"></h2><div class="distribution" data-bind="classification_counts" id="distribution-values"></div></section>
    <section id="dashboard-controls" class="panel controls" data-section="controls">
      <label><span id="label-filter"></span> <select id="rating-filter" onchange="filterCriteria()"></select></label>
      <label><span id="label-search"></span> <input id="criterion-search" type="search" oninput="searchCriteria()"></label>
      <button id="sort-button" type="button" onclick="sortCriteria()"></button>
      <button id="expand-button" type="button" onclick="toggleAll(true)"></button>
      <button id="collapse-button" type="button" onclick="toggleAll(false)"></button>
      <button id="print-button" type="button" onclick="printDashboard()"></button>
    </section>
    <section id="criterion-cards" data-section="criterion-cards"><h2 id="heading-criteria"></h2><div class="criteria-grid" data-bind="criteria" id="criterion-card-container"></div></section>
    <section id="criterion-matrix" class="panel scroll" data-section="matrix"><h2 id="heading-matrix"></h2><table><thead><tr id="matrix-head"></tr></thead><tbody data-bind="criteria" id="matrix-body"></tbody></table></section>
    <section id="priority-actions" class="panel" data-section="actions"><h2 id="heading-actions"></h2><div data-bind="priority_actions" id="actions-list"></div></section>
    <section id="artifact-metadata" class="panel" data-section="artifact-metadata">
      <h2>Artifact metadata</h2>
      <p>Package SHA-256: <code id="metadata-package-hash"></code></p>
      <p>Evidence bundle SHA-256: <code id="metadata-bundle-hash"></code></p>
    </section>
  </main>
  <div id="evidence-backdrop" class="evidence-backdrop" hidden></div>
  <aside id="evidence-drawer" class="evidence-drawer" role="dialog" aria-modal="true" aria-labelledby="evidence-panel-heading" hidden>
    <header><h2 id="evidence-panel-heading" tabindex="-1"></h2><button id="evidence-close" type="button"></button></header>
    <p id="evidence-status" class="evidence-error" role="status" aria-live="polite" hidden></p>
    <p><code id="evidence-requested-target"></code></p>
    <div id="evidence-resolved-content">
      <section id="evidence-entity-context" hidden><h3 id="evidence-context-label"></h3><dl id="evidence-context-values"></dl></section>
      <section><h3 id="evidence-statement-label"></h3><p id="evidence-statement"></p></section>
      <section><h3 id="evidence-document-label"></h3><dl><dt>ID</dt><dd id="evidence-document-id"></dd><dt>Title</dt><dd id="evidence-document-title"></dd><dt>File</dt><dd id="evidence-document-filename"></dd><dt>Language</dt><dd id="evidence-document-language"></dd></dl></section>
      <section><h3 id="evidence-traceability-label"></h3><dl><dt>Reference</dt><dd id="evidence-reference-id"></dd><dt>Criterion</dt><dd id="evidence-criterion-id"></dd><dt>Type</dt><dd id="evidence-item-type"></dd></dl></section>
      <section><h3 id="evidence-quotes-label"></h3><div id="evidence-quotes"></div></section>
      <section><h3 id="evidence-chunk-label"></h3><nav class="chunk-nav" aria-label="Source chunk navigation"><button id="evidence-previous-chunk" type="button"></button><code id="evidence-current-chunk-id"></code><button id="evidence-next-chunk" type="button"></button></nav><p id="evidence-highlight-status" class="highlight-note" role="status" aria-live="polite" hidden></p><article id="evidence-primary-chunk" class="evidence-chunk"><p><strong id="evidence-heading-path"></strong></p><pre id="evidence-chunk-text" class="evidence-source"></pre></article></section>
      <section id="evidence-record-actions"><h3 id="evidence-actions-label"></h3><div class="evidence-action-controls"><button id="evidence-copy" type="button"></button><button id="evidence-print" type="button"></button></div><p id="evidence-copy-status" role="status" aria-live="polite"></p><label for="evidence-citation-output" id="evidence-citation-label"></label><textarea id="evidence-citation-output" class="citation-fallback" readonly></textarea><pre id="evidence-citation-print" class="citation-print"></pre></section>
    </div>
  </aside>
  <noscript>JavaScript is required to open the embedded evidence; reference IDs remain visible for manual lookup.</noscript>
  <footer id="dashboard-footer" data-section="footer"><span data-bind="dash_id" id="footer-dash"></span> · <span data-bind="generated_date" id="footer-date"></span></footer>
  <script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
  <script id="dashboard-ui" type="application/json">__DASHBOARD_UI__</script>
  <script id="evidence-bundle" type="application/json" data-sha256="__EVIDENCE_BUNDLE_SHA256__">__EVIDENCE_BUNDLE__</script>
  <script>
    'use strict';
    const dashboardData=JSON.parse(document.getElementById('dashboard-data').textContent);
    const ui=JSON.parse(document.getElementById('dashboard-ui').textContent);
    const evidenceElement=document.getElementById('evidence-bundle');
    const evidenceBundle=JSON.parse(evidenceElement.textContent);
    const evidenceMaps=evidenceBundle?{crumbs:new Map(evidenceBundle.crumbs.map(item=>[item.crumb_id,item])),documents:new Map(evidenceBundle.documents.map(item=>[item.document_id,item])),quotes:new Map(evidenceBundle.quotes.map(item=>[item.quote_id,item])),chunks:new Map(evidenceBundle.chunks.map(item=>[item.chunk_id,item])),evaluations:new Map(evidenceBundle.evaluations.map(item=>[item.evaluation_id,item])),gaps:new Map(evidenceBundle.gaps.map(item=>[item.gap_id,item])),findings:new Map(evidenceBundle.findings.map(item=>[item.finding_id,item])),actions:new Map(evidenceBundle.actions.map(item=>[item.action_id,item]))}:null;
    let evidenceReturnFocus=null;
    let currentEvidenceCrumb=null;
    let currentEvidenceChunkId=null;
    let currentEvidenceDocumentId=null;
    let descending=false;
    const byId=id=>document.getElementById(id);
    const text=(id,value)=>{byId(id).textContent=value;};
    const escapeText=value=>String(value??'');
    function visibleCriteria(){const rating=byId('rating-filter').value;const query=byId('criterion-search').value.toLocaleLowerCase();return dashboardData.criteria.filter(c=>(!rating||c.rating===rating)&&(`${c.n} ${c.title} ${c.aff} ${c.con} ${c.judge}`).toLocaleLowerCase().includes(query));}
    function evidenceControl(crumbId){const button=document.createElement('button');button.type='button';button.className='evidence-control';button.setAttribute('data-evidence-id',crumbId);button.setAttribute('data-evidence-target',`#evidence/crumb/${crumbId}`);button.textContent=crumbId;button.addEventListener('click',()=>openEvidence(button.dataset.evidenceTarget,button));return button;}
    function appendEvidenceControls(container,refs){container.classList.add('evidence-controls');if(!refs.length){container.textContent=ui.none;return;}refs.forEach(crumbId=>container.append(evidenceControl(crumbId)));}
    function findAll(source,needle){const matches=[];if(!needle)return matches;let offset=0;while(offset<=source.length-needle.length){const index=source.indexOf(needle,offset);if(index<0)break;matches.push([index,index+needle.length]);offset=index+1;}return matches;}
    function normalizedTextMap(value){const normalized=[];const starts=[];const ends=[];let needsSpace=false;for(const match of value.matchAll(/\s+|[^\s]+/gu)){if(/^\s+$/u.test(match[0])){if(normalized.length)needsSpace=true;continue;}if(needsSpace){normalized.push(' ');starts.push(match.index);ends.push(match.index);needsSpace=false;}const token=match[0].normalize('NFC');for(let index=0;index<token.length;index+=1){normalized.push(token[index]);starts.push(match.index);ends.push(match.index+match[0].length);}}return {text:normalized.join(''),starts,ends};}
    function quoteRanges(source,quote){const method=String(quote.link_method??'').toUpperCase();let matches=[];if(method==='EXACT'){matches=findAll(source,quote.text_original);}else{const sourceMap=normalizedTextMap(source);const needle=normalizedTextMap(quote.text_original).text;matches=findAll(sourceMap.text,needle).map(([start,end])=>[sourceMap.starts[start],sourceMap.ends[end-1]]);}const status=!matches.length?'not_found':matches.length>1?'ambiguous':method==='EXACT'?'exact':'normalized';return {quote_id:quote.quote_id,status,match_count:matches.length,link_method:method,ranges:matches};}
    function renderHighlightedText(container,source,quotes){const results=quotes.map(quote=>quoteRanges(source,quote));const intervals=results.flatMap(result=>result.ranges.map(([start,end])=>({start,end,quote_id:result.quote_id})));const boundaries=[...new Set([0,source.length,...intervals.flatMap(match=>[match.start,match.end])])].sort((a,b)=>a-b);container.replaceChildren();for(let index=0;index<boundaries.length-1;index+=1){const start=boundaries[index];const end=boundaries[index+1];if(end<=start)continue;const active=intervals.filter(match=>match.start<end&&match.end>start).map(match=>match.quote_id).sort();const node=active.length?document.createElement('mark'):document.createTextNode(source.slice(start,end));if(active.length){node.setAttribute('data-quote-ids',active.join(' '));node.textContent=source.slice(start,end);}container.append(node);}return results.map(({ranges,...result})=>result);}
    function renderChunk(chunk,quotes){currentEvidenceChunkId=chunk.chunk_id;text('evidence-current-chunk-id',chunk.chunk_id);byId('evidence-primary-chunk').setAttribute('data-chunk-id',chunk.chunk_id);text('evidence-heading-path',chunk.heading_path);const applicable=quotes.filter(quote=>quote.chunk_id===chunk.chunk_id);const results=renderHighlightedText(byId('evidence-chunk-text'),chunk.text,applicable);const byQuote=new Map(results.map(result=>[result.quote_id,result]));quotes.forEach(quote=>{const article=document.querySelector(`[data-quote-id="${quote.quote_id}"]`);const result=byQuote.get(quote.quote_id);const status=result?result.status:'outside_chunk';article.setAttribute('data-highlight-status',status);article.querySelector('.quote-match-status').textContent=ui[`highlight_${status}`]??status;});const warnings=results.filter(result=>['ambiguous','not_found'].includes(result.status));const warning=byId('evidence-highlight-status');warning.hidden=!warnings.length;warning.textContent=warnings.length?ui.highlight_warning.replace('{count}',warnings.length):'';const neighbor=id=>{const candidate=id&&evidenceMaps.chunks.get(id);return candidate&&candidate.document_id===currentEvidenceDocumentId?candidate:null;};byId('evidence-previous-chunk').disabled=!neighbor(chunk.previous_chunk_id);byId('evidence-next-chunk').disabled=!neighbor(chunk.next_chunk_id);}
    function navigateChunk(direction){const current=evidenceMaps&&evidenceMaps.chunks.get(currentEvidenceChunkId);if(!current||!currentEvidenceCrumb)return;const targetId=direction==='previous'?current.previous_chunk_id:current.next_chunk_id;const target=targetId&&evidenceMaps.chunks.get(targetId);if(!target||target.document_id!==currentEvidenceDocumentId)return;const quotes=currentEvidenceCrumb.quote_ids.map(id=>evidenceMaps.quotes.get(id)).filter(Boolean);renderChunk(target,quotes);}
    function buildEvidenceCitation(crumb){if(!crumb||!evidenceMaps)return'';const documentRecord=evidenceMaps.documents.get(crumb.document_id);if(!documentRecord)return'';const lines=['Evidence citation',`Run-ID: ${evidenceBundle.metadata.run_id}`,`Supplier: ${evidenceBundle.metadata.supplier}`,`Language: ${evidenceBundle.metadata.deliverable_language}`,`Package-SHA256: ${evidenceBundle.lineage.package.sha256}`,`Bundle-SHA256: ${evidenceElement.dataset.sha256}`,`Document-ID: ${documentRecord.document_id}`,`Document-title: ${documentRecord.title}`,`Source-filename: ${documentRecord.filename}`,`Source-SHA256: ${documentRecord.source_sha256}`,`Crumb-ID: ${crumb.crumb_id}`,`Criterion-ID: ${crumb.criterion_id}`,`Item-type: ${crumb.item_type}`,`Statement: ${crumb.statement}`];crumb.quote_ids.forEach(quoteId=>{const quote=evidenceMaps.quotes.get(quoteId);const chunk=quote&&evidenceMaps.chunks.get(quote.chunk_id);if(!quote||!chunk)return;lines.push('',`Quote-ID: ${quote.quote_id}`,`Link-method: ${quote.link_method}`,`Confidence: ${quote.confidence}`,`Locator: ${quote.source_locator}`,`Chunk-ID: ${chunk.chunk_id}`,`Heading: ${chunk.heading_path}`,'Quote-text:',quote.text_original);});return lines.join('\n');}
    async function copyEvidenceCitation(){const output=byId('evidence-citation-output');const citation=buildEvidenceCitation(currentEvidenceCrumb);output.value=citation;byId('evidence-citation-print').textContent=citation;try{if(!navigator.clipboard||typeof navigator.clipboard.writeText!=='function')throw new Error('clipboard unavailable');await navigator.clipboard.writeText(citation);text('evidence-copy-status',ui.copy_success);}catch(_error){text('evidence-copy-status',ui.copy_fallback);output.focus();output.select();}}
    function printEvidence(){if(!currentEvidenceCrumb)return;document.body.classList.add('evidence-print');window.print();}
    function showEvidenceError(target){text('evidence-requested-target',target);text('evidence-status',ui.evidence_unavailable);byId('evidence-status').hidden=false;byId('evidence-resolved-content').hidden=true;}
    function renderEntityContext(resolved){const section=byId('evidence-entity-context');const values=byId('evidence-context-values');values.replaceChildren();section.hidden=resolved.type==='crumb';if(section.hidden)return;const entity=resolved.type==='source'?{run_id:evidenceBundle.metadata.run_id,supplier:evidenceBundle.metadata.supplier,deliverable_language:evidenceBundle.metadata.deliverable_language}:evidenceMaps[`${resolved.type}s`].get(resolved.id);Object.entries(entity??{}).filter(([key])=>key!=='viewer_target').forEach(([key,value])=>{const term=document.createElement('dt');term.textContent=key;const detail=document.createElement('dd');detail.textContent=Array.isArray(value)?value.join(', '):String(value??'');values.append(term,detail);});}
    function renderEvidenceCrumb(crumb,target){const documentRecord=evidenceMaps.documents.get(crumb.document_id);const quotes=crumb.quote_ids.map(id=>evidenceMaps.quotes.get(id)).filter(Boolean);const chunk=evidenceMaps.chunks.get(crumb.chunk_ids[0]);if(!documentRecord||quotes.length!==crumb.quote_ids.length||!chunk){showEvidenceError(target);return false;}currentEvidenceCrumb=crumb;currentEvidenceDocumentId=crumb.document_id;text('evidence-requested-target',target);text('evidence-statement',crumb.statement);text('evidence-document-id',documentRecord.document_id);text('evidence-document-title',documentRecord.title);text('evidence-document-filename',documentRecord.filename);text('evidence-document-language',documentRecord.language);text('evidence-reference-id',crumb.crumb_id);text('evidence-criterion-id',crumb.criterion_id);text('evidence-item-type',crumb.item_type);const quoteContainer=byId('evidence-quotes');quoteContainer.replaceChildren();quotes.forEach(quote=>{const article=document.createElement('article');article.className='evidence-quote';article.setAttribute('data-quote-id',quote.quote_id);const id=document.createElement('strong');id.textContent=quote.quote_id;const metadata=document.createElement('p');metadata.textContent=`${quote.link_method} · ${ui.confidence}: ${quote.confidence}`;const locator=document.createElement('p');locator.textContent=quote.source_locator;const source=document.createElement('pre');source.className='evidence-source';source.textContent=quote.text_original;const matchStatus=document.createElement('p');matchStatus.className='quote-match-status';article.append(id,metadata,locator,source,matchStatus);quoteContainer.append(article);});renderChunk(chunk,quotes);const citation=buildEvidenceCitation(crumb);byId('evidence-citation-output').value=citation;byId('evidence-citation-print').textContent=citation;text('evidence-copy-status','');byId('evidence-status').hidden=true;byId('evidence-status').textContent='';byId('evidence-resolved-content').hidden=false;return true;}
    function evidenceCrumbFor(type,id){if(!evidenceMaps)return null;const first=ids=>(ids??[]).map(crumbId=>evidenceMaps.crumbs.get(crumbId)).find(Boolean)??null;const byDocument=documentId=>evidenceBundle.crumbs.find(crumb=>crumb.document_id===documentId)??null;if(type==='crumb')return evidenceMaps.crumbs.get(id)??null;if(type==='document')return evidenceMaps.documents.has(id)?byDocument(id):null;if(type==='evaluation'){const row=evidenceMaps.evaluations.get(id);return row?first(row.evidence_crumb_ids):null;}if(type==='gap'){const row=evidenceMaps.gaps.get(id);return row?(evidenceMaps.crumbs.get(row.evidence_crumb_id)??evidenceCrumbFor('evaluation',row.evaluation_id)):null;}if(type==='finding'){const row=evidenceMaps.findings.get(id);return row?(evidenceMaps.crumbs.get(row.evidence_crumb_id)??evidenceCrumbFor('gap',row.gap_id)??evidenceCrumbFor('evaluation',row.evaluation_id)):null;}if(type==='action'){const row=evidenceMaps.actions.get(id);return row?(evidenceCrumbFor('finding',row.finding_id)??evidenceCrumbFor('gap',row.gap_id)):null;}if(type==='source'&&id==='package')return evidenceBundle.crumbs[0]??null;return null;}
    function resolveEvidenceTarget(target){if(typeof target!=='string'||target.includes('%'))return null;const match=target.match(/^#evidence\/(crumb|document|evaluation|gap|finding|action|source)\/([A-Za-z0-9_.:-]+)$/u);if(!match)return null;const [,type,id]=match;const collection=type==='source'?null:evidenceMaps?.[`${type}s`];const entity=type==='source'&&id==='package'?{viewer_target:target}:collection?.get(id);if(!entity||entity.viewer_target!==target)return null;const crumb=evidenceCrumbFor(type,id);return crumb?{type,id,crumb}:null;}
    function openEvidence(target,trigger=null,cause='activate'){evidenceReturnFocus=trigger instanceof HTMLElement?trigger:document.activeElement;byId('evidence-drawer').hidden=false;byId('evidence-backdrop').hidden=false;const resolved=resolveEvidenceTarget(target);const rendered=Boolean(resolved&&renderEvidenceCrumb(resolved.crumb,target));if(rendered)renderEntityContext(resolved);if(!rendered)showEvidenceError(String(target??''));if(rendered&&cause==='activate')history.pushState(null,'',target);if(rendered&&cause==='initial_load')history.replaceState(null,'',target);byId('evidence-panel-heading').focus();}
    function hideEvidence(returnFocus=false){document.body.classList.remove('evidence-print');byId('evidence-drawer').hidden=true;byId('evidence-backdrop').hidden=true;if(returnFocus&&evidenceReturnFocus&&evidenceReturnFocus.isConnected)evidenceReturnFocus.focus();evidenceReturnFocus=null;}
    function closeEvidence(){hideEvidence(true);}
    function navigateEvidenceLocation(cause){if(location.hash.startsWith('#evidence/'))openEvidence(location.hash,null,cause);else hideEvidence(false);}
    function renderCriteria(){const rows=visibleCriteria().slice().sort((a,b)=>descending?b.order-a.order:a.order-b.order);const cards=byId('criterion-card-container');const matrix=byId('matrix-body');cards.replaceChildren();matrix.replaceChildren();rows.forEach(c=>{const article=document.createElement('article');article.className='criterion-card';article.dataset.rating=c.rating;const heading=document.createElement('h3');heading.textContent=`${c.n} — ${c.title}`;const badge=document.createElement('div');badge.className='rating';badge.textContent=c.rating;const button=document.createElement('button');button.type='button';button.textContent=ui.details;button.addEventListener('click',()=>toggleCard(button));const body=document.createElement('div');body.className='criterion-body';[['aff',ui.affirmative],['con',ui.contrary],['judge',ui.judgement]].forEach(([key,label])=>{const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=`${label}: `;p.append(strong,document.createTextNode(escapeText(c[key])));body.append(p);});const refs=document.createElement('div');refs.className='evidence';appendEvidenceControls(refs,c.refs);body.append(refs);article.append(heading,badge,button,body);cards.append(article);const tr=document.createElement('tr');[c.n,c.title,c.rating,c.score??ui.na].forEach(value=>{const td=document.createElement('td');td.textContent=escapeText(value);tr.append(td);});const evidenceCell=document.createElement('td');appendEvidenceControls(evidenceCell,c.refs);tr.append(evidenceCell);matrix.append(tr);});}
    function filterCriteria(){renderCriteria();}
    function searchCriteria(){renderCriteria();}
    function sortCriteria(){descending=!descending;renderCriteria();}
    function toggleCard(button){const body=button.parentElement.querySelector('.criterion-body');body.hidden=!body.hidden;}
    function toggleAll(open){document.querySelectorAll('.criterion-body').forEach(body=>{body.hidden=!open;});}
    function printDashboard(){window.print();}
    function renderDashboard(){document.documentElement.lang=dashboardData.deliverable_language;document.title=`${ui.title} — ${dashboardData.supplier}`;[['header-kicker',ui.kicker],['dashboard-title',document.title],['header-run',`${dashboardData.run_id} · ${dashboardData.generated_date}`],['label-score',ui.score],['metric-score',`${dashboardData.weighted_score} / 100`],['label-applicable',ui.applicable],['metric-applicable',dashboardData.applicable_count],['label-classification',ui.classification],['metric-classification',dashboardData.classification],['heading-summary',ui.summary],['summary-text',ui.summary_text.replace('{count}',dashboardData.applicable_count).replace('{score}',dashboardData.weighted_score)],['heading-distribution',ui.distribution],['label-filter',ui.filter],['label-search',ui.search],['sort-button',ui.sort],['expand-button',ui.expand],['collapse-button',ui.collapse],['print-button',ui.print],['heading-criteria',ui.criteria],['heading-matrix',ui.matrix],['heading-actions',ui.actions],['footer-dash',dashboardData.dash_id],['footer-date',dashboardData.generated_date],['metadata-package-hash',evidenceBundle?.lineage?.package?.sha256??ui.none],['metadata-bundle-hash',evidenceElement.dataset.sha256||ui.none],['evidence-panel-heading',ui.evidence_title],['evidence-close',ui.evidence_close],['evidence-context-label',ui.evidence_context],['evidence-statement-label',ui.evidence_statement],['evidence-document-label',ui.evidence_document],['evidence-traceability-label',ui.evidence_traceability],['evidence-quotes-label',ui.evidence_quotes],['evidence-chunk-label',ui.evidence_chunk],['evidence-previous-chunk',ui.previous_chunk],['evidence-next-chunk',ui.next_chunk],['evidence-actions-label',ui.evidence_actions],['evidence-copy',ui.copy_citation],['evidence-print',ui.print_evidence],['evidence-citation-label',ui.citation_label]].forEach(([id,value])=>text(id,value));const filter=byId('rating-filter');filter.replaceChildren();[['',ui.all],...Object.keys(dashboardData.classification_counts).map(v=>[v,v])].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;filter.append(option);});const dist=byId('distribution-values');dist.replaceChildren();Object.entries(dashboardData.classification_counts).forEach(([name,count])=>{const div=document.createElement('div');const strong=document.createElement('strong');strong.textContent=count;div.append(document.createTextNode(`${name} `),strong);dist.append(div);});const head=byId('matrix-head');[ui.id,ui.name,ui.rating,ui.criterion_score,ui.evidence].forEach(label=>{const th=document.createElement('th');th.textContent=label;head.append(th);});const actions=byId('actions-list');actions.replaceChildren();if(!dashboardData.priority_actions.length){const p=document.createElement('p');p.className='empty';p.textContent=ui.none_actions;actions.append(p);}dashboardData.priority_actions.forEach(a=>{const p=document.createElement('p');p.textContent=`${a.action_id} · ${a.description}`;actions.append(p);});renderCriteria();}
    byId('evidence-close').addEventListener('click',closeEvidence);
    byId('evidence-backdrop').addEventListener('click',closeEvidence);
    byId('evidence-previous-chunk').addEventListener('click',()=>navigateChunk('previous'));
    byId('evidence-next-chunk').addEventListener('click',()=>navigateChunk('next'));
    byId('evidence-copy').addEventListener('click',copyEvidenceCitation);
    byId('evidence-print').addEventListener('click',printEvidence);
    window.addEventListener('afterprint',()=>document.body.classList.remove('evidence-print'));
    window.addEventListener('popstate',()=>navigateEvidenceLocation('popstate'));
    window.addEventListener('hashchange',()=>navigateEvidenceLocation('hashchange'));
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!byId('evidence-drawer').hidden)closeEvidence();});
    renderDashboard();
    navigateEvidenceLocation('initial_load');
  </script>
