ta ZK1 (trajno čuvanje dokumenta).\n\nSvaki učesnik izobrazbe/uvježbavanja treba potpisati izjavu kojom potvrđuje da je pročitao određene dokumente, te razumio njihov sadržaj i utjecaj koji imaju na njegovu odgovornost i obavljanje poslova u Enconetu. Obrazac OB-RZD-007 na kojem se daje izjava priložen je u točki 7. ovog postupka. Potvrde o razumijevanju dokumenata čuvaju se kao zapisi kvalitete klase dokumenta ZK1.\n\nUkoliko pojedini učesnici nisu stekli dovoljna znanja o određenoj temi ili nisu prisustvovali predavanju radi opravdanih razloga, nadoknada se mora obaviti unutar mjesec dana od prvog planiranog termina izobrazbe/uvježbavanja.\n\nKad dođe do značajnijih izmjena dokumenata SUK-a i izdavanja novih revizija, planirat će se i provesti ponovna izobrazba osoblja koje obavlja poslove bitne za ostvarivanje kvalitete.\n\nNovo osoblje i vanjski suradnici Enconeta upoznat će se sa zahtjevima sustava SUK-a prije nego što počnu izvoditi aktivnosti koje utječu na kvalitetu proizvoda.\n\nUvježbavanje ili \"trening\" provoditi će se za neke poslove kako bi se postigla i /ili održavala određena zahtjevana znanja, sposobnosti i vještine. Uvježbavanje se može planirati i provoditi u odgovarajućoj vanjskoj instituciji ili interno u Enconetu.\n\nTijekom uvježbavanja provjeravat će se znanje, sposobnost i vještina kroz program kvalifikacije, interno nezavisno ocjenjivanje kvalitete i/ili će provjeru obavljati rukovodeće ili nadzorno osoblje.\n\nUvježbavanje QA osoblja i internih auditora provodi se prema kvalificiranim programima u Enconetu ili u ovlaštenim institucijama.\n\nKao i za izobrazbu, uvježbavanje se planira i provodi na spomenutim obrascima a potvrde o obavljenom uvježbavanju čuvaju se kao zapisi kvalitete.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0027-0011"},{"char_end":11720,"char_start":11246,"chunk_id":"CHUNK-DOC-0027-0012","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0027","heading_path":"SADRŽAJ [line 34] > 6.3 Izobrazba djelatnika koji rade u NE Krško [line 226]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0027-0011","sequence":12,"source_sha256":"460ea5ace2a3f1a34349dd91dc728fe5a9bfd396b68988a6c48ac9cb2a01f9b6","text":"## 6.3 Izobrazba djelatnika koji rade u NE Krško\n\nU okviru svoje djelatnosti tvrtka Enconet, kao podizvođač, obavlja određene poslove u NE Krško koja radi po zakonodavstvu Republike Slovenije i međunarodnim standardima za nuklearne objekte i postrojenja. Zato su i zahtjevi za rad te potrebno znanje i stalna izobrazba za uspješno i kvalitetno obavljanje poslova vrlo strogi i u skladu s odgovarajućim zakonima i standardima.\n\nEnconet d.o.o., Zagreb\n---\nProgramski postupak\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0027-0012"},{"char_end":6886,"char_start":5847,"chunk_id":"CHUNK-DOC-0029-0008","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0029","heading_path":"SADRŽAJ [line 39] > 5.      ODGOVORNOSTI [line 136]","next_chunk_id":"CHUNK-DOC-0029-0009","previous_chunk_id":null,"sequence":8,"source_sha256":"77d7a95b134c6c6f59b564f866efc5a0324f08218af14f8bdd81968a3aa6fafe","text":"## 5.      ODGOVORNOSTI\n\nDirektor Enconeta odgovoran je za imenovanje voditelja projekta, njegove zamjene te za odobravanje i potvrđivanje projekta i izmjena ili modifikacija projekta.\n\nVoditelj projekta odgovoran je za izradu Plana realizacije projekta; formiranje projektnog tima i koordinaciju njegovoga rada; provođenje projektnih aktivnosti sukladno utvrđenom Planu realizacije projekta; primjenu odgovarajućih zakona, propisa, standarda, te ispunjavanje ugovornih obveza i zahtjeva kvalitete u izvedbi projekta; iniciranje aktivnosti pregleda, ovjere i potvrđivanja projekta te primopredaje projekta kupcu. Posebno je odgovoran da održava sve zapise za svaki projekt od zahtjeva za ponudu/upita, ponude i ugovora/narudžbe preko plana i realizacije projekta sa svim pregledima, ovjerama i potvrdama do korespondencije s kupcem i zapisnika o primopredaji.\n\nVoditelj QA poslova odgovoran je za interne provjere u procesu projektiranja i razvoja te provjeru da su sve popravne radnje i nesukladnosti na projektu provedene i zaključene.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0029-0008"},{"char_end":10740,"char_start":6886,"chunk_id":"CHUNK-DOC-0029-0009","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0029","heading_path":"SADRŽAJ [line 39] > 6.      POSTUPAK [line 144]","next_chunk_id":"CHUNK-DOC-0029-0010","previous_chunk_id":"CHUNK-DOC-0029-0008","sequence":9,"source_sha256":"77d7a95b134c6c6f59b564f866efc5a0324f08218af14f8bdd81968a3aa6fafe","text":"## 6.      POSTUPAK\n\n### 6.1     Proces projektiranja i razvoja\n\nOsnovni proizvod Enconeta je «projekt» (projekt, studija, elaborat, stručna analiza, računalni program, konzalting i druge inženjerske usluge). Zato postupak realizacije projektiranja i razvoja znači i postupak realizacije proizvoda.\n\nPriprema projekta počinje definiranjem projektnog zadatka, a završava potpisivanjem ugovora s kupcem. Sve aktivnosti izrade, pregleda, usuglašavanja i dokumentiranja obavljaju se prema zahtjevima postupka PP-72-01 (Ref. 5).\n\nProces projektiranja i razvoja obuhvaća slijedeće aktivnosti:\n\na) izradu plana realizacije projektiranja i razvoja\nb) utvrđivanje ulaznih podataka za projektiranje i razvoj\nc) izradu rezultata (izlaznih podataka) projektiranja i razvoja\nd) ocjenu projektiranja i razvoja\ne) provjera i ovjera/verifikacija projektiranja i razvoja\nf) potvrđivanje prihvatljivosti/validacija projektiranja i razvoja\ng) upravljanje promjenama u projektiranju i razvoju\nh) identificiranje kritičnih točaka projekta (materijalni, terminski, ljudski), i određivanje utjecaja na projekt svake od njih, kao i vjerojatnost pojave\n\nFormat naslovne strane projekta definiran je obrascem OB-NSP-022, a unutarnje strane obrascem OB-USP-023 koji su priloženi u točki 7. ovog postupka.\n\n### 6.2     Izrada plana realizacije projektiranja i razvoja\n\nDjelotvorna izvedba projekta zahtijeva izradu Plana realizacije projekta kako bi se pravovremeno predvidjeli i utvrdili potrebni elementi kao što su:\n\na) terminski plan projekta po fazama (ako je svrsishodno)\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                              Oznaka dok: PP-73-01\nPROCES PROJEKTIRANJA I RAZVOJA                                                    Rev. 6         Str: 5/19\n\nb) kratki opis te ulazni i izlazni podaci za svaku fazu (dio procesa)\nc) kontrolne točke za provjere, ovjeru, potvrđivanje prihvatljivosti, završni\n   pregled i isporuku projekta\nd) specifikacija i narudžba potrebne mjerne i druge opreme sa svim zahtjevima\n   uključujući kalibraciju i rekalibraciju\ne) definiranje tko, što, gdje i kada, s kojom mjernom opremom i po kojem\n   postupku mjeri, koji su kriteriji prihvatljivosti te tko ih je definirao (kupac,\n   zakon, standard/norma, Enconet i sl.)\nf) imenovanje internih i vanjskih učesnika projektnog tima (po fazama), te\n   njihove odgovornosti i ovlasti. Jedan od učesnika projektnog tima treba biti\n   predstavnik QA službe\ng) utvrđivanje i osiguranje veza i komunikacija s kupcem (vidi PP-72-01 točka\n   6.3) i između internih i vanjskih grupa (timova) koji su uključeni u aktivnosti\nh) predviđanje ažuriranja izlaznih podataka\ni) planiranje i utvrđivanje troškova\n\nKod izrade Plana realizacije svakog projekta, voditelj projekta će polaziti od\npolitike i ciljeva kvalitete utvrđenih u Priručniku kvalitete (PK5.3 i PK5.4) i drugim\ndokumentima, a posebno će voditi računa o zahtjevima za konkretan projekt.\nPlan realizacije projekta izraditi će u dokumentiranoj formi a sadržaj Plana, točka\n6.2 a) do 6.2 i) ovisi o karakteru, obimu i složenosti projekta. Za male i\njednostavne projekte Plan projekta se može izraditi pomoću obrasca: OB-PIP-\n043 «Plan izvedbe projekta», koji je priložen u Prilogu ovog postupka.\n\nOvisno o veličini i složenosti projekta, te broju unutrašnjih i vanjskih suradnika,\nvoditelj projekta utvrđuje i osigurava djelovanje veza i komunikacija tijekom\nrealizacije projekta. Razni postupci za veze i komunikacije služe za međusobno\ninformiranje o podacima i rješenjima, raščišćavanje nejasnih pitanja,\nprijem/predaju ulaznih/izlaznih podataka, izvješćivanje i t.d. Metode veza i\nkomuniciranja mogu biti: izravni razgovori (sastanci), pismeni dopisi, telefonski\nrazgovori, e-mail pošta, razne prezentacije i slično.\n\nVoditelj projekta voditi će i ažurirati Popis i status svih projekata.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0029-0009"},{"char_end":11587,"char_start":10740,"chunk_id":"CHUNK-DOC-0029-0010","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0029","heading_path":"SADRŽAJ [line 39] > 6.3 Utvrđivanje ulaznih podataka za projektiranje i razvoj [line 210]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0029-0009","sequence":10,"source_sha256":"77d7a95b134c6c6f59b564f866efc5a0324f08218af14f8bdd81968a3aa6fafe","text":"## 6.3 Utvrđivanje ulaznih podataka za projektiranje i razvoj\n\nUlazni podaci za projektiranje i razvoj povezani su sa zahtjevima kupca za\nproizvod koji su definirani u Ugovoru. U prvoj fazi utvrđivanja ulaznih podataka za\nprojektiranje i razvoj treba, ako je svrsishodno, izraditi specifikaciju za proizvod.\n\nKako bi ulazni podaci bili potpuni, nedvosmisleni i međusobno neproturječni, sve\nnejasne i sporne zahtjeve treba rješavati u komunikaciji s kupcem. Jedino tako\nutvrđeni ulazni zahtjevi osiguravaju efikasnu realizaciju proizvoda u cilju\nzadovoljenja zahtjeva i očekivanja kupaca.\n\nUlazni podaci za projektiranje i razvoj, osim ostalog, moraju sadržavati:\n\n- zahtjeve na funkciju i karakteristike proizvoda\n- odgovarajuće zakonske i pravne zahtjeve\n- podatke od prijašnjih sličnih projekata, kada su primjenjivi\n\nENCONET d.o.o., Zagreb\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0029-0010"},{"char_end":6382,"char_start":5724,"chunk_id":"CHUNK-DOC-0030-0008","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0030","heading_path":"SADRŽAJ [line 29] > 5. ODGOVORNOSTI [line 125]","next_chunk_id":"CHUNK-DOC-0030-0009","previous_chunk_id":null,"sequence":8,"source_sha256":"a8f111bb893d0f04794ad01fb22434c1614752700467833acfa0db2d63a9fe2c","text":"## 5. ODGOVORNOSTI\n\nDirektor Enconeta odgovoran je za izbor voditelja audit tima kod svakog pojedinačnog audita. Odgovoran je za osiguravanje uvjeta i resursa za provođenje svih potrebnih aktivnosti. Odobrava provođenje audita. Odgovoran je za godišnje ocjenjivanje auditora.\n\nVoditelj QA poslova odgovoran je za planiranje audita, za sastav i kvalifikacije tima za ocjenjivanje te za evidentiranje i čuvanje dokumentacije o provedenim auditima.\n\nVoditelj audit tima odgovoran je za pripremu, provođenje, dokumentiranje i izvješćivanje o svakom pojedinačnom auditu, te za propisivanje potrebnih korektivnih odnosno preventivnih radnji kao rezultata audita.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0030-0008"},{"char_end":10741,"char_start":6382,"chunk_id":"CHUNK-DOC-0030-0009","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0030","heading_path":"SADRŽAJ [line 29] > 6. POSTUPAK [line 133]","next_chunk_id":"CHUNK-DOC-0030-0010","previous_chunk_id":"CHUNK-DOC-0030-0008","sequence":9,"source_sha256":"a8f111bb893d0f04794ad01fb22434c1614752700467833acfa0db2d63a9fe2c","text":"## 6. POSTUPAK\n\n### 6.1 Vrste audita\n\nPostupak uređuje aktivnosti postupanja i kod unutrašnjeg (internog) i kod vanjskog (eksternog) audita.\n\nInterni audit primjenjuje se za provjeru izvedenih aktivnosti u području poslovanja Enconeta, a provodi ga osoblje Enconeta ili njegovi suradnici.\n\nVanjski audit provodi osoblje Enconeta ili njegovi suradnici na lokaciji podizvođača Enconeta i/ili isporučitelja proizvoda i usluga.\n\nVoditelj QA poslova predlaže godišnji plan internih i vanjskih audita koje treba provesti u tekućoj kalendarskoj godini, a odobrava ga direktor Enconeta. Godišnji plan audita dokumentira se na obrascu prikazanom u Prilogu 7.6 Godišnji plan audita.\n\n### 6.2 Učestalost audita\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                                Oznaka dok: PP-82-01\nAUDITI                                                                             Rev: 6           Str: 5/15\n\nInterni audit radi provjere uspješnosti SUK-a uobičajeno se provodi svake godine, ali prema prijedlogu voditelja QA poslova i predstavnika direktora za nadzor SUK-a, audit se može provesti u svakom trenutku radi ocjene uspješnosti bilo kojeg elementa, procesa, postupka ili aktivnosti.\n\nU ciklusu od tri godine, program internih audita mora pokriti zahtjeve cjelokupnog SUK-a, a samim time i zahtjeve postavljene u svim kriterijima ISO 9001 i 10CFR50 App. B.\n\nVanjski audit provodi se u skladu s QA zahtjevima sadržanim u ugovornim dokumentima. Učestalost i vremenski raspored audita usuglašava voditelj QA poslova Enconeta i odgovorna osoba za QA poslove kod ugovornog partnera.\n\nVanjski auditi se provode neizostavno kod podizvođača, suradnika i / ili dobavljača proizvoda i usluga na području nuklearnih djelatnosti, a u skladu sa zahtjevima za kvalifikaciju prema 10CFR50, Appendix B.\n\nAuditi, vanjski i unutrašnji, također se mogu provesti u slučaju reorganizacije, modifikacije ili revizije SUK-a, a posebno ukoliko postoji opravdana sumnja u kvalitetu proizvoda i usluga, ili ako je neophodna potvrda za primjenu popravnih i/ili preventivnih radnji.\n\n### 6.3     Nezavisnost i autoritet auditora\n\nVoditelj audit tima ima izravni pristup kod direktora Enconeta za potporu, pomoć i osiguravanje potrebnih resursa, kao i za donošenje odgovarajućih rješenja i odluka ukoliko se pojave problemi tijekom postupka ocjenjivanja.\n\nAudit tim mora imati dovoljne ovlasti za pristup relevantnim dokumentima, mjestima i osoblju tijekom audita. Ipak, svaki član audit tima trebao bi se pridržavati zahtjeva o sigurnosti i povjerljivosti, i ne bi trebao ometati ili prekidati rutinske aktivnosti organizacije/odjela koji se ocjenjuje.\n\nOsoblje koje je izravno odgovorno za procese, aktivnosti, zadatke ili discipline, koje se trebaju auditirati, neće biti izabrano u audit tim za ocjenjivanje kvalitete u tom slučaju.\n\nPojedinci koji izvode neki proces, aktivnost, zadatak ili posao koji se treba auditirati neće biti izabrani u audit tim.\n\n### 6.4     Kvalifikacije članova audit tima\n\nOpćenito\n\nSvi članovi audit tima odabrat će se na temelju njihovog obrazovanja, iskustva i osposobljenosti.\n\nČlan audit tima (Auditor) treba biti inženjer ili druga stručna osoba, s temeljnim i širokim znanjem o relevantnim zakonima, propisima i standardima, te metodama i načinima ocjenjivanja.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                                 Oznaka dok: PP-82-01\nAUDITI                                                                              Rev: 6            Str: 6/15\n\nVoditelj audit tima za ocjenjivanje (Lead Auditor) treba imati sve kvalifikacije potrebne za auditora i barem dvije godine iskustva u ocjenjivanju kvalitete, te prikladne sposobnosti za organizaciju, komunikaciju, procjenu, dokumentaciju i izvješćivanje o auditu.\n\nSvi članovi audit tima trebaju imati odgovarajuće iskustvo u tehničim disciplinama koje se trebaju ocjenjivati. Cijeli audit tim treba sastaviti tako da se posjeduje dovoljno iskustva i prakse za sva tehnička područja koja treba provjeriti.\n\nPrije određenog audita može se provesti odgovarajuće i primjereno uvježbavanje s obzirom na područje provjere, ciljevima koji se žele postići, te pristupu kod ocjenjivanja i tehnikama i metodama koje će se primjenjivati.\n\nSpisak kvalificiranih auditora Enconeta nalazi se u prilogu 7.5.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0030-0009"},{"char_end":11274,"char_start":10741,"chunk_id":"CHUNK-DOC-0030-0010","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0030","heading_path":"SADRŽAJ [line 29] > Zahtjevi za Lead Auditor-a [line 193]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0030-0009","sequence":10,"source_sha256":"a8f111bb893d0f04794ad01fb22434c1614752700467833acfa0db2d63a9fe2c","text":"## Zahtjevi za Lead Auditor-a\n\nLead Auditor-i moraju zadovoljavati slijedeće zahtjeve:\n\n-Sudjelovanje u najmanje pet QA audita unutar tri posljednje godine prije datuma kvalifikacije. Jedan audit mora biti na nuklearnom području unutar posljednje godine prije kvalifikacije.\n\n-Mora imati dobru i efektivnu komunikaciju, govornu i pisanu.\n\n-Mora imati redoviti trening da bi održao vještinu izvođenja audita.\n\n-Mora sakupiti najmanje deset bodova na Lead Auditor Qualification Score Sheet, Prilog 7.7.\n\n-Mora položiti pismeni ispit.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0030-0010"},{"char_end":12052,"char_start":11542,"chunk_id":"CHUNK-DOC-0030-0012","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0030","heading_path":"SADRŽAJ [line 29] > Održavanje vještine za Lead Auditor-a [line 211]","next_chunk_id":"CHUNK-DOC-0030-0013","previous_chunk_id":null,"sequence":12,"source_sha256":"a8f111bb893d0f04794ad01fb22434c1614752700467833acfa0db2d63a9fe2c","text":"## Održavanje vještine za Lead Auditor-a\n\n-Aktivno i redovito učestvovanje u planiranom procesu auditiranja.\n\n-Praćenje kodova, standarda, procedura, instrukcija i drugih dokumenata koji se odnose na QA programe i auditiranje.\n\n-Učestvovanje na programima treninga.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                                Oznaka dok: PP-82-01\nAUDITI                                                                             Rev: 6            Str: 7/15\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0030-0012"},{"char_end":13430,"char_start":12052,"chunk_id":"CHUNK-DOC-0030-0013","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0030","heading_path":"SADRŽAJ [line 29] > 6.5     Priprema audita [line 224]","next_chunk_id":"CHUNK-DOC-0030-0014","previous_chunk_id":"CHUNK-DOC-0030-0012","sequence":13,"source_sha256":"a8f111bb893d0f04794ad01fb22434c1614752700467833acfa0db2d63a9fe2c","text":"## 6.5     Priprema audita\n\n### Najava\n\nVoditelj tima za ocjenjivanje kvalitete mora najaviti interni audit ili vanjsko ocjenjivanje kvalitete 15 dana prije provođenja audita. Voditelj tima treba izvijestiti direktora Enconeta o točnim datumima ocjenjivanja. Podaci se upisuju u obrazac OB-OAD-017 priložen u točki 7. ovog postupka koji se dostavlja svim uključenim osobama.\n\n### Upitnik za provođenje audita\n\nVoditelj audit tima za ocjenjivanje treba pripremiti upitnik za provođenje audita, te ga usuglasiti s voditeljem QA poslova. Upitnik se mora izraditi sukladno priznatim međunarodnim standardima, relevantnom QA sustavu/programu, ugovornim dokumentima i dobroj stručnoj praksi. Za interne audite pitanja se upisuju u obrazac OB-UAD-018 priložen u točki 7. ovog postupka, te se dostavljaju auditiranom osoblju ili vođama projekata i/ili procesa koja se ocjenjuju, 7 dana prije provođenja audita. Za vanjske audite lista pitanja se ne šalje na uvid unaprijed.\n\n### Uvodni sastanak\n\nVoditelj audit tima treba organizirati uvodni sastanak kako bi upoznao članove tima i osoblje s ciljevima ocjenjivanja, odredio pristup i raspored provjere u dogovoru s rukovodećim osobljem organizacije/odjela koji treba ocjeniti, te kako bi zatražio administrativnu podršku tijekom provođenja audtia. Podaci o sastanku upisuju se u obrazac OB-IAD-020 priloženom u točki 7. ovog postupka.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0030-0013"},{"char_end":14156,"char_start":13430,"chunk_id":"CHUNK-DOC-0030-0014","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0030","heading_path":"SADRŽAJ [line 29] > 6.6     Provođenje audita [line 238]","next_chunk_id":"CHUNK-DOC-0030-0015","previous_chunk_id":"CHUNK-DOC-0030-0013","sequence":14,"source_sha256":"a8f111bb893d0f04794ad01fb22434c1614752700467833acfa0db2d63a9fe2c","text":"## 6.6     Provođenje audita\n\nUobičajeno se audit provodi tako da se kombiniraju:\n\n- Pregled sustava upravljanja, organizacijskih i funkcionalnih veza\n- Priručnik kvalitete, postupci i dokumentacija\n- Razgovor s rukovodećim i ostalim osobljem\n- Promatranje odabranih radnih mjesta i aktivnosti\n\nUnaprijed pripremljeni upitnik za provođenje audita treba se koristiti samo kao vodič tijekom provođenja ocjenjivanja, ali ne smije ograničavati područje i ciljeve koji se žele postići.\n\nSvi zaključci i nalazi o kvaliteti trebaju biti zabilježeni na mjestu događaja, te se trebaju raspraviti s uključenim pojedincima, a zatim nezavisno procijeniti. Nalazi audita upisuju se u obrazac OB-NAD-019 priložen u točki 7. ovog postupka.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0030-0014"},{"char_end":15700,"char_start":14156,"chunk_id":"CHUNK-DOC-0030-0015","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0030","heading_path":"SADRŽAJ [line 29] > 6.7     Izvješće o auditu [line 251]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0030-0014","sequence":15,"source_sha256":"a8f111bb893d0f04794ad01fb22434c1614752700467833acfa0db2d63a9fe2c","text":"## 6.7     Izvješće o auditu\n\nNa kraju audita treba održati zajednički sastanak tima za ocjenjivanje sa direktorom i rukovodećim osobljem organizacije / odjela koji se ocjenjivao, kako\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                                 Oznaka dok: PP-82-01\nAUDITI                                                                             Rev: 6            Str: 8/15\n\nbi se razjasnili mogući nesporazumi oko zaključaka i/ili preporuka. Podaci se\nupisuju u obrazac OB-IAD-020 priložen u točki 7. ovog postupka.\n\nNakon što je audit završen, voditelj audit tima treba pripremiti izvješće o auditu\nkoje mora sadržavati najmanje slijedeće:\n\n- područje i ciljeve audita;\n- izjavu voditelja tima za ocjenjivanje o članovima tima i njihovim kvalifikacijama\n- popis osoba kontaktiranih prije, za vrijeme i poslije audita\n- popis pregledanih dokumenata\n- popis radnih mjesta koja su posjećena i ocjenjivana\n- zaključke ili sažetak rezultata audita\n- nesukladnosti koje su utvrđene tijekom audita\n- spisak kriterija i njihova ocjena obzirom na primijenjeni standard / kod\n- prijedloge za popravne radnje.\n\nIzvješće o auditu treba predati u roku od dva tjedna nakon provođenja audita\nvodtelju QA poslova na pregled i odobrenje.\n\nUkoliko postoje značajniji nedostaci i nesukladnosti ili ako su predložene\npopravne radnje, izviješće o auditu također treba pregledati i odobriti direktor\nEnconeta.\n\nVoditelj QA poslova treba procjeniti predložene popravne radnje te nadzirati\nnjihovo provođenje.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0030-0015"},{"char_end":8336,"char_start":6887,"chunk_id":"CHUNK-DOC-0031-0009","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0031","heading_path":"4. DEFINICIJE I KRATICE [line 108] > 6. POSTUPAK [line 166]","next_chunk_id":"CHUNK-DOC-0031-0010","previous_chunk_id":null,"sequence":9,"source_sha256":"9c8b0f352b59bf121a6bff17635753324161eb81187fcb47b21f4b6d626f87f7","text":"## 6. POSTUPAK\n\n### 6.1 Identifikacija nesukladnosti\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                                 Oznaka dok: PP-83-01\nUPRAVLJANJE NESUKLADNIM PROIZVODOM                                                   Rev: 5          Str: 5/10\n\nNesukladnost je nedostatak u karakteristikama, dokumentaciji ili postupku izrade koji prouzrokuje da su kvaliteta ili izvedba proizvoda neprihvatljivi ili neodređeni u odnosu na specificirane zahtjeve. Nesukladnost se može identificirati na osnovu:\n\n- nalaza bilo kojeg djelatnika Enconeta,\n- nalaza internog audita ili audita treće strane,\n- nalaza recenzenta,\n- reklamacije kupca (nakon isporuke proizvoda).\n\nBilo koji djelatnik Enconeta, koji nađe proizvod ili proces koji ne odgovara specificiranim zahtjevima ili primijeti abnormalno ponašanje, dužan je to zabilježiti i izvjestiti odgovorne osobe na jedinstvenom obrascu OB-NCR-016, «Izvješće o nesukladnosti» priloženom u točki 7 ove procedure.\n\nKriteriji za identifikaciju stanja i događaja kao nesukladnosti mogu biti:\n- fizičko oštećenje proizvoda,\n- odstupanje od specificiranih zahtjeva za proizvod,\n- odstupanje od propisanog postupka izrade, pregleda, ispitivanja itd.,\n- propusti (greške) osoblja u primjeni radnih instrukcija,\n- dokumentacija koja sadrži neispravne ili nepotpune informacije,\n- nepostojanje propisanog zapisa kvalitete,\n- odstupanje od plana i planiranih aktivnosti.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0031-0009"},{"char_end":12583,"char_start":8336,"chunk_id":"CHUNK-DOC-0031-0010","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0031","heading_path":"4. DEFINICIJE I KRATICE [line 108] > 6.2 Izvješćivanje o nesukladnosti [line 193]","next_chunk_id":"CHUNK-DOC-0031-0011","previous_chunk_id":"CHUNK-DOC-0031-0009","sequence":10,"source_sha256":"9c8b0f352b59bf121a6bff17635753324161eb81187fcb47b21f4b6d626f87f7","text":"## 6.2 Izvješćivanje o nesukladnosti\n\nOsoba koja je uočila nesukladnost o tome odmah izvješćuje voditelja posla, koji poduzima hitne mjere kako bi se nesukladni proizvod označio i izolirao radi spriječavanja daljnje uporabe, kao i druge svrsishodne mjere da se minimiziraju neželjeni efekti nesukladnosti.\n\nFormalno izvješće o nesukladnosti (Non-Conformance Report - NCR) provodi se na jedinstvenom obrascu OB-NCR-016 kako bi se osigurala djelotvorna sljedivost. Svako NCR izvješće treba sadržavati slijedeće podatke:\n- oznaku nesukladnog proizvoda/usluge, procesa, aktivnosti, dokumentacije,\n- prema potrebi fizičku oznaku kojom je označen proizvod/usluga radi praćenja i spriječavanja daljnjeg korištenja,\n- tko je identificirao nesukladnost,\n- opis nesukladnosti,\n- eventualno poduzete hitne mjere da se umanje neželjeni efekti nesukladnosti.\n\nOtvaranje NCR-a obavlja ili inicira osoba koja je uočila nesukladnost. Najprije, u Sekciji I, upisuje oznaku proizvoda/usluge, procesa, aktivnosti i dokumentacije u kojima je uočena nesukladnost. Zatim, u Sekciji II, daje opis nesukladnosti (opis treba biti dovoljno detaljan da omogući daljnji pregled i anlizu nesukladnosti), te svoje ime i prezime, potpis i datum identifikacije nesukladnosti. Takvo NCR izvješće dostavlja voditelju QA na pregled i daljnji postupak.\n\nVoditelj QA analizira svaku nesukladnost u smislu utjecaja na već prije izvršeni posao te predlaže direktoru Enconeta o potrebi obavještavanja kupca/naručitelja o mogućem negativnom utjecaju na isporučeni proizvod/projekt/uslugu. Enconet i kupac/naručitelj zajednički definiraju korektivne akcije i određuju nivo izvještavanja, uključujući i izvještavanje u skladu sa zahtjevima 10CFR Part21.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                                Oznaka dok: PP-83-01\nUPRAVLJANJE NESUKLADNIM PROIZVODOM                                                  Rev: 5          Str: 6/10\n\n### 6.3      Izvješćivanje o 10CFR21\n\nPostupak dokumentiranja nesukladnosti i korektivnih akcija otkriva da li postoji odstupanje ili greška koja bi mogla prouzrokovati značajni sigurnosni problem.\n\nEvaluaciju/screening prema 10CFR21 izvodi QA voditelj unutar 60 dana od dana otkrivanja odstupanja. Ukoliko se identificira odstupanje, ali se ne može zaključiti kakav je utjecaj na operabilnost, klijent-naručitelj-kupac (NE Krško) mora biti obaviješten unutar 5 dana od trenutka otkrića. Od tog trenutka klijent-naručitelj-kupac (NE Krško) preuzima obavezu za daljnju evaluaciju.\n\nOdstupanje na osnovnoj komponenti (basic component) koje se identificira kao problem opisan u 10CFR21 i koje bi moglo prouzrokovati značajni sigurnosni problem (substantial safety hazard), potrebno je izvijestiti na više instance prema zahtjevima koda. Za izvješćivanje je odgovoran direktor Enconeta.\n\nNakon pregleda informacije i zaključka da je odstupanje vrlo vjerojatno problem opisan u 10CFR21, mora biti obaviješten direktor i to najkasnije 5 dana nakon završenog screeninga/evaluacije. Direktor mora obavijestiti klijenta-naručitelja-kupca (NE Krško) i u suradnji s njime izvijestiti regulatorni organ (NRC) unutar 2 dana. Službeno pismo NRC-u mora biti dostavljeno unutar 30 dana.\n\nUkoliko se tijekom izvođenja poslova, projekata, analiza i ostalih aktivnosti prema NE Krško ukaže potreba izvještavanja u skladu s 10CFR Part 21, Enconet će izvještaj uputiti direktno na adresu:\n                    Zvonimir Zec, Superintendent Engineering Support\n                                   Nuklearna Elektrana Krško\n                               8270 Krško, Vrbina 12, Slovenija\n                                     FAX: +386 7 49 21 258\n\nU slučaju da Enconet u svom radu na nekom drugom objektu naiđe na potrebu izvještavanja u skladu s 10CFR Part 21, o problematici koja je primjenjiva i na NE Krško, također će izvijestiti i NE Krško.\n\nU procesu izvješćivanja potrebno je pokrenuti korektivne akcije, izvršiti analizu greške (root cause anlysis) i provjeravati uspješnost primjene korektivnih zahvata.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                Oznaka dok: PP-83-01\nUPRAVLJANJE NESUKLADNIM PROIZVODOM                                Rev: 5      Str: 7/10\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0031-0010"},{"char_end":15107,"char_start":12583,"chunk_id":"CHUNK-DOC-0031-0011","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0031","heading_path":"4. DEFINICIJE I KRATICE [line 108] > Part 21 Timeline [line 238]","next_chunk_id":"CHUNK-DOC-0031-0012","previous_chunk_id":"CHUNK-DOC-0031-0010","sequence":11,"source_sha256":"9c8b0f352b59bf121a6bff17635753324161eb81187fcb47b21f4b6d626f87f7","text":"## Part 21 Timeline\n\n| 60 Days | 5 Working Days | 2 Days | 30 Days |\n|---------|----------------|--------|---------|\n| Evaluation | | | Notification |\n\n| Discovery | Evaluation Completion or Interim Report | Inform Responsible Officer | Initial Notification | Written Notification |\n|-----------|----------------------------------------|----------------------------|----------------------|----------------------|\n| For Suppliers: 5 Working days to notify customer, if not capable of performing the evaluation | | | | |\n\n### 6.4 Pregled i klasifikacija nesukladnosti\n\nNa osnovu prijavljene nesukladnosti (NCR izvješće) voditelj QA, u konzultaciji s voditeljem posla, pregledava i provjerava sve njegove navode te formalno potvrđuje otvaranje NCR-a, odnosno postupka rješavanja nesukladnosti.\n\nPri pregledu nesukladnog proizvoda treba utvrditi i u Sekciju III upisati:\n- uzrok nastajanja te mjere i postupak za ispravljanje nesukladnosti,\n- klasifikaciju nesukladnosti.\n\nPrema opsegu i mogućem negativnom utjecaju na kvalitetu te načinu rješavanja, nesukladnost se klasificira kao:\n\na) Manja nesukladnost\n   - ima mali negativni utjecaj na kvalitetu i izvedbu proizvoda,\n   - pojavljuje se prvi puta ili rijetko,\n   - zbog malog utjecaja i važnosti nije potrebna dublja analiza uzroka,\n   - nesukladnost se otklanja bez otvaranja korektivne radnje,\n   - potrebno ih je stalno pratiti radi eventualnog češćeg ponavljanja.\n\nb) Veća nesukladnost\n   - ima značajan negativni utjecaj na kvalitetu i izvedbu proizvoda,\n   - ako se ponovi tri i više puta, svaka nesukladnost se tretira kao veća,\n   - potrebno je pokretanje postupka korektivne radnje za pronalaženje korijenskog uzroka kako bi se, osim otklanjanja nesukladnosti, osiguralo da se ista ili slična nesukladnost ne bi ponovila.\n\nc) Kritična nesukladnost\n   - može ugroziti sigurnost ljudi,\n   - može izazvati znatne materijalne štete i gubitke,\n   - može izazvati trajne posljedice u okolišu,\n   - potrebna je mjera zaustavljanja procesa i daljnjih radova (PP-73-01, tč. 6.9).\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                                Oznaka dok: PP-83-01\nUPRAVLJANJE NESUKLADNIM PROIZVODOM                                                  Rev: 5          Str: 8/10\n-    mora se izvještavati u skladu sa zahtjevima 10CFR Part 21\n\nOdluku o važnosti nesukladnosti i njezinoj klasifikaciji donosi voditelj QA u konzultaciji s voditeljem posla gdje je nesukladnost identificirana, imajući u vidu zahtjeve i želje kupca.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0031-0011"},{"char_end":16037,"char_start":15107,"chunk_id":"CHUNK-DOC-0031-0012","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0031","heading_path":"4. DEFINICIJE I KRATICE [line 108] > 6.5      Označivanje nesukladnosti [line 284]","next_chunk_id":"CHUNK-DOC-0031-0013","previous_chunk_id":"CHUNK-DOC-0031-0011","sequence":12,"source_sha256":"9c8b0f352b59bf121a6bff17635753324161eb81187fcb47b21f4b6d626f87f7","text":"## 6.5      Označivanje nesukladnosti\n\nVoditelji projekata/posla dužni su da se, utvrđena nesukladnost označi na proizvodu odnosno dokumentu, vidljivo i na svrsishodan način (natpis, naljepnica, žig, posebno odlaganje i sl.), kako bi se spriječilo daljnje korištenje do iznalaženja prihvatljivog rješenja. Nesukladni i označeni proizvod ili dokument povlači se iz uporabe i odlaže na izolirano mjesto. Ako je potrebna, vidljiva oznaka ispisuje se tekstom Normal Arial 20 B.\n\n```\nNESUKLADNOST\n```\n\nUkoliko se radi o kritičnoj nesukladnosti koja može izazvati znatne materijalne štete i gubitke radi nekvalitete, te ugroziti sigurnost ljudi i izazvati trajne posljedice u okolišu, voditelj QA poslova može donijeti odluku o zaustavljanju procesa i daljnjih radova do donošenja odgovarajućeg rješenja nesukladnosti. Oznaka se vidljivo otiskuje žigom na odgovarajućim mjestima i dokumentima.\n\n```\nQA    ZAUSTAVLJENI\n      RADOVI\n```\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0031-0012"},{"char_end":17315,"char_start":16037,"chunk_id":"CHUNK-DOC-0031-0013","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0031","heading_path":"4. DEFINICIJE I KRATICE [line 108] > 6.6      Rješavanje nesukladnosti proizvoda/dispozicija [line 299]","next_chunk_id":"CHUNK-DOC-0031-0014","previous_chunk_id":"CHUNK-DOC-0031-0012","sequence":13,"source_sha256":"9c8b0f352b59bf121a6bff17635753324161eb81187fcb47b21f4b6d626f87f7","text":"## 6.6      Rješavanje nesukladnosti proizvoda/dispozicija\n\nSvaki nesukladni proizvod, pri pregledu, treba podvrgnuti stručnoj ocjeni te, osim uzroka nastajanja, utvrditi način, mjere i postupak za otklanjanje nesukladnosti. Rezultat takve ocjene može biti da se nesukladni proizvod:\n\na) Prihvaća kakav jest;\nb) Doradi tako da zadovolji propisane zahtjeve;\nc) Prenamjeni za drugu primjenu;\nd) Odbije ili odbaci.\n\nVoditelj QA, u konzultaciji s voditeljem posla, utvrđuje rezultat ocjene i nositelja rješavanja nesukladnosti te ih upisuje u Sekciju IV.\n\nNositelj rješavanja provodi mjere i postupak za rješavanje nesukladnosti. Svojim potpisom potvrđuje da je nesukladnost otklonjena te o tome izvještava voditelja projekta/posla i voditelja QA. Nesukladni proizvod koji je dorađen treba ponovo pregledati i verificirati na isti način kao i izvorni proizvod.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                               Oznaka dok: PP-83-01\nUPRAVLJANJE NESUKLADNIM PROIZVODOM                                                 Rev: 5         Str: 9/10\n\nUkoliko je to ugovorna obveza, prijedlog uporabe ili dorade proizvoda koji nije\nsukladan propisanim zahtjevima, mora se dostaviti na odobrenje korisniku ili\nnjegovom predstavniku.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0031-0013"},{"char_end":18243,"char_start":17315,"chunk_id":"CHUNK-DOC-0031-0014","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0031","heading_path":"4. DEFINICIJE I KRATICE [line 108] > 6.7      Korektivne i preventivne radnje [line 321]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0031-0013","sequence":14,"source_sha256":"9c8b0f352b59bf121a6bff17635753324161eb81187fcb47b21f4b6d626f87f7","text":"## 6.7      Korektivne i preventivne radnje\n\nSvaka veća i kritična nesukladnost (vidi 6.4) zahtijeva pokretanje korektivne\nradnje što obuhvaća i adekvatnu analizu uzroka pojavljivanja nesukladnosti\nradi njezinog otklanjanja i sprečavanja ponavljanja. Preventivne radnje provode\nse u svrhu otklanjanja potencijalnih nesukladnosti i sprečavanje njihovog\nponavljanja.\n\nVoditelj QA otvara korektivnu/preventivnu radnju i, u konzultaciji s voditeljem\nprojekta/posla, predlaže nositelja rješavanja radnje. U Sekciju V. upisuje ime\nnositelja i broj korektivne/preventivne radnje. Direktor odobrava\nkorektivnu/preventivnu radnju i njezinog nositelja.\n\nPostupak korektivne i preventivne radnje provodi se prema proceduri PP-85-01\n«Korektivne i preventivne radnje» (Ref.5).\n\nKorektivne i preventivne radnje i odgovarajuće probleme treba stalno pratiti kako\nbi se utvrdilo da li su radnje uspješne u preventivi ponavljanja nesukladnosti.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0031-0014"},{"char_end":5365,"char_start":4198,"chunk_id":"CHUNK-DOC-0032-0007","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0032","heading_path":"SADRŽAJ [line 29] > 5.       ODGOVORNOSTI [line 106]","next_chunk_id":"CHUNK-DOC-0032-0008","previous_chunk_id":null,"sequence":7,"source_sha256":"bb69e2d82f822726e90caf59dba51271ea3a50259f96505656791b659583bbdf","text":"## 5.       ODGOVORNOSTI\n\nDirektor Enconeta odgovoran je za uspostavu sustava i odobravanje popravnih i\npreventivnih radnji.\n\nVoditelji projekata odgovorni su za identifikaciju nesukladnosti, te iniciranje i\nprovođenje popravne ili preventivne radnje. Sudjeluju u analizi uzroka i\nrješavanju problema.\n\nVoditelj QA poslova odgovoran je za pregled nesukladnosti, analize uzroka i\nprijedloga popravne i/ili preventivne radnje, te za potvrđivanje završetka\nprovedenih radnji. Odgovoran je za identifikaciju nesukladnosti i pokretanje\npopravnih radnji kod podizvođača Enconeta.\n\nVoditelj QA poslova odgovoran je za nadzor provođenja mjera i djelovanje\nsustava za popravne i preventivne radnje, te za izvješćivanje svih pojedinaca,\ngrupa i odjela na koje se te mjere odnose. Izvješćuje o svim nesukladnostima\nkoje su utvrđene u aktivnostima, procesima ili uslugama koje daje ili izvodi\nEnconet ili njegovi podizvođači.\n\nVoditelj QA poslova vodi evidenciju i izvješćuje direktora Enconeta o statusu\nsvih uvedenih popravnih i preventivnih radnji.\n\nSvaki djelatnik u Enconetu odgovoran je za provođenje popravne i/ili\npreventivne radnje za djelatnosti u svom području rada.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0032-0007"},{"char_end":6366,"char_start":5365,"chunk_id":"CHUNK-DOC-0032-0008","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0032","heading_path":"SADRŽAJ [line 29] > 6.       POSTUPAK [line 132]","next_chunk_id":"CHUNK-DOC-0032-0009","previous_chunk_id":"CHUNK-DOC-0032-0007","sequence":8,"source_sha256":"bb69e2d82f822726e90caf59dba51271ea3a50259f96505656791b659583bbdf","text":"## 6.       POSTUPAK\n\nSve uočene nesukladnosti, nedostaci i odstupanja koja loše utječu na kvalitetu\nposlova i usluga koje daje ili izvodi Enconet moraju se kontrolirati, analizirati i\nispravljati.\n\nProvođenje popravne i/ili preventivne radnje kao posljedice uočene nesukladnosti\nu aktivnostima, procesima i sustavu, kroz rješavanje prijavljenog problema,\nevidentiraju se u obrascu OB-NCR-016 priloženom u postupku PP-83-01 (Ref. 5)\na provode se sukladno zahtjevima ovog postupka.\n\nPopravne i/ili preventivne radnje kao posljedica nalaza kvalitete bilo koje\nodgovorne osobe, ili kao rezultat nezavisnog ocjenjivanja kvalitete ili kao\nposljedica reklamacije kupca, iniciraju se i provode ispunjavanjem obrasca OB-\nZPR-015 priloženog u točki 7. ovog postupka.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                               Oznaka dok: PP-85-01\nPOPRAVNE I PREVENTIVNE RADNJE                                                     Rev: 4            Str:   5/7\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0032-0008"},{"char_end":9324,"char_start":6366,"chunk_id":"CHUNK-DOC-0032-0009","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0032","heading_path":"SADRŽAJ [line 29] > 6.1      Popravne radnje [line 153]","next_chunk_id":"CHUNK-DOC-0032-0010","previous_chunk_id":"CHUNK-DOC-0032-0008","sequence":9,"source_sha256":"bb69e2d82f822726e90caf59dba51271ea3a50259f96505656791b659583bbdf","text":"## 6.1      Popravne radnje\n\nPopravne radnje predstavljaju mjere koje se poduzimaju za uklanjanje već\nnastalih odstupanja, grešaka, nedostataka, nedosljednosti i neslaganja sa\nzakonodavnim i ugovornim zahtjevima te zahtjevima Priručnika kvalitete i\nprogramskih postupaka Enconeta.\n\nJednostavne i jednokratne popravne radnje poduzimaju se kada je njihova\nprovedba laka i brza, a odstupanja su manja ili nemaju značajnog utjecaja na\nkvalitetu. Takve radnje iniciraju i koordiniraju voditelji projekata u čijem se\npodručju rada provodi predložena aktivnost. Odluku o provođenju popravne\nradnje i nositelja aktivnosti odobrava direktor Enconeta, a završetak provedbe i\nzatvaranje postupka potvrđuje voditelj QA poslova.\n\nJednokratne popravne radnje uglavnom ne zahtijevaju promjene dokumentacije\nSUK-a. Voditelj QA poslova periodično, a najmanje jednom godišnje, provodi\nanalizu jednokratnih popravnih radnji radi izvješćivanja direktora i donošenja\nodluke o poduzimanju odgovarajuće popravne/preventivne radnje u SUK-u\n\nPopravne radnje u SUK-u predstavljaju mjere i aktivnosti čija je priprema,\nprovedba i nadzor planirana, s dugoročnim aktivnostima i definiranim očekivanim\nrezultatima. Uzroci popravnih radnji u sustavu kvalitete mogu biti rezultati analize\nuočenih i evidentiranih nesukladnosti tijekom provođenja nezavisnog ocjenjivanja\nkvalitete (unutrašnjeg i vanjskog), iz reklamacija kupaca, radi višekratnog\nponavljanja istih nesukladnosti, poduzimanje mjera unapređenja SUK-a i svi\nostali čimbenici kojima se ostvaruje poboljšanje i spriječava pojava\nnesukladnosti. Ukoliko se popravne radnje odnose na veća i kritična odstupanja\nu smislu sigurnosti, potrebno je učiniti screening i analizu odstupanja, inicirati\npotrebna izvještavanja i korektivne akcije te pratiti izvršenje i uspješnost\nprovođenja korektivnih mjera. Korektivne akcije moraju spriječiti ponavljanje\ntakovih grešaka i odstupanja.\n\nNakon pokretanja postupka popravne radnje, diretkor Enconeta kod donošenja\nodluke prema potrebi saziva sastanak s predlagateljem, voditeljem QA poslova,\npredstavnikom uprave za praćenje QA poslova i ostalima koji mogu doprinijeti u\nrješavanju uočene nesukladnosti, nedostatka, greške ili odstupanja. Ukoliko se\nodobri popravna radnja, imenuje se nositelj aktivnosti i određuju se rokovi za\nprovođenje radnje. Nesukladnosti po 10CFR Part 21 i one vezane za odstupanja\nod zahtijevane kvalitete moraju se rješavati na najvišem nivou Enconeta,\nuključujući odbor za kvalitetu. Ovisno o složenosti problema okuplja se radna\ngrupa za provedbu i odobravaju se potrebni resursi. Definira se dokumentacija\nkoja će se izraditi, kontrolne aktivnosti koje će se provesti i mjerila učinkovitosti\nprovedene popravne radnje. Rezultat popravne radnje u SUK-u je izrada nove ili\nrevizija postojeće dokumentacije sustava kvalitete. Sve aktivnosti tijekom\npostupka se dokumentiraju i predstavljaju sastavni dio izvješća o nesukladnosti\nprema obrascu OB-NCR-016 (Ref. 5).\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0032-0009"},{"char_end":11876,"char_start":9324,"chunk_id":"CHUNK-DOC-0032-0010","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0032","heading_path":"SADRŽAJ [line 29] > 6.2      Preventivne radnje [line 200]","next_chunk_id":"CHUNK-DOC-0032-0011","previous_chunk_id":"CHUNK-DOC-0032-0009","sequence":10,"source_sha256":"bb69e2d82f822726e90caf59dba51271ea3a50259f96505656791b659583bbdf","text":"## 6.2      Preventivne radnje\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                              Oznaka dok: PP-85-01\nPOPRAVNE I PREVENTIVNE RADNJE                                                     Rev: 4           Str:    6/7\n\nPreventivne radnje predstavljaju planirane i poduzete aktivnosti radi poboljšanja postojećeg SUK-a, kako bi se izbjegle možebitne nesukladnosti. One nisu uzrokovane utvrđenim nesukladnostima već se temelje na analizama, rezultatima, informacijama i podacima prikupljenim kroz:\n\n- Promjene u politici tvrtke;\n- Promjene u organizacijskoj strukturi i resursima;\n- Nepostojanje ili manjkavost postupaka SUK-a;\n- Izvješća o provedenom nezavisnom ocjenjivanju kvalitete;\n- Izvješća o nesukladnostima (NCR);\n- Zapise kvalitete;\n- Ocjene SUK-a od strane uprave;\n- Izvješća voditelja QA poslova;\n- Reklamacije kupaca/korisnika;\n- Ostale izvore koji mogu inicirati unapređenja.\n\nPreventivnim radnjama otkrivaju se i uklanjaju uzroci mogućih nesukladnosti, te se unapređuje cjelokupni SUK.\n\nUobičajeno se preventivne radnje iniciraju preko obrasca OB-ZPR-015, ali poticaj za usvajanje mjera za poboljšanje i unapređenje SUK-a može doći kako od članova uprave tako i od pojedinih stručnjaka u raznim područjima djelovanja Enconeta. Voditelji projekata moraju barem jednom godišnje provesti analizu djelovanja i učinkovitosti SUK-a u svom području rada kako bi mogli procijeniti potrebu i mogućnosti iniciranja i provedbe preventivnih radnji. Izvješća se dostavljaju direktoru Enconeta i voditelju QA poslova, a analiziraju se na sastancima o praćenju SUK-a.\n\nOdluku o pokretanju preventivne radnje donosi direktor Enconeta u suradnji s predstavnikom direktora za praćenje QA poslova i voditeljem QA poslova, kao i voditeljem projekata u čijem se području rada provodi preventivna radnja odnosno koji se određuje za nositelja aktivnosti. Okuplja se radna grupa za provedbu i odobravaju se potrebni resursi. Definira se dokumentacija koja će se izraditi, kontrolne aktivnosti koje će se provesti i mjerila učinkovitosti provedene preventivne radnje. Utvrđuje se i vremensko razdoblje u kojem će se pratiti rezultati provedbe preventivne radnje o čemu će se izvještavati direktor Enconeta i voditelj QA poslova.\n\n### 6.3 Dokumentacija\n\nDokumentacija koja je nastala tijekom iniciranja, provođenja i praćenja učinkovitosti popravne/preventivne radnje predstavlja zapise kvalitete i razvrstana je u dokumente klase ZK1 i ZK2, te se za nju primjenjuju zahtjevi prema postupku PP-42-02 (Ref. 6).\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0032-0010"},{"char_end":13129,"char_start":11876,"chunk_id":"CHUNK-DOC-0032-0011","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0032","heading_path":"SADRŽAJ [line 29] > 7. PRILOZI [line 230]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0032-0010","sequence":11,"source_sha256":"bb69e2d82f822726e90caf59dba51271ea3a50259f96505656791b659583bbdf","text":"## 7. PRILOZI\n\n### 7.1 Obrazac: OB-ZPR-015 Zahtjev za popravnom/preventivnom radnjom\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak                                                        Oznaka dok:PP-85-01\nPOPRAVNE I PREVENTIVNE RADNJE                                              Rev: 4           Str:  7/7\n\n7.1 Obrazac: OB-ZPR-015 Rev. 4\n\n| ZAHTJEV ZA |\n| POPRAVNOM / PREVENTIVNOM |\n| RADNJOM ZH-POR-XX |\n\n| popravna radnja □ | preventivna radnja □ |\n|-------------------|------------------------|\n| I |\n| Opis odstupanja i predlagana popravna/preventivna radnja: |\n| |\n| Predlagatelj: | Potpis: | Datum: |\n| II |\n| Određivanje potencijalnog ili stvarnog uzroka odstupanja |\n| |\n| Evaluacija potrebnih akcija da se odstupanja ne ponove |\n| |\n| Potrebna evaluacija po 10CFR Part 21 | DA □ | NE □ |\n| |\n| QA voditelj: | Potpis: | Datum: |\n| III |\n| Odobrenje primjene predloženih akcija | DA □ | NE □ |\n| Imenovan nositelj aktivnosti:______________________________ |\n| |\n| Direktor Enconeta: | Potpis: | Datum: |\n| Rok izvršenja: |\n| IV |\n| Zapisi o poduzetim akcijama |\n| |\n| Nositelj aktivnosti: | Potpis: | Datum: |\n| V |\n| Provjera učinkovitosti poduzetih korektivnih akcija |\n| |\n| Voditelj QA poslova: | Potpis | Datum: |\n\nENCONET d.o.o., Zagreb","viewer_target":"#evidence/chunk/CHUNK-DOC-0032-0011"},{"char_end":6866,"char_start":6848,"chunk_id":"CHUNK-DOC-0038-0018","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0038","heading_path":"4 INSTRUCTIONS [line 159]","next_chunk_id":"CHUNK-DOC-0038-0019","previous_chunk_id":null,"sequence":18,"source_sha256":"f6b570f1d622dc8ab6d3ca2c0d39a88c37135a3528699c48c86b0add9e2dd649","text":"# 4 INSTRUCTIONS\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0038-0018"},{"char_end":9348,"char_start":6866,"chunk_id":"CHUNK-DOC-0038-0019","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0038","heading_path":"4 INSTRUCTIONS [line 159] > 4.1 V\u0026V of Software Developed by ENCONET d.o.o. [line 161]","next_chunk_id":"CHUNK-DOC-0038-0020","previous_chunk_id":"CHUNK-DOC-0038-0018","sequence":19,"source_sha256":"f6b570f1d622dc8ab6d3ca2c0d39a88c37135a3528699c48c86b0add9e2dd649","text":"## 4.1 V\u0026V of Software Developed by ENCONET d.o.o.\n\n### 4.1.1 Each software developed shall contain specifically developed V\u0026V plan.\n\n### 4.1.2 Preparation of the V\u0026V Plan includes\n1. Software Requirements Specification\n2. Software Design Specification\n3. Software Verification Test Plan\n4. Software Validation Test Plan\n\n### 4.1.3 Software Verification shall be performed during the software development for each determined phase of the software development cycle.\n\n### 4.1.4 Software validation is performed at the end of the implementation phase to ensure that the code satisfies the requirements.\n\n### 4.1.5 The results of software V\u0026V activities shall be documented.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                   Naziv dok: RU-73-02\nSOFTWARE VERIFICATION\nAND VALIDATION CONTROL                                                         Rev.2 Page 9 of 13\n\n4.1.6 The V\u0026V Documentation shall include:\n\n4.1.6.1 Tasks and criteria for accomplishing the verification of the\n        software in each phase.\n\n4.1.6.2 Tasks and criteria for accomplishing the validation of the software\n        at the end of the development cycle.\n\n4.1.6.3 Specification of the hardware and software configurations\n        pertinent to the software verification and validation.\n\n4.1.6.4 Results of the execution of the software verification and validation\n        activities.\n\n4.1.6.5 Results of reviews and tests.\n\n4.1.6.6 Summary of the status of the software.\n\n4.1.7 Verification Reviews shall be established to ensure that planning\n      process of software development and testing is adequately performed.\n\n4.1.7.1 Verification reviews are organized by lead software engineer.\n\n4.1.7.2 Verification reviews shall consist of:\n\n        1. Review of Software Requirements\n        2. Review of Software Design\n        3. Development Documentation Review\n\n4.1.8 Nonconformance identified during the V\u0026V verification reviews shall be\n      documented by the Software Non-Conformance Report (Annex 6.1) and\n      the Software Non-Conformance Report Log Form (Annex 6.2).\n\n4.2 V\u0026V of Purchased Software\n\n4.2.1 All purchased engineering software should have Verification and\n      Validation documentation.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                               Naziv dok: RU-73-02\nSOFTWARE VERIFICATION\nAND VALIDATION CONTROL                                                      Rev.2 Page 10 of 13\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0038-0019"},{"char_end":10804,"char_start":9348,"chunk_id":"CHUNK-DOC-0038-0020","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0038","heading_path":"4 INSTRUCTIONS [line 159] > 5   REFERENCES [line 227]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0038-0019","sequence":20,"source_sha256":"f6b570f1d622dc8ab6d3ca2c0d39a88c37135a3528699c48c86b0add9e2dd649","text":"## 5   REFERENCES\n\n[1.]      ENCONET Nuklearni QA Plan, NP-SUK-001\n\n[2.]      ENCONET, PRIRUČNIK KVALITETE NORMA - ISO 9001:2015, PK-\n          SUK-001\n\n[3.]      IAEA, Quality Assurance for Safety in Nuclear Power Plants and other\n          Nuclear Installations, Code and Safety Guides Q1–Q14, Safety Series\n          No. 50-C/SG-Q (1996).\n\n[4.]      10CFR50, Appendix B, Quality Assurance\n\n[5.]      ANSI/ASME NQA-1-1994, \"Quality Assurance Requirements for\n          Nuclear Facility Applications\"\n\n[6.]      Handbook of Software Quality Assurance Techniques Applicable to\n          Nuclear Industry, Battelle Pacific Northwest Labs, Richland, WA,\n          NUREG-CR-4640, August 1987\n\n[7.]      Manual on Quality Assurance for Computer Software Related to the\n          Safety of Nuclear Power Plants, Technical Reports Series No. 282,\n          IAEA, 1988\n\n[8.]      NE Krško Quality Specification QS600, Quality Assurance Program\n          Specification for Software\n\n[9.]      IEEE Software Engineering Standards, Third Edition\n\n[10.]     ANSI/IEEE Std 828-1990\n\n[11.]     HRN EN ISO 9001:2015\n\n[12.]     IAEA Leadership and Management for Safety, IAEA Safety Standards\n          Series, No. GSR Part 2, IAEA Vienna, 2016.\n\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                       Naziv dok: RU-73-02\nSOFTWARE VERIFICATION\nAND VALIDATION CONTROL                                             Rev.2 Page 11 of 13\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0038-0020"},{"char_end":16567,"char_start":14530,"chunk_id":"CHUNK-DOC-0040-0020","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0040","heading_path":"TEST PROCEDURE                                                ENCONET d.o.o. [line 341]","next_chunk_id":"CHUNK-DOC-0040-0021","previous_chunk_id":null,"sequence":20,"source_sha256":"b12e97e4f426ea923ffcf1e06416309e32b3afef75bc75253be98aa83160115c","text":"# TEST PROCEDURE                                                ENCONET d.o.o.\n\n5.9   Before any test is performed on a valve, the responsible engineer or\n      technician must assure that all plant and/or corporate safety policies and\n      procedures have been read, understood, and will be adhered to.\n\n5.10  All air supplied to the CRANE NUCLEAR Diagnostic System must be clean,\n      filtered air.\n\n5.11  The system needs to stroke the valve over its full range. To properly adjust\n      the travel transducer, ensure that there are no mechanical obstructions in the\n      valve assembly or fingers in the way.\n\n5.12  To prevent electrical injury to personnel and damage to equipment, make\n      sure that electrical power is disconnected before connecting the current input\n      cable.\n\n5.13  Personal injury or equipment damage may result from inadvertent operation\n      of the test valve. Be sure signals generated by CRANE UDS software are at\n      zero (0) before supplying power to the data acquisition box.\n\n5.14  When the \"Start\" button is pressed, the valve will begin to move. Keep hands\n      and fingers away from areas where they can be pinched. Exercise all nor-\n      mal precautions used when testing control valves.\n\n5.15  All normal plant procedures need to be followed, required lockouts done, and\n      pertinent permits obtained before starting to test a valve.\n\n5.16  Leaks can affect test results and valve operation. Carefully, leak check all\n      pressure transducers connections and any other temporary air line\n      connection.\n\n5.17  Since the Lucas 100 and 30 psig pressure transducers are of the same size\n      and shape, ensure that the Lucas 30 psig transducer is ONLY installed on the\n      Instrument/Signal Port (I/P Signal Pressure). The other ports typically\n      produce pressure much greater then 30 psig, which could potentially damage\n      Lucas 30 psig pressure transducer.\n---\nTEST PROCEDURE                                                                           ENCONET d.o.o.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0040-0020"},{"char_end":18070,"char_start":16567,"chunk_id":"CHUNK-DOC-0040-0021","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0040","heading_path":"TEST PROCEDURE                                                ENCONET d.o.o. [line 341] > 6. PREREQUISITES [line 381]","next_chunk_id":"CHUNK-DOC-0040-0022","previous_chunk_id":"CHUNK-DOC-0040-0020","sequence":21,"source_sha256":"b12e97e4f426ea923ffcf1e06416309e32b3afef75bc75253be98aa83160115c","text":"## 6. PREREQUISITES\n\n6.1 Before commencing any work in accordance with this procedure, a Work Order must be issued and approved by responsible person.\n\n6.2 To aid in preparation, testing and analysis, electrical schematic, loop diagrams, P\u0026IDs, valve drawings, and any pertinent AOV maintenance records are necessary.\n\n6.3 A list of actuator sizes and types, and AOV identification numbers are required to serve as the basis for the filling system used to store and track data packages.\n\n6.4 A subsequent walk-down of all valves to be tested is required to determine working conditions, accessibility to lighting and power outlets and the need for scaffolding or any other special work conditions.\n\n6.5 Verify the calibration of all equipment before its use.\n\n6.6 All calibrated tools and equipment that are used, shall be recorded on appropriate Field Data Sheets.\n\n6.7 Steps not used during the test shall be marked \"N/A\".\n\n6.8 Request an equipment clearance (e.g. test tag) for the task specified on the work package.\n\n6.9 For steps in this procedure where direct verbal communication cannot be maintained between all personnel involved in the test, establish communications (radio, intercom, phone) prior to starting those steps.\n\n6.10 To establish communication between the SAM and the DAM, the DAM must be turned on approximately forty (40) seconds prior to executing the universal software.\n---\nTEST PROCEDURE                                                                       ENCONET d.o.o.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0040-0021"},{"char_end":26316,"char_start":18070,"chunk_id":"CHUNK-DOC-0040-0022","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0040","heading_path":"TEST PROCEDURE                                                ENCONET d.o.o. [line 341] > 7. PROCEDURE INSTRUCTION [line 405]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0040-0021","sequence":22,"source_sha256":"b12e97e4f426ea923ffcf1e06416309e32b3afef75bc75253be98aa83160115c","text":"## 7. PROCEDURE INSTRUCTION\n\nSection 7.1 is required before using the CRANE UDS for the first time at a site and should be completed on the main computer to reduce time spent on valve. If the valve database has already been established, proceed to Section 7.2.\n\nSince AOV UDS is a software/hardware package which is inseparable, procedure for each part of the package shall be described.\n\n### 7.1 Universal System Setup\n\n#### 7.1.1 AOV Database Setup\n\n7.1.1.1 From the main menu select Data    Maintenance.\n\n7.1.1.2 Select the AOV Database Editor. This function allows the user to add new AOVs, edit or delete.\n\n7.1.1.3 Add all desired AOV information by choosing NEW from Database Editor menu.\n\n7.1.1.4 Enter the AOV ID, Function and Test Directory, and all related information under AOV Properties. Choose OK to continue.\n\n7.1.1.5 For all new AOVs repeat previous steps.\n\n7.1.1.6 Use the Export/Import option to transfer the database to the SAM.\n\n#### 7.1.2 Transducer Data Setup\n\nNOTE: There are two databases to choose from, permanent or local. The Local Database is a list of temporarily installed transducers, and the Permanent Database which is a list of permanently installed transducers for that particular AOV.\n---\nTEST PROCEDURE                                                                            ENCONET d.o.o.\n\n7.1.2.1 From the main menu select the Transducer icon.\n\n7.1.2.2 From the submenu select NEW to add a new transducer or Edit to change\n        already saved information.\n\n7.1.2.3 Add the transducer information such as: span number, serial number and\n        calibration due data.\n\n7.1.2.4 Repeat steps .2 and .3 for all available transducers on site.\n\n7.1.2.5 Export the transducer database to the SAM by using the Export/Import option.\n\n7.2    Instrumentation Setup\n\n7.2.1 Conduct the pre job briefing.\n\n7.2.2 Notify responsible person prior to starting work. Inform of any external\n      switches that may be installed on the AOV used as interlocks that could\n      potentially actuate other devices.\n\n7.2.3 Collect the appropriate sensors needed for testing.\n\n7.2.4 If required by system outages to provide an alternative air source, a\n      compressor or alternate air source may be utilized with plant approval and\n      proper filtration and pressure regulation is installed.\n\n7.2.5 Record the tag number of the AOV being worked in the appropriate Field Data\n      sheet. Verify the tag number of the AOV is identical to the tag number shown\n      on the Work Package. If the tag number is different, contact the Test\n      Coordinator.\n\n7.2.6 For a linear AOV, examine the valve stem to positioner attachment and\n      determine the best location for the stem attachment.\n\n7.2.7 Attach the displacement transducer to the side of the actuator or valve body\n      using the Transducer Mounting fixture and quick disconnect strap. Align\n      directly over the Stem Attachment, and adjust so that the transducer cable will\n      not be overextended when the valve is seated, and secure the quick\n      disconnect strap.\n---\nTEST PROCEDURE                                                                                 ENCONET d.o.o.\n\n7.2.8 Connect the transducer lanyard (string) to the Stem Attachment. Temporary\n      fittings will be installed to the positioner to facilitate the installation of the Lucas\n      Pressure Transducer.\n\n7.2.9 Examine the valve positioner and identify the signal pressure gauge. If a small\n      pressure gauge is not present on the positioner, examine the tubing\n      connecting the I/P transducer to the positioner for a tee or similar access point.\n      Consult the manufacturer's maintenance literature if there is difficulty\n      identifying this port.\n\n7.2.10 Connect the signal pressure transducer (Lucas 30 psig) to this pneumatic line.\n\n7.2.11 Examine the valve positioner and identify the diaphragm pressure gauge. If\n       the small pressure gauge is not present on the positioner, examine the tubing\n       connecting the diaphragm housing of a diaphragm actuator to the positioner\n       for a tee or similar access point. Consult the manufacturer's maintenance\n       literature if there is difficulty identifying these ports.\n\n7.2.12 Connect the diaphragm pressure transducer (Lucas 100 psig) to the\n       pneumatic lines.\n\n7.2.13 Examine the valve positioner and identify the supply pressure port or\n       connection to the positioner for a gauge, tee or similar access point. Consult\n       the manufacturer's maintenance literature if there is difficulty identifying this\n       port.\n\n7.2.14 Connect the supply pressure transducer (Lucas 100 psig) to the pneumatic\n       line.\n\n7.2.15 Verify that the pressure transducers are installed in accordance with Table 1\n       on page 17, and securely connected.\n\n7.2.16 Turn on the air supply to the valve and check all pressure transducers and\n       bypass lines connections for leaks.\n\n7.2.17 Correct any air leaks before proceeding.\n\n7.2.18 If the existing plant I/P cannot be used or the AOV does not have an I/P and a\n       temporary I/P is to be installed, proceed to the step 7.2.23.\n\nPage 15\n---\nTEST PROCEDURE                                                                             ENCONET d.o.o.\n\n7.2.19 To install temporary I/P verify that the instrument air is isolated and disconnect\n        the existing plant's I/P at the input side of the device.\n\n7.2.20 Use appropriate fittings and tubing's in order to connect the temporary I/P\n        correctly to the instrument side of the AOV positioner.\n\n7.2.21 Turn on the instrument air to the valve and check all the connections on the I/P\n        and to the positioner for leaks.\n\n7.2.22 Correct any air leaks before proceeding.\n\n7.2.23 Install any other transducers that may be required for testing.\n\n7.2.24 Connect the all cables from the sensors to the DAM.\n\n7.2.25 Connect the communication cable from the DAM to the SAM.\n\n7.2.26 Energize the DAM and then the SAM. Allow a 20 minute warm up time for the\n        DAM prior to collecting data.\n\n7.2.27 From the main menu on the computer run the AOV Selection program.\n\n7.2.28 Select the AOV which is going to be tested from the active AOV list.\n\n7.2.29 If the desired AOV is not listed, check the path to the AOV test directory to be\n        sure the computer is looking in the right place. The AOV may be stored in\n        another database.\n\n7.2.30 Press enter to accept the highlighted AOV and return to the main menu.\n\n7.2.31 From main menu select Channel Configure. The master list of transducers\n        used at the plant should be created before using the Channel Configure.\n\n7.2.32 In the Test Selection screen select what type of test is to be performed. In our\n        case it is Baseline Test.\n\n7.2.33 In the Transducer Channel Configuration screen set up the system\n        configuration.\n\n7.2.34 To configure the UDS click on the AUTO CONFIGURE button. The UDS\n        software will automatically setup the Transducer to Channel Configuration\n        screen based on the module detected.\n---\nTEST PROCEDURE                                                                               ENCONET d.o.o.\n\n7.2.35 Associating a Transducer with the channel should be performed following the\nChannel Configuration. See Table 1.\n\nTable 1\n\n| Channel | Universal | Encoder Module |\n|---------|-----------|-----------------|\n| Name | Module | |\n| Diaphragm Pressure | Lucas 100 psig | N/A |\n| I/P Signal Pressure | Lucas 30 psig | N/A |\n| Supply Pressure | Lucas 100 psig | N/A |\n| Position | N/A | HS Encoder |\n\n7.2.36 For Data Acquisition return to the \"Transducer to Channel Configuration\"\nscreen. As-Found Testing is described in section 7.3.\n\n7.2.37 Functional Block Diagram\n\n```mermaid\ngraph TD\n    A[Supply pressure] --> B[PR]\n    B --> C[I/P]\n    C --> D[P]\n    E[PR] --> D\n    F[1] --> D\n    G[4] --> D\n    H[2] --> D\n    I[5] --> D\n    J[3] --> E\n```\n\n1 – Diaphragm pressure transducer\n2 – I/P pressure transducer\n3 – Supply pressure transducer\n4 – Travel transducer\n5 – Lock-up test valve\nP – Positioner\nPR – Pressure Regulator\nI/P – Current to pressure transducer\n---\nTEST PROCEDURE                                                                               ENCONET d.o.o.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0040-0022"},{"char_end":31728,"char_start":30375,"chunk_id":"CHUNK-DOC-0040-0026","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0040","heading_path":"TEST PROCEDURE                                                ENCONET d.o.o. [line 341] > 7.6     As Left Test Performance [line 692]","next_chunk_id":"CHUNK-DOC-0040-0027","previous_chunk_id":null,"sequence":26,"source_sha256":"b12e97e4f426ea923ffcf1e06416309e32b3afef75bc75253be98aa83160115c","text":"## 7.6     As Left Test Performance\n\n7.6.1 Once the AOV, acquisition and test type has been selected, the channel configured and the transducers associated, enter the Acquisition Setup menu by clicking the Acquire Signatures button. Select the parameters desired for the test and click OK.\n\n7.6.2 Select either EXTEND or RETRACT describing encoder action on closing, reset the HS encoder reference to zero.\n\n7.6.3 Verify that the valve went full closed. If full closed, continue with step 7.6.4. If the valve is still open, verify that the right input range (ma) was entered. Repeat step 7.6.1.\n\n7.6.4 Stroke the valve by using the UDS current output through the plants I/P or through the remote I/P transducer for the predefined test, or from the Control Room.\n---\nTEST PROCEDURE                                                                             ENCONET d.o.o.\n\n7.6.5 Analyze the signatures. If the data is acceptable, Initial/Date in Field Data\n      Sheet and proceed to step 7.6.7, or select a different test type and repeat step\n      7.3.4, and steps 7.5.4 through 7.6.4.\n\n7.6.6 If the data acquisition is not acceptable, or adjustment to the AOV is required\n      then repeat steps 7.5.1 through 7.6.5 as necessary.\n\nPage 21\n---\nTEST PROCEDURE                                                                             ENCONET d.o.o.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0040-0026"},{"char_end":35454,"char_start":31728,"chunk_id":"CHUNK-DOC-0040-0027","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0040","heading_path":"TEST PROCEDURE                                                ENCONET d.o.o. [line 341] > 8. ACCEPTANCE CRITERIA [line 715]","next_chunk_id":"CHUNK-DOC-0040-0028","previous_chunk_id":"CHUNK-DOC-0040-0026","sequence":27,"source_sha256":"b12e97e4f426ea923ffcf1e06416309e32b3afef75bc75253be98aa83160115c","text":"## 8. ACCEPTANCE CRITERIA\n\nAcceptance criteria encompass the set of critical parameters for selected diagnostic testing type. Critical parameters of all tested valves must be within prescribed limits in order to declare the valve capable of fulfilling its intended safety function between outages. Otherwise, affected valves must be scheduled for repair or other corrective activities.\n\nThese parameters, with acceptable margins, are listed below:\n\n### Baseline Test\n\n- **Measured Total Travel**: Difference between measured position at minimum and maximum control signal. Up to 0,125\" of normal travel.\n\n- **Signal at Minimum Travel**: Calibration, ATO 4,1 – 4,5; ATC 19,5 – 19,9 mA.\n\n- **Signal at Maximum Travel**: ATO 19,6 – 20,2 mA; ATC 3,8 – 4,4 mA.\n\n- **Signal at Nominal Travel**: ATO 20 mA; ATC 4 mA.\n\n- **Dynamic Linearity Error**: Maximum deviation of average up and down scale quasi-static travel data from an ideal straight line calculated from a linear regression of the valve travel and control signal data. Most control valves with positioner will have a linearity error less than 2%.\n\n- **Friction**: Friction is the total net friction force in the valve assembly that acts in the direction opposite motion. Average friction value should be within +/- 25% of the manufacturer's specified friction level. Calculated in the 6% to 94% range of travel.\n\n- **Bench-Set**: High and low values of pressure applied to diaphragm actuator to produce the nominal valve travel. The measured bench-set range should agree within +/- 10% of the specified range.\n\n- **Spring Rate**: Change in spring force per change in spring length. Spring rate values should agree within +/- 10% of manufacturer's specified spring rate.\n---\nTEST PROCEDURE                                                                            ENCONET d.o.o.\n\n**Signal Pressure at Min, Max and Nom travel**: Signal transducer output pressure (input to the positioner) at seat contact, measured total travel and nominal travel. Min ATO 3,2 – 3,5 psig; ATC 14,5 – 14,8 psig; Max ATO 14,5 – 14,8 psig; Nom ATO 15 PSI, ATC 3 PSI.\n\n**I/P Output Pressure at Min and Max Signal**: Signal transducer output pressure at the endpoints of the signal transducer's nominal input range. 4-20 mA input signal, 3-15 psig output. Min and Max +/-0,25 psig (2% fs).\n\n**Air Supply Decrease**: Percent decrease of air supply measured during the duration of the test. No greater than 10% loss of air supply for the duration of test.\n\n**Dynamic Hysteresis Plus Dead band Error (DHPDBE)**: Difference in position of increasing and decreasing signal position at same input control signal near quasi-static test. Small single actuator \u003c5%, Large and double actuator \u003c12%.\n\n**Seat Load**: Actuator plus spring, and spring only, are two cases of seat loading. Spring only significant in valves ability to shut-off in fail mode. Valve specific.\n\n**Positioner DHPDBE**: Difference of valve position during increasing and decreasing signal at same I/P output pressure. Small diaphragm \u003c5%, large and double \u003c10%.\n\n**Positioner Dynamic Linearity Error**: Deviation of average up and down scale in quasi-static travel from a ideal straight line. No greater then 2%.\n\n**Positioner Balance Pressure**: Average pressure between top and bottom cylinders. Greater than 60% of air supply.\n\n**I/P DHPDBE**: Difference between output pressure at increasing and decreasing signal motion at same input signal. Less than 1%FS.\n\n**I/P Dynamic Linearity Error**: Maximum deviation of average up and down scale I/P output pressure from a ideal straight line. No greater than 1%FS.\n\nPage 23\n---\nTEST PROCEDURE                                                                           ENCONET d.o.o.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0040-0027"},{"char_end":35705,"char_start":35454,"chunk_id":"CHUNK-DOC-0040-0028","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0040","heading_path":"TEST PROCEDURE                                                ENCONET d.o.o. [line 341] > HDRL Test [line 765]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0040-0027","sequence":28,"source_sha256":"b12e97e4f426ea923ffcf1e06416309e32b3afef75bc75253be98aa83160115c","text":"## HDRL Test\n\nHysteresis Plus Dead bend Error: Crucial control less than 1%, not crucial less than 2,5%.\n\nRepeatability Error: Crucial valves less than 0,5%, not critical 1,5%.\n\nLinearity Error: Positioner should have a linearity error less than 2%.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0040-0028"},{"char_end":7124,"char_start":5777,"chunk_id":"CHUNK-DOC-0045-0008","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0045","heading_path":"SADRŽAJ [line 32] > 5. ODGOVORNOSTI [line 119]","next_chunk_id":"CHUNK-DOC-0045-0009","previous_chunk_id":null,"sequence":8,"source_sha256":"30ecac5384173d0ba92cdb6d617fec2caef8d573d0b34229631f09e695ba4a78","text":"## 5. ODGOVORNOSTI\n\nDirektor Enconeta odgovoran je za osiguravanje organizacijskih i materijalnih preduvjeta za izvođenje aktivnosti iz tog postupka.\n\nVoditelj projekta odgovoran je da u ugovornoj i pogodbenoj dokumentaciji specificira potrebnu mjerno testnu opremu. Ukoliko Enconet ne posjeduje potrebnu opremu, odgovoran je da pronađe dobavljača zahtijevane mjerno testne opreme, koji zadovoljava sve standarde zahtjevane u tehničkim specifikacijama zahtjeva za ponudu. Odgovoran je da zahtjevanu mjerno testnu opreme specificira u ponudi Enconeta.\n- Imenuje korisnika MTE opreme.\n- Izvodi rješenja u cilju otklanjanja uočenih nesukladnosti.\n- Odgovarajuće skladišti MTE opremu.\n- Označava MTE opremu jedinstvenom oznakom.\n- Arhivira, održava i ažurira „Listu korištene MTE opreme Enconeta\", Prilog 7.1.\n\nVoditelj QA odgovoran je da provjeri kvalificiranost dobavljača (isporučioca) mjerno testne opreme na osnovu rezultata audita i odobri nabavu tražene opreme.\n\nKorisnik MTE opreme\n- Osigurava fizički nadzor MTE opreme.\n- Osigurava provjeru i kalibraciju MTE opreme, internu (NEK) ili vanjsku.\n- Pohranjuje certifikate i kalibracijske liste.\n- Pokreće korektivni postupak u slučaju oštećenja ili ustanovljene neispravnosti MTE opreme.\n- Koristi samo onu opremu za koju je osposobljen i koja je propisana u postupcima i/ili radnim nalozima.\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0045-0008"},{"char_end":10769,"char_start":7124,"chunk_id":"CHUNK-DOC-0045-0009","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0045","heading_path":"SADRŽAJ [line 32] > 6. POSTUPAK [line 140]","next_chunk_id":"CHUNK-DOC-0045-0010","previous_chunk_id":"CHUNK-DOC-0045-0008","sequence":9,"source_sha256":"30ecac5384173d0ba92cdb6d617fec2caef8d573d0b34229631f09e695ba4a78","text":"## 6. POSTUPAK\n\n### 6.1 Nabava i verifikacija nove MTE\n\nNova mjerno testna oprema se nabavlja sukladno s potrebama određenog projekta, koji su definirani i zahtjevani od Enconeta kroz proces ugovaranja (zahtjev za ponudu, ponuda, tehničke specifikacije, ugovor).\n\nNabavu odobrava vođa projekta i direktor Enconeta.\n\nKod nabave se uzima u obzir tipizacija opreme, zahtjevane točnosti, uvjeti korištenja, jednostavnost upotrebe, mogućnost kalibracije i u kojim institucijama, mogućnost dekontaminacije i reference dobavitelja.\n\nVoditelj projekta upisuje instrument na listu MTE opreme Enconeta, koja sadržava slijedeće podatke:\n- jedinstvenu oznaku instrumenta, koja do sada nikada ranije nije korištena\n- razred instrumenta\n- ime i podaci proizvođača, model, tip\n- serijski broj\n- točnost\n- zahtjeve za kalibraciju, vremenske ili neke druge\n- lokacija skladištenja i čuvanja instrumenta\n\nFrekvenca kalibracije se određuje na osnovi specifikacija proizvođača i dobre inženjerske prakse uz primjenu uvjeta upotrebe.\n\nAko je novonabavljeni instrument odgovarajuće certificiran može se odmah koristiti, ali je prije toga potrebno izvesti kalibraciju.\n\n### 6.2 Skladištenje i čuvanje MTE\n\nMTE se čuva i skladišti u prostorijama koje moraju zadovoljavati kriterije koje su predpisane za pojedini instrument (temperature, vlaga, agresivnost atmosfere, pritisak, vibracije itd.)\n\nMTE se može ustupiti na čuvanje korisniku ili skupini korisnika ako se ispunjuju slijedeći uvjeti:\n- MTE oprema se koristi isključivo od strane tog korisnika ili skupine\n- MTE oprema ne spada u skupinu instrumenata koji se koriste kao referentni kod kalibracije druge MTE opreme\n- MTE oprema se skladišti sukladno zahtjevima za skladištenje navedenim u specifikacijama, koje je postavio proizvođač opreme.\n\n\n### 6.3 Označavanje MTE\n\nSvaki instrument koji je po definiciji klase I, II ili III, mora imati svoju jedinstvenu oznaku, koja mora biti trajno pričvršćena na instrument. Može se koristiti i serijski broj instrumenta.\n\nZa dodjelu oznake odgovoran je voditelj projekta po čijem je nalogu instrument nabavljen. Oznaka mora biti vidljiva i pričvršćena tako da je dobro vidljiva i da ne otpada (naljepnica ili graviranje).\n\nDatum do kada kalibracija vrijedi mora biti također označen s naljepnicom na samom instrumentu.\n\n### 6.4 Korištenje MTE\n\nMTE se koristi u predpisanom opsegu mjerenja i predpisanim uvjetima korištenja (temperatura, vlaga itd.)\n\nKorisnik opreme preuzima svu odgovornost za instrument. Prilikom upotrebe potrebno je paziti da ne dođe do oštećenja instrumenta. U slučaju oštećenja treba prekinuti mjerenja, javiti
