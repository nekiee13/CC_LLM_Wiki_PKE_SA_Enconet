\n### 4.1.3.2. Base Output\n\n4.1.3.2.1. Base output shall be created by calculation of RELAP5 with base input deck as input.\n\n4.1.3.2.2. Nodalization supervisor shall store base output in C1work directory as read-only file.\n\n4.1.3.2.3. By RELAP5 script file default base output shall have same file ID as base input deck.\n\n4.1.3.2.4. File type shall be file type o.\n\n4.1.3.2.5. Base output is used for the steady-state qualification of base input deck.\n\n4.1.3.2.6. Base output shall be created for each version or revision of base input deck\n\n### 4.1.3.3. Base Restart\n\n4.1.3.3.1. Base restart shall be created by calculation of RELAP5 with base input deck as input.\n\n4.1.3.3.2. Nodalization supervisor shall store base restart in work directory as read-only file.\n\n4.1.3.3.3. By RELAP5 script file default base restart shall have same file ID as base input deck.\n\n4.1.3.3.4. File type shall be file type r.\n\n4.1.3.3.5. Base restart is used for the transient calculations together with run input deck as inputs to the script file.\n\n4.1.3.3.6. Base restart shall be created for each version or revision of base input deck.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                            Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                   Rev.2     Page 17 of 60\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0023-0019"},{"char_end":39233,"char_start":23421,"chunk_id":"CHUNK-DOC-0023-0020","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0023","heading_path":"4     INSTRUCTIONS [line 311] > 4.2 Transient Analysis Instructions [line 484]","next_chunk_id":"CHUNK-DOC-0023-0021","previous_chunk_id":"CHUNK-DOC-0023-0019","sequence":20,"source_sha256":"ba7ed665376b86890bd4c7355cda65c4cd183ae45a721c1ed887293fb9bb1851","text":"## 4.2 Transient Analysis Instructions\n\nSimplified transient analysis flowchart is presented in Appendix 6.5.\n\n### 4.2.1 Transient Analysis Preparation\n\n#### 4.2.1.1. Transient analysis preparation shall be done by RELAP5 analyst and documented on RELAP5 analyst worksheets. RELAP5 analyst shall define transient analysis ID as 4 character word, possibly as abbreviation of transient name, e.g. CLSB for Cold Leg Small Break LOCA. Assigned abbreviation shall be approved by ENCONET Technical Project Leader.\n\n#### 4.2.1.2. Initial and boundary conditions shall be defined according to the transient specifications:\n\n1. Initial conditions:\n\n   a. reactor power\n   b. primary system loop flow\n   c. hot leg temperature and cold leg temperature (or average temperature)\n   d. primary system pressure\n   e. SG secondary side pressure\n   f. SGs secondary side level\n   g. PRZ level\n   h. Steam flow to turbine\n   i. FW flow\n\n2. Boundary conditions:\n   a. transient initiation\n   b. identification of the relevant plant systems for the transient\n   c. availability of the plant systems\n   d. relevant protection and system actuation setpoints for the transient\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                              Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                     Rev.2     Page 18 of 60\n\n### 4.2.1.3. Definition of main phenomena and relevant phenomenological aspects of the transient:\n\n1. Main phenomena shall be identified:\n   a. from available literature (FSAR, IAEA Technical Documents, OECD CSNI working reports, petc.).\n   b. by expert consultation (qualified user of RELAP5 program)\n\n2. Relevant thermohydraulic aspects shall be defined for main phenomena (e.g. if core dryout is identified as main phenomena than relevant thermohydraulic aspects may be rod surface temperature and core level).\n\n### 4.2.1.4. Base input deck applicability shall be verified by:\n\n1. Comparison of initial conditions as defined in 4.2.1.2-1 to the Steady-State Technical Report.\n   a. Identification of RELAP5 components for each relevant plant system as defined in 4.2.1.2-2 in Steady-State Technical Report.\n   b. Confirmation of relevant protection and system actuation setpoints as defined in 4.2.1.2-2 with Steady-State Technical Report.\n   c. The results of steps 4.2.1.2 and 4.2.1.3 shall be submitted to the nodalization supervisor in format presented in Appendix 6.6.\n   d. Nodalization supervisor shall verify base input deck applicability according to format presented in Appendix 6.6.\n   e. RELAP5 analyst shall proceed with transient analysis only if base input deck is approved as applicable.\n\n2. Transient working directory for transient analysis shall be defined as subdirectory of the work directory with the same name as transient analysis ID.\n\n### 4.2.2 RELAP5 Transient Analysis\n\n#### 4.2.2.1. Plot variables files shall be created in transient working directory.\n\n1. Plot variables file type shall be PLT.\n2. Plot variables file name shall be the same as transient ID with numbered sufix separated with - (minus sign), e.g. if transient analysis ID is CLSB, than plot variables files names may be CLSB-1, CLSB-2, etc. in ascending order.\n3. Format of plot variable file is presented in Appendix 6.7.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                              Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                     Rev.2      Page 19 of 60\n\n4. RELAP5 variables important for analysis of RELAP5 calculations\n   shall be identified using instructions from Ref. [1] (vol. 2, Appendix\n   A, pg. 27) for input of minor edit requests:\n   a.      RELAP5 variables that are representative for relevant\n           thermohydraulic aspects shall be stored in plot variables files\n           with suffix -1, e.g. file name will be CLSB-1.PLT. This file\n           shall be submitted to ENCONET Technical Project Leader for\n           approval.\n   b.      Additional RELAP5 variables that may be used for analysis of\n           RELAP5 calculations shall be stored in plot variables file with\n           the suffixes following in ascending order, e.g. CLSB-2.PLT,\n           CLSB-3.PLT etc.\n4.2.2.2.     Run input deck shall be created in transient working directory for\n             each RELAP5 run.\n             − Run input deck shall be input file for restart of RELAP5 run as\n                 specified in Ref. [1].\n4.2.2.3.     Run input deck shall represent restart modification of base input\n             file in compliance with Ref. [1] Vol 2.\n\n1. The development of run input deck shall be documented by RELAP5\n   Analyst Worksheets.\n2. Compliance of run input deck and base input deck models to the\n   transient specifications shall be summarized in RELAP5 Analysis\n   Technical Report as specified in 4.3.4.\n3. Each run input deck ID shall be defined by RELAP5 analyst with\n   maximum of 8 characters:\n   a.      characters 1 to 4 shall be the same as transient ID defined in\n           4.2.1.1, e.g. if run input deck is prepared for transient analysis\n           from example from 2, than ID CLSB shall be used.\n   b.      character 5 shall be used for the location of transient initiator:\n           − if the initiator is in loop with PRZ, than A shall be used\n           − if the initiator is in loop without the PRZ, than B shall be\n               used\n           − if the initiator is common to both loops, than C shall be used\n   c.      characters 6 to 8 shall be used to define specific choices:\n           − size of the break\n           − availability of the systems\n           − RELAP5 input choices,\n           − corrective actions according to 4.2.2.5-4, etc.\n4. Run input deck file type shall be file type i.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                    Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                        Rev.2     Page 20 of 60\n\n5. Run input deck shall be stored in transient working directory. Backup copies shall be stored on:\n   a. a diskette that is kept together with the RELAP5 analysis workbook\n   b. at least one other removable computer storage media.\n   c. protected web site http://enconet.no-ip.biz/ifolder\n\n6. Run input deck preparation shall include:\n   a. introduction of the parameter changes in the base input deck that shall be altered to satisfy transient definition and required boundary conditions as identified in 4.2.1.4.\n   b. identification and input (as minor edits) of RELAP transient characteristic variables that characterize main phenomenological aspects as identified in 4.2.2.1-4a.\n   c. Run input deck data shall be in compliance with Ref. [1]. Additional input conventions that shall be part of this procedure are reported in Appendix 6.8\n\n7. Example of run input deck is presented in Appendix 6.9.\n\n### 4.2.2.4. RELAP5 calculations\n\n1. RELAP5 calculations shall be invoked from transient working directory by RELAP5 script file as specified in 4.1.1.7.\n\n2. RELAP5 calculations may result in:\n   a. successful finish on trip 600 without errors in case which analyst shall proceed to 4.2.2.5;\n   b. failure of the calculation with error reported in Vol. 2, ch. 8.3.4 of Ref. [1]. Changes as suggested from the manual shall be introduced;\n   c. program fails in spite the suggestions from Ref. [1], or with unknown error, in case which input file shall be saved and problem reported to nodalization supervizor and RELAP5 software engineer. Analysis shall be continued only after nodalization supervizer provides the approval for the changes aimed to provide soultion in particular case.\n\n### 4.2.2.5. Analysis of the calculations\n\n1. RELAP5 output analysis shall include:\n   a. check of trip status\n   b. characteristic variables analysis\n   c. boundary conditions compliance\n   d. check of mass error\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                    Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                        Rev.2     Page 21 of 60\n\n2. RELAP5 graphs analysis shall include:\n   a. running of RELAP5 plot program with all plot variables file and run restart.\n   b. creation of hard copies for representative variables graphs as defined in 4.2.2.1-4a.\n   c. creation of plot data file for plot variable file defined in 4.2.2.1-4a.\n   d. visual observation for the rest of plot variables files.\n\n3. The results of the analysis of RELAP5 calculation shall be considered satisfactory if:\n   a. trip status is in accordance with 4.2.1.2-2\n   b. relative mass error is less than 1%\n   c. the prediction of relative thermohydraulic aspects is explained and justified\n   d. If all off the above terms a, b and c are fulfilled, RELAP5 analyst shall proceed with step 6.\n\n4. The results of the analysis of RELAP5 calculation shall be considered doubtful if:\n   a. Trip status is not in accordance with 4.2.1.2-2. Corrective action should be to adjust trips in run input deck according to 4.2.1.2-2.\n   b. Relative mass error is greater than 1%. Corrective action is to decrease maximum time step size according to the specifications from Vol. 2, Appendix A, ch.3 of Ref. [1].\n   c. The prediction of relative thermohydraulic aspects is not completely understood. Corrective action is to consult literature or qualified user - expert.\n   d. One or some of the parameters show erratic behavior or unexplainable oscillations. Corrective actions should be performed in following order:\n      i) to decrease maximum time step size;\n      ii) to run parametric study for critical parameters;\n      iii) to request renodalization or update of base input deck after consultation with qualified user.\n      iv) Should none of the corrective actions lead to fulfillment of requests from 3 RELAP5 analyst should proceed to 5.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                            Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                   Rev.2     Page 22 of 60\n\n5. The results of the analysis shall be considered unsatisfactory if:\n   1.       none of the corrective actions succeeded.\n   2.       some of the relevant thermohydraulic aspects is predicted\n            outside the RELAP5 mathematical model applicability as\n            described in Vol. 1 of Ref. [1].\n   3.       should the analysis be considered unsatisfactory, RELAP5\n            analyst shall proceed with 6. RELAP5 Analysis Technical\n            Report – Deviation Report according to 4.3.4, should\n            contain information of the problems encountered during the\n            analysis. RELAP5 analyst shall initiate steady-state report\n            update of know restrictions in the use of the program and\n            base input deck.\n6. RELAP5 analyst shall store all run input and output files in the\n   transient working directory. Separate backup copies shall be stored on\n   some removable computer storage media.\n7. RELAP5 analyst shall be allowed to delete run restart file after the\n   plot data file with variables specified in 4.2.2.1-4 are created.\n8. Final output forms of the RELAP5 transient analysis shall be\n   prepared:\n   a.     RELAP5 Workbook as specified in 4.3.3.\n   b.     backup copies of all transient run input decks, run outputs and\n          plot data files specified in 4.2.2.1-4 a on some removable\n          computer storage media.\n   c.     RELAP5 Analysis Technical Report as specified in 4.3.4.\n\n4.3   Documentation\n\n   4.3.1      RELAP5 Nodalization Notebook\n\n   4.3.1.1.   RELAP5 Nodalization Notebook is document compiled from worksheets\n              created by nodalization developers that were used for calculation of\n              RELAP5 base input deck. RELAP5 notebook worksheet is presented in\n              Appendix 6.10.\n   4.3.1.2.   RELAP5 notebook shall contain:\n\n              1.   name, time, date and size of the latest revision of the base input deck\n                   file and base restart;\n              2.   disc with the base input deck file and corresponding output file of\n                   the steady-state run;\n              3.   schematic drawing of the nodalization;\n\n                                ENCONET d.o.o., Zagreb\n---\nRadna uputa                                                    Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                       Rev.2    Page 23 of 60\n\n4. list of used abbreviations;\n5. list of commonly used formulas and conversion factors;\n6. worksheets that describe setup of the input deck with used\n   references;\n\n4.3.1.3. Each worksheet shall be independently reviewed.\n\n4.3.1.4. Final release of each version of RELAP5 Nodalization Notebook shall be\n         processed as a new revision of Technical Report and approved.\n\n4.3.2   Steady-State Technical Report\n\n4.3.2.1. Steady-State Technical Report shall describe steady-state qualification of\n         base input deck.\n\n4.3.2.2. Steady-State Technical Report shall contain:\n\n1. main assumptions and guidelines used during the development of\n   the nodalization;\n2. choice of the referenced initial and boundary conditions;\n3. geometrical correspondence between plant zones and control\n   volumes;\n4. modeled plant systems setpoints;\n5. known restrictions in the use of the RELAP5 program and base\n   input deck model;\n6. results of the steady state calculation and comparison with reference\n   data;\n7. printout of the base input deck.\n\n4.3.3   RELAP5 Analysis Workbook\n\n4.3.3.1. RELAP5 Analysis Workbook shall be compilation of RELAP5 analyst\n         worksheets that were created during the transient analysis. RELAP5\n         analyst worksheet format is presented in Appendix 6.11.\n\n4.3.3.2. RELAP5 Analysis Workbook shall contain RELAP5 analyst worksheets\n         with notes of the activities described in 4.2:\n\n1. notes on the transient specifications;\n2. definition of boundary and initial conditions;\n3. identification of main phenomenological aspects;\n4. approval of base input deck applicability;\n5. description of inputs for run input decks and plot variables file;\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                            Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                   Rev.2     Page 24 of 60\n\n6. graphs of main plot variables for each run;\n7. explanations for introduced changes;\n8. notes of the graphs analysis.\n\n### 4.3.4 RELAP5 Analysis Technical Report\n\n#### 4.3.4.1. RELAP5 Analysis Technical Report shall cover transient analysis using RELAP5 program.\n\n#### 4.3.4.2. RELAP5 Analysis Technical Report shall comply with the ENCONET Technical Report procedure.\n\n#### 4.3.4.3. RELAP5 technical report shall be prepared based on RELAP Analysis Workbook as it is defined in 4.3.3 and other relevant reference and shall contain:\n\n1. initial and boundary conditions compliance, as prepared for run input deck;\n2. compliance of base input deck according to this specification (as approved by nodalization supervisor);\n3. main phenomenological aspects of the transient shall be stated;\n4. changes that affect base input deck assumptions shall be summarized;\n5. evaluation of parametric study, if such exists;\n6. conclusions on the analysis (including outcomes as defined in 5);\n7. graphs of relevant parameters for base case calculation;\n8. graphs relevant for parametric study as separate attachment.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                    Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                           Rev.2     Page 25 of 60\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0023-0020"},{"char_end":40032,"char_start":39233,"chunk_id":"CHUNK-DOC-0023-0021","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0023","heading_path":"4     INSTRUCTIONS [line 311] > 5     REFERENCES [line 777]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0023-0020","sequence":21,"source_sha256":"ba7ed665376b86890bd4c7355cda65c4cd183ae45a721c1ed887293fb9bb1851","text":"## 5     REFERENCES\n\n[1] RELAP5/MOD3.2 Code Manual, Nuclear Safety Analysis Division, INEL,\n     Prepared for US NRC, NUREG/CR-5535.\n\n[2] A methodology for the qualification of thermalhydraulic code nodalizations,\n     Bonuccelli M., F. D'Auria, N. Debrecin, G.M. Galassi, Proc. of NURETH-6\n     Conference, Grenoble (F), October 5-8, 1993.\n\n[3] ENCONET Nuklearni QA Plan, NP-SUK-001\n\n[4] ENCONET, PRIRUČNIK KVALITETE NORMA - ISO 9001:2015, PK-SUK-\n     001\n\n[5] HRN EN ISO 9001:2015\n\n[6] IAEA Leadership and Management for Safety, IAEA Safety Standards Series, No.\n     GSR Part 2, IAEA Vienna, 2016.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                   Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                          Rev.2     Page 26 of 60\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0023-0021"},{"char_end":20810,"char_start":20786,"chunk_id":"CHUNK-DOC-0024-0027","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0024","heading_path":"6 KONTROLA NABAVE [line 359]","next_chunk_id":"CHUNK-DOC-0024-0028","previous_chunk_id":null,"sequence":27,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"# 6 KONTROLA NABAVE\n\n\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0027"},{"char_end":23182,"char_start":20810,"chunk_id":"CHUNK-DOC-0024-0028","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"6 KONTROLA NABAVE [line 359] > 6.1 Općenito [line 364]","next_chunk_id":"CHUNK-DOC-0024-0029","previous_chunk_id":"CHUNK-DOC-0024-0027","sequence":28,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 6.1 Općenito\n\nKontrola nabave Enconeta mora uključivati, ali time nije i ograničena, sljedeće:\n\n- Razvijanje, obnavljanje i pojednostavljenje postupaka za korisnika;\n- Izrada ili procjena nabavnih dokumenata glede primjerenosti zahtjeva kvalitete;\n- Nezavisno ocjenjivanje kvalitete nabavnih dokumenata kako bi se utvrdila primjerenost postupaka i ostvarena sukladnost;\n- Djelovanje kao ovlaštenik korisnika u procesu nabave ili QA aktivnostima u nabavi.\n\nVoditelji projekata odgovorni su da se odgovarajući zahtjevi prenesu iz regulatornih zahtjeva, temeljnih projektnih podataka, standarda, specifikacija i zahtjeva kvalitete u nabavne dokumente proizvoda ili usluga.\n\nMinimalno, kontrola nabavnih dokumenata mora uključiti odgovarajuće mjere kako bi se osiguralo da su:\n\n- Nabavni dokumenti sukladni odgovarajućim standardima i zahtjevima kvalitete;\n- Nabavni dokumenti specificirani, preko reference ili pridodati ugovoru, te da su utvrđeni tehnički zahtjevi, projektni temeljni podaci i ostali zahtjevi koji se primjenjuju, a koji su nužni da se odrede fizička i radna svojstva entiteta koji se naručuje;\n- Poduzete odgovarajuće mjere kako bi se osigurala isporuka entiteta sukladno nabavnim dokumentima i specifikaciji.\n\nTo uključuje minimalno:\n\n- Izjavu o opsegu posla isporučitelja;\n- Tehničke zahtjeve specificirane preko reference na propise, standarde, upute, postupke, smjernice i specifikacije, uključujući odgovarajuće revizije, tako da se u potpunosti opiše naručeni proizvod ili usluga;\n- Testove, inspekcije i kriterije prihvaćanja, kao i posebne upute i zahtjeve u vezi s time;\n- Pravo pristupa pogonima i zapisima isporučitelja u svrhu inspekcije izvora podataka kao i nezavisnog ocjenjivanja kvalitete, ukoliko se ukaže potreba;\n- Utvrđivanje odgovarajućih zahtjeva kvalitete i elemenata sustava kvalitete za primjenu kod naručenog proizvoda ili usluge. Nije potrebno da svaki isporučitelj ima usvojen QA Program koji odgovara svim elementima ovog NQAP. Ukoliko se traži proširenje zahtjeva, u nabavnim dokumentima mora se zatražiti od ugovarača ili podizvođača da usvoji QA Program koji će biti sukladan zahtjevima iz ovog NQAP;\n- Utvrđivanje tražene dokumentacije, kao što su upute, postupci, specifikacije, zapisi inspekcija i testiranja, kao i ostalih zapisa kvalitete koji se trebaju pripremiti i poslati na pregled i odobrenje Enconetu;\n\n\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0028"},{"char_end":23704,"char_start":23182,"chunk_id":"CHUNK-DOC-0024-0029","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"6 KONTROLA NABAVE [line 392]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0024-0028","sequence":29,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"# 6 KONTROLA NABAVE\n\n\n\n\n- Odredbe glede kontrolirane dostave dokumenata, te čuvanja, obnavljanja i\n  raspolaganja zapisima kvalitete;\n- Zahtjeve za izvješćivanjem o nesukladnostima i odobrenju otklanjanja\n  nesukladnosti;\n- Odredbe za proširenje primjerenih zahtjeva iz nabavnih dokumenata na\n  podizvođača i podisporučitelja, uključujući i pravo pristupa Enconeta njihovim\n  pogonima i zapisima;\n- Odredbe kojima se utvrđuju rokovi dostave dokumenata.\n\nRef: Postupak: PP-74-01, «Proces nabave i ocjenjivanje dobavljača»\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0029"},{"char_end":24362,"char_start":23704,"chunk_id":"CHUNK-DOC-0024-0030","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0024","heading_path":"6 KONTROLA NABAVE [line 392] > 6.2 Vrednovanje i izbor isporučitelja [line 408]","next_chunk_id":"CHUNK-DOC-0024-0031","previous_chunk_id":null,"sequence":30,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 6.2 Vrednovanje i izbor isporučitelja\n\nEnconet mora vrednovati sposobnosti isporučitelja, te na temelju dobivenih\nrezultata izvršiti izbor isporučitelja. Voditelj QA poslova odgovoran je za\nuspostavljanjem i obnavljanjem odobrene liste isporučitelja.\n\nVrednovanje isporučitelja uključuje, ukoliko je primjereno:\n\n- Vrednovanje dosadašnjeg iskustva u proizvodnji i isporuci istih ili sličnih\n  proizvoda ili usluga, a koji su se u radu pokazali zadovoljavajućim;\n- Vrednovanje sadašnjih zapisa kvalitete i dodatnih informacija koje se\n  mogu objektivno vrednovati;\n- Vrednovanje sustava kvalitete isporučitelja;\n- Vrednovanje izabranih uzoraka proizvoda.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0030"},{"char_end":24834,"char_start":24362,"chunk_id":"CHUNK-DOC-0024-0031","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"6 KONTROLA NABAVE [line 392] > 6.3 Kontrola naručenih proizvoda i usluga [line 423]","next_chunk_id":"CHUNK-DOC-0024-0032","previous_chunk_id":"CHUNK-DOC-0024-0030","sequence":31,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 6.3 Kontrola naručenih proizvoda i usluga\n\nInspekcije i nezavisno ocjenjivanje kvalitete kod isporučitelja, kao i ispitivanje\nproizvoda ili usluge nakon isporuke, mora se provesti prema zahtjevima iz\nnabavnih dokumenata radi provjere sukladnosti.\n\nUkoliko je potrebno, uzorci se moraju zadržati radi daljnjeg ispitivanja.\n\nPrije ugradnje ili korištenja proizvoda ili usluge pod nadzorom Enconeta, mora se\ndokumentirano dokazati sukladnost s nabavnim dokumentima.\n\n\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0031"},{"char_end":24885,"char_start":24834,"chunk_id":"CHUNK-DOC-0024-0032","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"7 KONTROLA MATERIJALA, DIJELOVA I KOMPONENTI [line 436]","next_chunk_id":"CHUNK-DOC-0024-0033","previous_chunk_id":"CHUNK-DOC-0024-0031","sequence":32,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"# 7 KONTROLA MATERIJALA, DIJELOVA I KOMPONENTI\n\n\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0032"},{"char_end":25570,"char_start":24885,"chunk_id":"CHUNK-DOC-0024-0033","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"7 KONTROLA MATERIJALA, DIJELOVA I KOMPONENTI [line 436] > 7.1 Identifikacija i kontrola materijala, dijelova i komponenti [line 441]","next_chunk_id":"CHUNK-DOC-0024-0034","previous_chunk_id":"CHUNK-DOC-0024-0032","sequence":33,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 7.1 Identifikacija i kontrola materijala, dijelova i komponenti\n\nEnconet mora obavljati identifikaciju i kontrolu materijala, dijelova i komponenti koji su pod nadzorom Enconeta prilikom isporuke, ugradnje i rada, pomoću oznaka šarže, broja dijela, serijskog broja ili nekim drugim odgovarajućim načinom, bilo oznakom na dijelu bilo pomoću zapisa o sljedivosti dijelova.\n\nFizička identifikacija provodit će se koliko je to maksimalno moguće ostvariti. Ukoliko je to nepraktično, usvojit će se proceduralna kontrola.\n\nIdentifikacijska oznaka primjenjivat će se na takav način da ne utječe na radna svojstva dijela.\n\nRef: Postupak PP-74-01, «Proces nabave i ocjenjivanje dobavljača»\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0033"},{"char_end":25973,"char_start":25570,"chunk_id":"CHUNK-DOC-0024-0034","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"7 KONTROLA MATERIJALA, DIJELOVA I KOMPONENTI [line 436] > 7.2 Rukovanje, skladištenje i otprema [line 451]","next_chunk_id":"CHUNK-DOC-0024-0035","previous_chunk_id":"CHUNK-DOC-0024-0033","sequence":34,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 7.2 Rukovanje, skladištenje i otprema\n\nEnconet mora kontrolirati aktivnosti rukovanja, otpreme i skladištenja u svrhu sprječavanja oštećenja, propadanja ili gubitka proizvoda. Ukoliko je potrebno, moraju se utvrditi, propisati, održavati i verificirati posebne mjere o rukovanju i zaštitnim okolišnim uvjetima prilikom transporta i skladištenja onda kad je Enconet odgovoran za navedene aktivnosti.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0034"},{"char_end":26186,"char_start":25973,"chunk_id":"CHUNK-DOC-0024-0035","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"7 KONTROLA MATERIJALA, DIJELOVA I KOMPONENTI [line 436] > 7.3 Održavanje [line 455]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0024-0034","sequence":35,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 7.3 Održavanje\n\nUkoliko je održavanje dijelova u opsegu odgovornosti Enconeta, mora se obavljati na taj način, da se osigura odgovarajuća kvaliteta kao što je bila i izvorno zahtijevana kod tih dijelova.\n\n\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0035"},{"char_end":26777,"char_start":26215,"chunk_id":"CHUNK-DOC-0024-0037","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0024","heading_path":"8 UPRAVLJANJE PROCESOM [line 461] > 8.1 Upravljanje procesom [line 466]","next_chunk_id":"CHUNK-DOC-0024-0038","previous_chunk_id":null,"sequence":37,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 8.1 Upravljanje procesom\n\nProcesi kod kojih ostvarena kvaliteta ovisi o radu tih procesa, a koja se ne može naknadno verificirati završnim pregledom proizvoda, moraju se provoditi u kontroliranim uvjetima prema kvalificiranim postupcima, s kvalificiranom opremom i osobljem.\n\nVoditelj projekta odgovoran je za utvrđivanje inspekcijskih točaka u takvim procesima (svjedočenje i zaustavljanje procesa). Objektivni dokazi provedenih inspekcija u tim točkama koristit će za verifikaciju da su zadovoljeni kriteriji prihvatljivosti unutar propisanih tolerancija.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0037"},{"char_end":27848,"char_start":26777,"chunk_id":"CHUNK-DOC-0024-0038","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"8 UPRAVLJANJE PROCESOM [line 461] > 8.2 Specijalni procesi [line 472]","next_chunk_id":"CHUNK-DOC-0024-0039","previous_chunk_id":"CHUNK-DOC-0024-0037","sequence":38,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 8.2 Specijalni procesi\n\nZa izvršenje zadataka koji spadaju u kategoriju specijalnih procesa (zavarivanje, toplinska obrada, ispitivanje bez razaranja.....) osigurat će se zahtijevani trening i postupci. Osigurat će se traženi uvjeti kao i potrebna ispravna i kalibrirana oprema.\n\nEnconet je do sada uključen u kategoriju specijalnih procesa na području vizualne kontrole QC aktivnosti. Trening i zdravstveni uvjeti osiguravaju se u sklopu zahtjeva NE Krško. Direktni izvršioci imaju odgovarajući trening i zdravstvene kontrole vida. Specijalni procesi provode se u skladu sa zahtjevima ugovorenih poslova.\n\nU slučaju da Enconet novim ugovorom preuzme obavezu izvedbe specijalnih procesa koji do sada nisu izvođeni, osigurat će se zahtijevana edukacija, postupci, oprema, kalibracije, potreban prostor i svi ostali potrebni parametri za uspješno izvođenje procesa.\n\nRef: 1. Postupak PP-72-01, «Proces marketinga, ugovaranja i prodaje»\n     2. Postupak PP-73-01, «Proces projektiranja i razvoja»\n     3. Postupak PP-74-01, «Proces nabave i ocjenjivanje dobavljača\n\n\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0038"},{"char_end":27880,"char_start":27848,"chunk_id":"CHUNK-DOC-0024-0039","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"9 INSPEKCIJA I TESTIRANJE [line 486]","next_chunk_id":"CHUNK-DOC-0024-0040","previous_chunk_id":"CHUNK-DOC-0024-0038","sequence":39,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"# 9 INSPEKCIJA I TESTIRANJE\n\n\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0039"},{"char_end":28853,"char_start":27880,"chunk_id":"CHUNK-DOC-0024-0040","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"9 INSPEKCIJA I TESTIRANJE [line 486] > 9.1 Program inspekcije [line 491]","next_chunk_id":"CHUNK-DOC-0024-0041","previous_chunk_id":"CHUNK-DOC-0024-0039","sequence":40,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 9.1 Program inspekcije\n\nIspitivanje dijelova, proizvoda ili usluga u opsegu isporuke Enconeta ili pod njegovim nadzorom mora provoditi osoblje koje nije sudjelovalo u izvođenju aktivnosti koje se pregledavaju. Kriteriji prihvatljivosti i verifikacije sukladnosti moraju se utvrditi u dokumentiranim uputama, postupcima i nacrtima. Ukoliko nije moguće ispitivanje obrađenog dijela, proizvoda ili usluge, provodit će se praćenje procesa na način naveden u poglavlju 8. ovog NQAP.\n\nRef: Vidi poglavlje 8.\n\nVoditelj projekta odgovoran je za utvrđivanje inspekcijskih točaka u takvim procesima (svjedočenje i zaustavljanje procesa). Objektivni dokazi provedenih inspekcija u tim točkama koristit će za verifikaciju da su zadovoljeni kriteriji prihvatljivosti unutar propisanih tolerancija prije nastavka radova ili pružanja usluge.\n\nUkoliko je Enconet odgovoran za obavljanje inspekcije u radu postrojenja, inspekcija se mora provoditi prema pisanim i odobrenim postupcima.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0040"},{"char_end":29223,"char_start":28853,"chunk_id":"CHUNK-DOC-0024-0041","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"9 INSPEKCIJA I TESTIRANJE [line 486] > 9.2 Program testiranja [line 501]","next_chunk_id":"CHUNK-DOC-0024-0042","previous_chunk_id":"CHUNK-DOC-0024-0040","sequence":41,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 9.2 Program testiranja\n\nUkoliko je testiranje ugovorna ili regulatorna obveza, mora se izraditi program testiranja i dokumentirati rezultate testova.\n\nTestiranje pod nadzorom Enconeta mora se izvoditi prema pisanim postupcima testiranja. Takvi postupci moraju utvrditi odgovarajuće okolišne uvjete, te zahtjeve za kvalifikacijom osoblja i kalibracijom instrumenata.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0041"},{"char_end":29998,"char_start":29223,"chunk_id":"CHUNK-DOC-0024-0042","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"9 INSPEKCIJA I TESTIRANJE [line 486] > 9.3 Kalibracija i kontrola opreme za mjerenje i testiranje [line 507]","next_chunk_id":"CHUNK-DOC-0024-0043","previous_chunk_id":"CHUNK-DOC-0024-0041","sequence":42,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 9.3 Kalibracija i kontrola opreme za mjerenje i testiranje\n\nMora se izvršiti pravilan izbor opreme za pregled, mjerenje i ispitivanje kako bi se zadovoljilo mjerno područje, vrsta, točnost i preciznost mjerenja.\n\nOprema se mora kontrolirati s obzirom na rukovanje, skladištenje i kalibraciju. Ukoliko se utvrdi odstupanje izmjerenih vrijednosti preko dopuštenih ograničenja, mora se izvršiti vrednovanje vjerodostojnosti prije obavljenih mjerenja, a rezultati ispitivanja moraju se ponovno procijeniti za cjelokupno razdoblje od zadnje kalibracije.\n\nVoditelj projekta odgovorni su za obavljanje i sljedivost rezultata kalibracije opreme za pregled, mjerenje i ispitivanje prema priznatim standardima.\n\nRef: Radna uputa: RU-82-05, «Program nadzora mjerne i testne opreme»\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0042"},{"char_end":30536,"char_start":29998,"chunk_id":"CHUNK-DOC-0024-0043","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0024","heading_path":"9 INSPEKCIJA I TESTIRANJE [line 486] > 9.4 Identifikacija stanja inspekcije, testa i rada [line 517]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0024-0042","sequence":43,"source_sha256":"67321365b04bd3ed9af497b798eb995cc50aa25dc26b6034cbb997b0989e43ed","text":"## 9.4 Identifikacija stanja inspekcije, testa i rada\n\nOprema za mjerenje i ispitivanje mora biti jednoznačno obilježena, tako da se u slučaju korištenja te opreme njena oznaka prenosi na pojedinačne entitete koji su pregledani i ispitani. Trebaju se koristiti tipske kartice ili zapisnici pregleda radi utvrđivanja stanja pregleda i ispitivanja, kao i sljedivost testiranih entiteta kroz izvješća. Kod testiranih sustava, komponenti i dijelova koristit će se fizičko označivanje karticama kako bi se spriječila nepažljiva uporaba.\n\n\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0024-0043"},{"char_end":7527,"char_start":7459,"chunk_id":"CHUNK-DOC-0025-0008","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.2 Glavni popis dokumenata (GPD) N/A [line 163]","next_chunk_id":"CHUNK-DOC-0025-0009","previous_chunk_id":null,"sequence":8,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.2 Glavni popis dokumenata (GPD) N/A\n\nN/A (obsolete, canceled)\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0008"},{"char_end":13337,"char_start":7527,"chunk_id":"CHUNK-DOC-0025-0009","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.3     Sadržaj i format dokumenata [line 167]","next_chunk_id":"CHUNK-DOC-0025-0010","previous_chunk_id":"CHUNK-DOC-0025-0008","sequence":9,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.3     Sadržaj i format dokumenata\n\nDokumenti sustava kvalitete imaju definirani odgovarajući sadržaj primjeren razini\nQA dokumenta, a izrađuju se u jedinstvenom formatu utvrđenom obrascima za\nnaslovnu i unutarnju stranu.\n\n### 6.3.1 Sadržaj Priručnika kvalitete\n\nSadržaj i upravljanje Priručnikom kvalitete definirani su u samom Priručniku.\n\n### 6.3.2 Sadržaj programskih postupaka i radnih uputa\n\nSvaki programski postupak i radna uputa sadržavaju slijedeća poglavlja:\n\n1. SVRHA\n   Naznačuje se namjera i definira cilj radi kojeg se dokument izrađuje.\n\n2. PODRUČJE PRIMJENE\n    Definira se djelokrug rada, odjel, poslove i/ili osoblje na koje se dokument\n    odnosi.\n\n3. REFERENCE\n    Popisuje se referentna dokumentacija koja je u vezi s dokumentom, te definira\n    zahtjeve i druge relevantne podatke.\n\n4. DEFINICIJE I KRATICE\n    Definira se značenje specifičnih pojmova i/ili značenje kratica korištenih u\n    dokumentu.\n\n5. ODGOVORNOSTI\n    Jasno se određuju pojedinačne odgovornosti i obveze za izvođenje\n    specificiranih aktivnosti.\n\n6. POSTUPAK\n    Određuje se način izvođenja radnje s opisom pojedinačnih aktivnosti, Utvrđuje\n    se što se mora napraviti, tko će to napraviti, kada, gdje i kako. Navodi se\n---\nProgramski postupak                                                              Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                           Rev. 6       Str: 8/26\n\nmaterijal, oprema i dokumenti koji će se koristiti, te kako će se proces\nnadzirati, provjeriti i zapisati. Postupak se može prikazati i dijagramom toka.\n\n7. PRILOZI\n   Dokumentacija i obrasci kojima se potvrđuje da su aktivnosti propisane\n   dokumentom provedene sukladno specificiranim zahtjevima.\n\n### 6.3.3 Format dokumenata\n\nFormat naslovne i unutarnje strane Priručnika kvalitete definiran je u samom\nPriručniku.\n\nFormat naslovne strane programskih postupaka i radnih uputa definiran je\nobrascem OB-NST-002 (Prilog 7.2).\n\nFormat unutarnje strane programskih postupaka i radnih uputa definiran je\nobrascem OB-UST-004 (Prilog 7.3).\n\n### 6.4     Označavanje dokumenata\n\nPrepoznavanje i sljedivost dokumenata u svakoj fazi postupanja kod upravljanja\ndokumentima ostvaruje se jedinstvenim načinom označivanja dokumenata\nidentifikacijskom oznakom preko IOD broja dokumenta koji se upisuje na\nnaslovnoj strani dokumenta.\n\nUlazne dokumente/dopise vezane za projekte, administrator nakon zaprimanja\ndostavlja odgovornom rukovodećem osoblju (direktor, voditelj projekta, voditelj\nKFP, voditelj QA) od kojih dobiva IOD broj prema zahtjevu „Evidencijske liste IOD\nbrojeva QA zapisa projekta – kojem pripadaju\".\n\n#### 6.4.1 Identifikacijska oznaka dokumenta (IOD broj)\n\nIOD broj strukturiran je od 6 polja različitog broja mjesta, tako da se stvara alfa-\nnumerička oznaka na sljedeći način:\n\n```\n                             (1.)  (2.)   (3.) (4.)     (5.)    (6.)\n                          DD-NNN-BBB/GG-VVVBB-RBB\n                                                                         status, revizija\n\nvrsta dokumenta                                             sadržaj, vod. proj., broj\nvrsta oznake\n\n                 vrsta objekta                                      godina ugovora\n                 vrsta projekta\n                 vrsta entiteta                    redni broj dokumenta iz GIP-a\n                 naručitelj-kupac\n```\n\n(1.) Polje - Vrsta dokumenta\n---\nProgramski postupak                                                                 Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                              Rev. 6        Str: 9/26\n\nNa 1. i 2. mjesto u IOD broju upisuje se dvoslovna oznaka vrste dokumenta ili vrste neke druge oznake prema odabiru iz Pojmovnika - Popisa pojmova i kratica.\n\nNa 3. mjesto u IOD broju unosi se znak \"-\" radi razdvajanja.\n\n(2.) Polje - Vrsta objekta\n\nOd 4. do 6. mjesta u IOD broju upisuje se troslovna oznaka vrste objekta, projekta, naručitelja projekta (kupca) ili nekog drugog entiteta prema odabiru iz Pojmovnika.\n\nNa 7. mjesto u IOD broju unosi se znak \"-\" radi razdvajanja.\n\n(3.) Polje - Redni broj dokumenta\n\nOd 8. do 10. mjesta u IOD broju upisuje se redni broj dokumenta za svako područje rada, ili broj projekta iz GIP-a za dokumentaciju vezanu direktno za određeni projekt.\n\nNa 11. mjesto u IOD broju unosi se znak \"/\" radi razdvajanja fiksnog dijela od promjenjivog dijela IOD broja.\n\n(4.) Polje - Godina\n\nNa 12. i 13. mjesto u IOD broju upisuje se oznaka godine sastavljena od zadnja dva broja tekuće godine.\n\nNa 14. mjesto u IOD broju unosi se znak \"-\" radi razdvajanja.\n\n(5.) Polje - Sadržaj\n\nOd 15. do 19. mjesta u IOD broju upisuje se alfa-numerička oznaka promjenjivog broja mjesta ovisno o specifičnoj djelatnosti. Odnosi se na sadržaj dokumenta ili vezu na neki drugi dokument, odnosno i za neke druge sadržaje ukoliko se pokaže potreba. Popunjavanje ovih mjesta ovisi o namjeni oznake i karakteru dokumenta. Za dokumentaciju vezanu direktno za neki određeni projekt upisuje se oznaka-skraćenica voditelja projekta, definirana u pojmovniku i redni broj vrste dokumenta. Na prvi ili jedini zapis te vrste piše se redni broj 01 te se slijedeći zapisi iste vrste nastavljaju 02, 03, 04...........\n\nNa 20. mjesto u IOD broju (odnosno nakon zadnjeg mjesta u 5. polju) unosi se znak \"-\" radi razdvajanja.\n\n(6.) Polje - Status\n\nOd 21. do 23. mjesta u IOD broju (odnosno nakon znaka \"-\" razdvajanja) upisuje se status dokumenta koji jasno tumači njegovo stanje:\n\n- dokument na snazi (jednoslovna oznaka \"R\" i broj revizije), za dokumentaciju vezanu direktno za neki određeni projekt\n---\nProgramski postupak                                                          Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                      Rev. 6       Str: 10/26\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0009"},{"char_end":13742,"char_start":13337,"chunk_id":"CHUNK-DOC-0025-0010","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.4.2 Primjer označivanja QA dokumenata [line 298]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0025-0009","sequence":10,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.4.2 Primjer označivanja QA dokumenata\n\nOznačivanje QA dokumenata izvodi se za onu QA dokumentaciju koja direktno pripada nekom projektu i koja se prilaže ostaloj projektnoj dokumentaciji koju vodi i održava administrator – tajnica Enconeta.\n\nPriručnik kvalitete, programski postupci i radne upute ne označavaju se IOD brojem, jer imaju svoj sistem označavanja, prema popisu tih dokumenata na SUK-u.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0010"},{"char_end":19378,"char_start":13742,"chunk_id":"CHUNK-DOC-0025-0011","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.4.3 Primjer označivanja dokumenata vezanih na proizvod/projekt [line 304]","next_chunk_id":"CHUNK-DOC-0025-0012","previous_chunk_id":null,"sequence":11,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.4.3 Primjer označivanja dokumenata vezanih na proizvod/projekt\n\nOznačivanje dokumentacije koja se odnosi na konkretan proizvod/projekt temelji se na prepoznavanju i sljedivosti dokumenta od dostavljanja zahtjeva za ponudom, preko izrade i prihvaćanja ponude, do sklapanja i realizacije ugovora. Zato svi dokumenti za jedan projekt (Zahtjev za Ponudu/Upit, Ponuda, Ugovor/Narudžba, Plan realizacije projekta, Projekt i dr.) imaju isti redni broj (3. polje IOD broja prema točki 6.4.1), broj projekta iz GIP-a.\n\nVoditelj projekta, prema određenoj evidencijskoj listi IOD brojeva projekta (vidi Prilog 7.4), određuje IOD brojeve za dokumente iz svoje nadležnosti te ih dostavlja administratoru radi urudžbiranja dokumenata. Slijede primjeri označavanja bitne dokumentacije projekta u NE Krško, broj projekta u GIP-u je 208, godine 2011, voditelj projekta je direktor DIR, redni broj vrste dokumenta bb, broj revizije projekta je Rbb:\n\n| Administrator – Sekretarica | IOD |\n|---------------------------|-----|\n| 1. Zahtjev za ponudu | ZP-NEK-208/11-DIRbb-Rbb |\n| 2. Ponuda br. 266/11 | PD-NEK-208/11-DIRbb-Rbb |\n| 3. Ugovor br. 616/11 | UG-NEK-208/11-DIRbb-Rbb |\n| Narudbenica | NR-NEK-208/11-DIRbb-Rbb |\n| 4. Ugovor s dobavljačem | UGD-NEK-208/11-DIRbb-Rbb |\n| 5. Zapisnik s dobavljačem | ZAD-NEK-208/11-DIRbb-Rbb |\n| 6. Ocjena zahtjeva za proizvod OB-OZP-034 | OC-NEK-208/11-DIRbb-Rbb |\n| 7. Plan izvedbe projekta OB-PIP-043 | PL-NEK-208/11-DIRbb-Rbb |\n| 8. Praćenje uspješnosti projekta OB-PUP-039 | PUP-NEK-208/11-DIRbb-Rbb |\n| 9. Zapisnik o primopredaji proizvoda/usluge OB-ZPP-035 | ZPP-NEK-208/11-DIRbb-Rbb |\n| 10. Reklamacije OB-REK-014 | REK-NEK-208/11-DIRbb-Rbb |\n| 11. Non – conformance report OB-NCR-016 | NCR-NEK-208/11-DIRbb-Rbb |\n| 12. Zapis kvalitete | ZK-NEK-208/11-DIRbb-Rbb |\n| 13. | |\n---\nProgramski postupak                                                               Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                            Rev. 6       Str: 11/26\n\n| QA Arhiva |  |\n|------------|--|\n| 14. Izvještaj | IZ-NEK-208/11-DIRbb-Rbb |\n| 15. Stručna ocjena | SO-NEK-208/11-DIRbb-Rbb |\n| 16. Elaborat | EL-NEK-208/11-DIRbb-Rbb |\n| 17. Studija | ST-NEK-208/11-DIRbb-Rbb |\n| 18. Status report | SR-NEK-208/11-DIRbb-Rbb |\n| 19. Test report | TR-NEK-208/11-DIRbb-Rbb |\n| 20. Outage (Remont) report | RE-NEK-208/11-DIRbb-Rbb |\n| 21. Work report | WR-NEK-208/11-DIRbb-Rbb |\n| 22. |  |\n| 23. |  |\n\nDokumentacija po brojem 1-11 iz prethodne tablice je arhivirana kod administratora – sekretarice, a izvještaji pod brojem 12-19 arhivirani su u QA arhivi. Sva ostala projektna dokumentacija (ulazna dokumentacija, korespondencija, mailovi, proračuni, analize, nacrti, tabele, standardi itd) arhivirana je kod voditelja projekta. Urudžbirana i arhivirana projektna dokumentacija nije limitirana primjerima u ovoj tablici i prema karakteru projekta može biti proširena od strane voditelja projekta.\n\nSvi dokumenti projekata vezani za NE Krško čuvaju se do kraja životnog vijeka NE Krško, dok se dokumentacija ostalih projekata čuva na rok od deset godina.\n\n### 6.4.4 Primjer označivanja komercijalno – financijskih dokumenata\n\nVoditelj KFP, prema potrebi, određuje IOD brojeve za dokumente iz svoje nadležnosti te ih dostavlja administratoru radi arhiviranja projektne dokumentacije.\n\n### 6.4.5 Jedan ugovor - više nezavisnih projekata (NE Krško)\n\nVoditelj projekta (ugovora s više projektnih nezavisnih cjelina) mora koordinirati izdavanje IOD brojeva za svoje dokumente. Za dokumentaciju koja se odnosi generalno na kompletan ugovor (PIP, OZP, PUP, NCR, itd), u polje broj 5 unosi se oznaka voditelja projekta. Za ostalu dokumentaciju (izvještaji, studije, elaborati, stručne ocjene, test report-i, work report-i, outage report-i, itd) u polje broj pet unosi se oznaka autora dokumenta.\n\nUnutar jednog ugovora s više nezavisnih tehnoloških cjelina pojavljivat će se više istovrsnih izvještaja od različitih autora, status reporta – SR na primjer. U tom slučaju sva dosadašnja pravila i dalje vrijede, samo će se povećavati redni broj dokumenta i to bez obzira tko je autor dokumenta. Za ispravno evidentiranje rednog broja zadužen je voditelj projekta. Autori dokumenta moraju slijedeći redni broj tražiti i dobiti od voditelja projekta.\n\nPrimjer:\n---\nProgramski postupak                                                                 Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                              Rev. 6        Str: 12/26\nSR-NEK-304/16-AAAbb-Rbb\n\nSR – vrsta izvještaja\nNEK – naručitelj\n304 – broj projekta prema GIP-u\n16 – godina u kojoj se izvještaj izdaje\nAAA- Inicijali glavnog autora izvještaja (RBA, BLU, MBA, DMU)\nbb – redni broj izvještaja koji se uvećava za 1 za svaki novi SR bez obzira ne to\ntko je autor\nRbb – broj revizije R00\n\nDakle,\nBoško je pripremio status report    SR-NEK-304/16-BLU01-R00\nMatija je pripremio status report   SR-NEK-304/16-MBA02-R00\nBoškov slijedeći broj će biti       SR-NEK-304/16-BLU03-R00\nMatijin slijedeći broj će biti      SR-NEK-304/16-MBA04-R00\nXXX-ov slijedeći broj će biti       SR-NEK-304/16-XXX05-R00\nYYY-ov slijedeći broj će biti       SR-NEK-304/16-YYY06-R00\nItd.\n\nZa druge tipove dokumentacije vrijede ista pravila, a potrebno je promijeniti\nkraticu za vrstu izvještaja (Test Report – TR, Remont Report – RE, Work Report\n– WR itd.), pridodati kraticu za autora i dodijeliti broj izvještaja prema istom\nsekvencijalnom principu numeriranja za tip izvještaja (ne prema autoru).\n\nDirektor Enconeta imenuje voditelja projekta kao i izvršioce pod projekata kroz\nponudbeno-ugovornu dokumentaciju.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0011"},{"char_end":20738,"char_start":19378,"chunk_id":"CHUNK-DOC-0025-0012","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.5 Priprema, pregled i odobravanje dokumenata [line 389]","next_chunk_id":"CHUNK-DOC-0025-0013","previous_chunk_id":"CHUNK-DOC-0025-0011","sequence":12,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.5 Priprema, pregled i odobravanje dokumenata\n\nPrijedloge pisanih postupaka, radnih uputa i ostalih dokumenata izrađuje\nosposobljeno i ovlašteno osoblje pojedinih odjela sukladno specificiranim radnim\nnalozima.\n\nPregled i procjenu usklađenosti dokumenata s propisanim zahtjevima obavlja\nstručna ovlaštena osoba koja je barem jednako osposobljena kao i autor\ndokumenta. Ovisno o složenosti i sadržaju, dokument pregledava jedna ili više\nstručnih osoba. Osoba koja pregledava dokument dostavlja autoru dokumenta\nsvoje primjedbe i prijedloge na tekst prijedloga dokumenta.\n\nNa osnovu dobivenih primjedbi i prijedloga autor dokumenta prihvaća korisne,\nopravdane i svrsishodne te vrši korekcije, ili odbacuje neprimjerene komentare i\nizrađuje konačni tekst dokumenta za potpisivanje i odobravanje.\n\nPriručnik kvalitete i programske postupke priprema odgovarajuće QA osoblje,\npregledava voditelj QA i/ili drugo imenovano osoblje a odobrava direktor\nEnconeta.\n\nRadne upute priprema stručno osoblje iz odjela, na čiju djelatnost se odnosi\nradna uputa, pregledava voditelj QA a odobrava voditelj odgovarajućeg projekta\nili direktor Enconeta.\n---\nProgramski postupak                                                                   Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                                Rev. 6        Str: 13/26\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0012"},{"char_end":21291,"char_start":20738,"chunk_id":"CHUNK-DOC-0025-0013","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.6     Potpisi i žigovi na dokumentima [line 416]","next_chunk_id":"CHUNK-DOC-0025-0014","previous_chunk_id":"CHUNK-DOC-0025-0012","sequence":13,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.6     Potpisi i žigovi na dokumentima\n\nPojedine dokumente potpisuje ovlašteno osoblje Enconeta u skladu s ovim postupkom. Potpisi svih djelatnika Enconeta deponirani su na popisu u SUK-u, grupa 27, u kojem je navedeno ime i prezime, titula i funkcija djelatnika, te oblik vlastoručnog parafa i potpisa za ovjeravanje izrađenih dokumenata.\n\nU prilogu 7.5 ovog postupka priloženi su svi žigovi Enconeta. Prikazan je oblik, sadržaj i dat način korištenja i čuvanja žigova. Detaljnija svrha korištenja nekih žigova data je u odgovarajućim postupcima.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0013"},{"char_end":23687,"char_start":21291,"chunk_id":"CHUNK-DOC-0025-0014","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.7       Objavljivanje, dostava i poništavanje dokumenata [line 422]","next_chunk_id":"CHUNK-DOC-0025-0015","previous_chunk_id":"CHUNK-DOC-0025-0013","sequence":14,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.7       Objavljivanje, dostava i poništavanje dokumenata\n\nKorisnici i brojevi kontroliranih kopija priručnika kvalitete, programskih postupaka i radnih uputa su:\n\n- QA arhiva Enconeta-ZG – kontrolirana kopija broj: 1\n- QA arhiva odjela OIU na lokaciji NE Krško – kontrolirana kopija broj: 2\n- Direktor Enconeta – kontrolirana kopija: 3\n- QA Služba NEK.SKV na lokaciji Krško – kontrolirana kopija broj: 4\n\nVlasnici/nositelji pojedinih dokumenata (Voditelj projekta, voditelj QA poslova, stručna odgovorna osoba), odobrene dokumente s dostavnom listom kontroliranih kopija OB-DLK-010 (Prilog 7.6), predaju administratoru radi ovjere, urudžbiranja i dostave dokumenata korisnicima.\n\nAdministrator prije urudžbiranja i dostave treba provjeriti da li dokument ima naslov i naziv, IOD broj, broj važeće revizije, vlastoručne potpise osoba koje su dokument izradile, pregledale i odobrile, te da li su kompletirani svi prilozi.\n\nUkoliko nedostaje neki podatak ili postoji sumnja u njegovu vjerodostojnost, administrator provjerava stanje kod nadležnog voditelja projekta. Ukoliko nije moguće razriješiti nedoumicu o tome izvještava voditelja QA i/ili direktora Enconeta.\n\nPrema priloženoj dostavnoj listi kontroliranih kopija administrator izrađuje kontrolirane kopije izvornika i na naslovnoj strani svake od njih upisuje odgovarajući broj kontrolirane kopije, te ih dostavlja svim korisnicima prema listi kontroliranih kopija, s naznakom da se postojeći dokument (ukoliko je već ranije dostavljen) povlači iz upotrebe i zamjenjuje novim.\n\nKad korisnici prime dokument s dostavnom listom, dostavnu listu potpisuju i vraćaju administratoru a staru nevažeću reviziju dokumenta uništavaju ili vidljivo označavaju da nije za upotrebu, te uklanjaju s mjesta korištenja.\n\nAdministrator predaje izvornik na mjesto čuvanja dokumenta (arhiva QA, centralna arhiva ili arhiva na nekoj drugoj lokaciji) a dostavnu listu kontroliranih kopija, potpisanu od korisnika, predaje voditelju QA radi vođenja evidencije.\n---\nProgramski postupak                                                                 Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                              Rev. 6        Str: 14/26\n\nAdministrator žigom \"PONIŠTENO\" ovjerava izvornik stare revizije dokumenta koji se radi regulatornih, ugovornih ili stručnih razloga pohranjuje u odgovarajućoj arhivi Enconeta.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0014"},{"char_end":26198,"char_start":23687,"chunk_id":"CHUNK-DOC-0025-0015","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.8      Periodički pregledi, izmjene, revizije i privremeni dokumenti [line 448]","next_chunk_id":"CHUNK-DOC-0025-0016","previous_chunk_id":"CHUNK-DOC-0025-0014","sequence":15,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.8      Periodički pregledi, izmjene, revizije i privremeni dokumenti\n\n### 6.8.1     Periodički pregled i revizija dokumenata\n\nSvi dokumenti sustava kvalitete podliježu periodičkom pregledu i reviziji.\n\nPeriodički pregled i revizija Priručnika kvalitete i programskih postupaka obavlja se, u pravilu, svake treće godine a prema potrebi i nalogu direktora Enconeta može se obaviti u bilo kojem trenutku. Periodički pregled i revizija ostalih dokumenata obavlja se prema potrebi i procjeni ovlaštenih osoba.\n\nDokument, podvrgnut periodičkom pregledu, prolazi isti postupak pregleda i odobravanja kao i izvorni dokument prema točki 6.5, a objavljivanje i dostava nove te poništavanje stare revizije dokumenta prema točki 6.6.\n\nRevidirani dokument dobiva novu oznaku izdanja/revizije i novi datum izdavanja. Dio teksta koji se promijenio, u odnosu na staru reviziju, u novoj reviziji dokumenta označava se vertikalnom crtom na desnoj margini dokumenta.\n\n### 6.8.2 Izmjene i revizije dokumenata\n\nSvaki korisnik dokumenta, sa svog stanovišta, može inicirati izmjenu dokumenta popunjavanjem zahtjeva za izmjenom dokumenta na obrascu OB-ZIZ-012 (Prilog 7.7). Opravdanost zahtjeva za promjenom razmatra autor dokumenta i odgovorna osoba koja je odobrila njegovu primjenu.\n\nDokument koji se mijenja prolazi postupak pregleda, odobravanja, objavljivanja, dostave nove te poništavanja stare revizije na isti način kao i izvorni dokument prema točki 6.5, odnosno 6.6.\n\nPromijenjeni dokument dobiva novu oznaku izdanja/revizije i novi datum izdavanja. Dio teksta koji se promijenio, u odnosu na staru reviziju, u novoj reviziji dokumenta označava se vertikalnom crtom na desnoj margini dokumenta.\n\n### 6.8.3 Privremeni dokumenti\n\nPri određenim uvjetima mogu se privremeno koristiti neki dokumenti s jasno ograničenim vremenskim rokom korištenja, kako bi se omogućile i podržale određene aktivnosti privremenog trajanja ili do objavljivanja nove revizije postojećeg dokumenta. Privremeni dokument podliježe jednakom postupku kao i dokument trajnog karaktera ali s jasno naznačenim vremenskim rokom važenja i s oznakom \"PRIVREMENO\" u polju ovjerenom žigom za urudžbiranje. Nakon isteka roka dokument se povlači ili integrira u odgovarajući novi dokument, ili se obnavlja privremeni rok važenja dokumenta.\n---\nProgramski postupak                                                                 Naziv dok: PP-42-01\nUPRAVLJANJE DOKUMENTIMA                                                              Rev. 6        Str: 15/26\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0015"},{"char_end":28489,"char_start":26198,"chunk_id":"CHUNK-DOC-0025-0016","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0025","heading_path":"UPRAVLJANJE DOKUMENTIMA [line 1] > 6.9      Arhiviranje, izdavanje i čuvanje dokumentacije [line 474]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0025-0015","sequence":16,"source_sha256":"1b53fc1416b34cf36dfde3a226c482c046010f5f4ae0c65dbc63b3384bf20483","text":"## 6.9      Arhiviranje, izdavanje i čuvanje dokumentacije\n\n### 6.9.1     Arhiva i izdavanje dokumenata u sjedištu Enconeta\n\nArhiva QA dokumentacije Enconeta smještena je u sjedištu tvrtke. U «QA arhivi» se pohranjuje, čuva i izuzima radi korištenja sva dokumentacija Enconeta koja je, u sustavu upravljanja dokumentima, definirana kao zapis kvalitete (ZK), prema postupku PP-42-02 «Zapisi kvalitete». Sva ostala dokumentacija Enconeta koja nije zapis kvalitete (NZK) pohranjena je u «Centralnoj arhivi».\n\nZapisi kvalitete pohranjuju se kontinuirano kako nastaju t.j. nakon završetka pojedinih faza tehnološkog procesa i određenih QA aktivnosti. Ulažu se u označene registratore (papirnati zapisi) odnosno upisuju na elektronski medij (elektronski zapisi). Čuvaju se u odgovarajućim datotekama, kutijama, registratorima, na metalnim policama s posebnim mjerama zaštite, tako da se izbjegne propadanje i uništavanje, te spriječi njihov gubitak. Na svakoj polici nalazi se oznaka projekta / područja za koje se vode zapisi kvalitete.\n\n### 6.9.2 Arhiva na lokaciji NE Krško\n\nNa sve zapise kvalitete i kontrolirane kopije QA dokumentacije (priručnik kvalitete, programski postupci, itd.) koji se dostavljaju za korištenje i pohranjivanje u arhivu Enconeta na lokaciji NE Krško, primjenjuju se opći zahtjevi upravljanja dokumentima i podacima, te upravljanja zapisima kvalitete propisani normom (Ref. 1), smjernicom (Ref. 2) i SUK.\n\nNa sve dokumente i zapise kvalitete, izrađene za potrebe obavljanja poslova i korištenje u NE Krško, primjenjuju se i posebni zahtjevi određeni u NEK QA Planu i pod nadzorom su QA službe NEK.\n\n### 6.9.3 Čuvanje dokumenata\n\nDokumenti se pohranjuju i čuvaju na takav način da se mogu lako pronaći i da su u odgovarajućim okolišnim uvjetima kako bi se spriječilo oštećenje, propadanje i gubitak dokumenata.\n\nSvi dokumenti koji su, prema postupku PP-42-02 «Upravljanje zapisima», (Ref. 5) razvrstani u ZK dokumente čuvaju se u QA arhivi. QA arhiva je zaključani prostor u kojem su dokumenti zaštićeni od propadanja i mogućih oštećenja (svjetlo, vlaga, požar, kukci, plijesan i t.d.). Ključevi QA arhive nalaze se kod administratora i/ili voditelja QA.\n\nRazvrstavanje dokumenata u odnosu na klasu zapisa kvalitete i period čuvanja obavlja se prema postupku PP-42-02.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0025-0016"},{"char_end":4040,"char_start":3350,"chunk_id":"CHUNK-DOC-0026-0007","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0026","heading_path":"4. DEFINICIJE I KRATICE [line 86]","next_chunk_id":"CHUNK-DOC-0026-0008","previous_chunk_id":null,"sequence":7,"source_sha256":"c0c50bdf1b4d5f974e7fbddbcd024680fc89e79c2588aa5a536c5c7d8b860f42","text":"# 4. DEFINICIJE I KRATICE\n\nEN – Europska norma\nEnconet - Enconet d.o.o.\nGPD – Glavni popis dokumenata\nHRN – Hrvatska norma\nIAEA - Međunarodna agencija za atomsku energiju\nIOD - Identifikacijska oznaka dokumenta\nISO - Međunarodna organizacija za normizaciju\nORG - Organizacija poslovanja Enconeta\nPK - Priručnik kvalitete\nPP - Programski postupak\nQA - Osiguravanje kvalitete\nSUK - Sustav kvalitete Enconeta\nZK1, ZK2, ZK3 – zapisi klase 1, 2, 3\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak.                                                                    Naziv dok PP-42-02\nUPRAVLJANJE ZAPISIMA                                                                    Rev: 5        Str: 4/8\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0026-0007"},{"char_end":4561,"char_start":4040,"chunk_id":"CHUNK-DOC-0026-0008","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0026","heading_path":"4. DEFINICIJE I KRATICE [line 86] > 5. ODGOVORNOSTI [line 107]","next_chunk_id":"CHUNK-DOC-0026-0009","previous_chunk_id":"CHUNK-DOC-0026-0007","sequence":8,"source_sha256":"c0c50bdf1b4d5f974e7fbddbcd024680fc89e79c2588aa5a536c5c7d8b860f42","text":"## 5. ODGOVORNOSTI\n\nDirektor Enconeta odgovoran je za osiguravanje resursa potrebnih za uspostavu sustava upravljanja zapisima.\n\nVoditelji projekata odgovorni su za prikupljanje, odlaganje i rukovanje zapisima koji se odnose na projekte iz njihovog područja rada.\n\nVoditelj QA poslova odgovoran je za uspostavu i održavanje sustava upravljanja zapisima kvalitete, odnosno njihovu identifikaciju, prikupljanje, evidenciju, pohranu, zaštitu i uništavanje.\n\nAdministrator je odgovoran za urudžbiranje i rukovanje zapisima.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0026-0008"},{"char_end":6483,"char_start":4561,"chunk_id":"CHUNK-DOC-0026-0009","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0026","heading_path":"4. DEFINICIJE I KRATICE [line 86] > 6. POSTUPAK [line 117]","next_chunk_id":"CHUNK-DOC-0026-0010","previous_chunk_id":"CHUNK-DOC-0026-0008","sequence":9,"source_sha256":"c0c50bdf1b4d5f974e7fbddbcd024680fc89e79c2588aa5a536c5c7d8b860f42","text":"## 6. POSTUPAK\n\nZapisi o kvaliteti su rezultat provedenih radnji, postupaka i uputa. i prateći su dokumenti uz proizvod odnosno uslugu. Moraju se čuvati radi dokazivanja sukladnosti s propisanim zahtjevima i uspješnosti djelovanja sustava kvalitete. Važni zapisi kvalitete podugovarača moraju biti sastavni dio tih podataka. Zapisi mogu biti u bilo kojoj formi i na bilo kojoj vrsti medija (papir, elektronski medij). Svi zapisi su potpisani, datirani, čitljivi, kompletni i prepoznatljivi glede proizvoda ili usluge. Postupanje sa zapisima kvalitete u pogledu njihove primjerenosti, dostupnosti, sljedivosti i čuvanja značajan je dio posla u uspostavi sustava kvalitete, te je važan čimbenik u certifikacijskoj prosudbi SUK.\n\n### 6.1 Klasifikacija i vrijeme čuvanja zapisa\n\nSvi zapisi, neovisno jesu li nastali u Enconetu ili dolaze od kupca, dobavljača odnosno trećih osoba, klasificiraju se s obzirom na vremensko razdoblje čuvanja:\n\n| Vremensko razdoblje čuvanja: | Klasa dokumenta: |\n|------------------------------|-------------------|\n| Trajno čuvanje dokumenta | ZK1 |\n| Čuvanje dokumenta 5 godina | ZK2 |\n| Čuvanje dokumenta do slijedeće revizije | ZK3 |\n\nKlasificirani zapisi čuvaju se s obzirom na njihovo značenje za kvalitetu, ali i radi ugovornih i/ili regulatornih obveza, te očuvanja stečenih znanja i posebnih tehnologija.\n\nU točki 7. ovog postupka priložena je tablica «Klasifikacija i vremensko razdoblje čuvanja zapisa», koja predstavlja smjernicu s obzirom na pojedinu vrstu zapisa. Za svaki pojedinačni zapis odluku donosi vlasnik zapisa odnosno voditelj projekta prema navedenoj klasifikaciji ili, prema potrebi, u suglasnosti s voditeljem QA poslova.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak.                                                                    Naziv dok PP-42-02\nUPRAVLJANJE ZAPISIMA                                                                    Rev: 5        Str: 5/8\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0026-0009"},{"char_end":7143,"char_start":6483,"chunk_id":"CHUNK-DOC-0026-0010","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0026","heading_path":"4. DEFINICIJE I KRATICE [line 86] > 6.2     Označivanje i objavljivanje zapisa [line 140]","next_chunk_id":"CHUNK-DOC-0026-0011","previous_chunk_id":"CHUNK-DOC-0026-0009","sequence":10,"source_sha256":"c0c50bdf1b4d5f974e7fbddbcd024680fc89e79c2588aa5a536c5c7d8b860f42","text":"## 6.2     Označivanje i objavljivanje zapisa\n\nSvi dokumenti sa statusom zapisa kvalitete moraju biti jedinstveno označeni IOD\nbrojem prema točki 6.4 postupka PP-42-01 «Upravljanje dokumentima» (Ref. 6)\nkako bi se osigurala njihova prepoznatljivost i sljedivost u svim fazama upravljanja\nzapisima kvalitete.\n\nSvi zapisi trebaju biti čitljivi i pogodni za umnožavanje, te potpuni i prepoznatljivi u\nodnosu na svrhu i mjesto nastajanja (realizacija projekta, dokumentacija sustava\nkvalitete, popravna radnja, ocjena uprav i sl.)\n\nZapisi se objavljuju kada dobiju IOD broj, te kada se ovjere žigom i urudžbiraju u\nGPD, prema točki 6.6 postupka PP-42-01 (Ref. 6)\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0026-0010"},{"char_end":13078,"char_start":7143,"chunk_id":"CHUNK-DOC-0026-0011","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0026","heading_path":"4. DEFINICIJE I KRATICE [line 86] > 6.3     Prikupljanje, evidencija i pronalaženje zapisa [line 154]","next_chunk_id":"CHUNK-DOC-0026-0012","previous_chunk_id":"CHUNK-DOC-0026-0010","sequence":11,"source_sha256":"c0c50bdf1b4d5f974e7fbddbcd024680fc89e79c2588aa5a536c5c7d8b860f42","text":"## 6.3     Prikupljanje, evidencija i pronalaženje zapisa\n\nZapisi kvalitete prikupljaju se kontinuirano kako nastaju t.j. nakon završetka\npojedinih faza radnog procesa i određenih QA aktivnosti.\n\nVoditelji projekata odgovorni su da prikupljaju zapise vezane za pojedine faze\nrealizacije njima pripadajućih projekata, a voditelj QA poslova za cjelokupni SUK.\n\nVlasnici zapisa (voditelji projekata, voditelj QA) utvrđuju status zapisa u klasi ZK1,\nZK2 ili ZK3 odnosno NZK prema klasifikaciji zapisa navedenoj u Prilogu (točka 7)\novog postupka. Periodi čuvanja zapisa s obzirom na određenu klasu dokumenta\n(ZK1, ZK2 ili ZK3) određeni su u točki 6.1 ovog postupka.\n\nRadi evidencije, održavanja te pretraživanja/pronalaženja i korištenja, zapisi se\nulažu u označene registratore (papirnati zapisi) odnosno upisuju na elektronski\nmedij (elektronski zapisi).\n\nZapisi, za čije je prikupljanje odgovoran voditelj projekta, odlažu se i čuvaju u\nregistratoru odgovarajućeg projekta.\n\nZapisi, za čije je prikupljanje odgovoran voditelj QA odlažu se i čuvaju u\nregistratorima označenim po vrstama zapisa (popravne radnje, preventivne radnje,\nocjene direktora, itd.\n\nDokumente sa statusom zapisa kvalitete administrator nakon urudžbiranja i\nobjavljivanja dostavlja u arhivu QA radi daljnjeg postupanja.\n\nUkupna evidencija zapisa kvalitete u Enconetu vodi se u GPD, gdje za svaki\nzapis/dokument postoji podatak o klasi zapisa/dokumenta. Određen prema\nklasifikaciji zapisa datoj u Prilogu 7 ovog postupka.\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak.                                                                   Naziv dok PP-42-02\nUPRAVLJANJE ZAPISIMA                                                                   Rev: 5       Str: 6/8\n\n### 6.4 Pohrana, zaštita i uništavanje zapisa\n\nZapisi se čuvaju u odgovarajućim datotekama, kutijama, policama, kabinetima i/ili protupožarnim ormarima u suhom prostoru i s posebnim mjerama zaštite, tako da se izbjegne propadanje i uništavanje i spriječi njihov gubitak, sukladno specificiranim uredbama i standardima, ugovornim zahtjevima i internim uputama Enconeta u skladu s postupkom PP-42-01.\n\nZapisi (dokumenti) čuvaju se na period određen klasom zapisa (vidi točku 6.1 i Prilog 7 u ovom postupku). Zapisi, kojima istekne rok, uništavaju se u Enconetu putem uređaja za rezanje papira. Za uništavanje je odgovoran vlasnik odgovarajućeg zapisa, na pr:\n\n- Zapisi vezani uz proizvod/projekt –voditelj projekta\n- financijsko/računovodstveni zapisi – voditelj računovodstva\n- zapisi SUK-a – voditelj QA\n- ostali zapisi – vlasnik zapisa\n\n### 7. PRILOZI\n\n### 7.1 Klasifikacija i vremensko razdoblje čuvanja zapisa\n\nENCONET d.o.o., Zagreb\n---\nProgramski postupak.                                                             Naziv dok PP-42-02\ ev za ponudu/Upit i pripadajuća dokumentacija | ZK2 |\n| Ponuda i pripadajuća dokumentacija | ZK2 |\n| Nabava (dokumenti za nabavu, prijemna kontrola, reklamacije i sl.) | ZK2 |\n| Dokumenti od dobavljača | ZK2 |\n| Zapisi o isporuci/prihvaćanju proizvoda | ZK2 |\n| 10CFR21 (21.51), Evaluacija odstupanja i grešaka, min. 5 godina | ZK2 |\n| 10CFR21 (21.51), Obavijesti kupcima baznih komponenata i vlasnicima licenci, min. 5 godina, dokumentacija kupnje baznih komponenata, min. 10 godina | ZK2 |\n| Priručnik kvalitete | ZK3 |\n| Nuklearni QA Plan | ZK3 |\n| Programski postupak | ZK3 |\n| Radna uputa | ZK3 |\n| Odluke o imenovanju djelatnika za QA zadatke | ZK3 |\n| Odluke (organizacija, upravljanje, SUK, politika i ciljevi kvalitete | ZK3 |\n| Radna dokumentacija u izradi dokumenta | ZK3 |\n| Popisi, podaci, informacije potrebni samo za tekuće stanje | ZK3 |\n| Smjernice, upute, obrasci | ZK3 |\n\nNapomena:\nVremensko razdoblje čuvanja dokumenata i podataka može biti i drugačije definirano\ns obzirom na ugovorne zahtjeve, garantne rokove, regulatorne zahtjeve i neke druge\nspecifičnosti.\n\nENCONET d.o.o., Zagreb","viewer_target":"#evidence/chunk/CHUNK-DOC-0026-0012"},{"char_end":4859,"char_start":4593,"chunk_id":"CHUNK-DOC-0027-0008","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0027","heading_path":"SADRŽAJ [line 34] > 4.2 Definicije [line 120]","next_chunk_id":"CHUNK-DOC-0027-0009","previous_chunk_id":null,"sequence":8,"source_sha256":"460ea5ace2a3f1a34349dd91dc728fe5a9bfd396b68988a6c48ac9cb2a01f9b6","text":"## 4.2 Definicije\n\n**Izobrazba** - upućivanje u osnovna i temeljna načela i postavke, utjecajne\nčimbenike, te elemente i principe djelovanja.\n\n**Uvježbavanje** - trening osoblja da dobije potrebna znanja, sposobnosti i vještine\nza obavljanje određenih djelatnosti.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0027-0008"},{"char_end":5834,"char_start":4859,"chunk_id":"CHUNK-DOC-0027-0009","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0027","heading_path":"SADRŽAJ [line 34] > 5. ODGOVORNOSTI [line 128]","next_chunk_id":"CHUNK-DOC-0027-0010","previous_chunk_id":"CHUNK-DOC-0027-0008","sequence":9,"source_sha256":"460ea5ace2a3f1a34349dd91dc728fe5a9bfd396b68988a6c48ac9cb2a01f9b6","text":"## 5. ODGOVORNOSTI\n\n**Direktor Enconeta** odgovoran je da osoblje, koje obavlja poslove koji utječu na\nkvalitetu proizvoda, ima odgovarajuću izobrazbu, znanja, osposobljenost i\nvještine koje su u skladu sa zahtjevima posla kojega obavlja. Odobrava planove\nizobrazbe.\n\n**Voditelji projekata** odgovorni su za izradu planova izobrazbe i uvježbavanja\nsvojih suradnika na temelju planova aktivnosti za poslove iz njihove nadležnosti.\n\n**Kadrovska funkcija ili za to ovlaštena osoba** izrađuje konačan Godišnji plan\nizobrazbe.\n\n**Voditelj QA poslova** odgovoran je za planiranje i provođenje izobrazbe osoblja\no sustavu kvalitete, te uvježbavanje osoblja za provođenje određenih QA\naktivnosti.\n\n**Administrator** vodi i ažurira kadrovsku evidenciju.\n\n**Cjelokupno osoblje Enconeta** odgovorno je za obavljanje izobrazbe i\nuvježbavanje provođenja QA aktivnosti i aktivnosti koje utječu na kvalitetu te\nuručivanje svih potvrda o obavljenoj izobrazbi i uvježbavanju administratoru.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0027-0009"},{"char_end":7806,"char_start":5834,"chunk_id":"CHUNK-DOC-0027-0010","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0027","heading_path":"SADRŽAJ [line 34] > 6. POSTUPAK [line 151]","next_chunk_id":"CHUNK-DOC-0027-0011","previous_chunk_id":"CHUNK-DOC-0027-0009","sequence":10,"source_sha256":"460ea5ace2a3f1a34349dd91dc728fe5a9bfd396b68988a6c48ac9cb2a01f9b6","text":"## 6. POSTUPAK\n\n### 6.1 Planiranje izobrazbe i uvježbavanja\n\nOsposobljenost za kvalitetno obavljanje poslova djelatnici Enconeta postižu\nredovitim školovanjem i stjecanjem odgovarajućeg stupnja obrazovanja te\nnaknadnim stalnim obrazovanjem i usvajanjem specifičnih znanja, vještina i\niskustava potrebnih za uspješno i kvalitetno obavljanje poslova.\n\nCilj izobrazbe i uvježbavanja je postizanje tih specifičnih znanja, vještina i\niskustva. Potrebna specifična znanja i vještine stječu se:\n\n- putem specijalističkih seminara koje provode nadležne vanjske institucije\n- specijalističkom obukom koja se organizira i provodi u Enconetu\n- vlastitim iskustvom radnika (dugotrajnim radom na istim ili sličnim poslovima)\n\nEnconet d.o.o., Zagreb\n---\nProgramski postupak\nIZOBRAZBA I UVJEŽBAVANJE OSOBLJA\n\nOznaka dok: PP-62-01\nRev: 4     Str. 5/12\n\nU skladu s postavljenim zahtjevima na osposobljenost i stalnu izobrazbu osoblja koje obavlja poslove koji utječu na kvalitetu proizvoda (PK6.2) Enconet će utvrđivati i provoditi Planove izobrazbe i uvježbavanja. U pravilu su to Godišnji planovi koji, sumarno za sve djelatnike Enconeta, sadrže potrebe za izobrazbom i uvježbavanjem na svim područjima kao što su:\n\n- osposobljavanje za rad na siguran način (zaštita na radu, zaštita od požara, radiološka zaštita, periodički liječnički pregledi i sl.)\n- odgovarajuće stručno osposobljavanje za sve djelatnosti Enconeta\n- osposobljavanje za područje Sustava kvalitete\n- opća izobrazba\n\nPlanovi izobrazbe mogu biti sumarni za sva područja ili odvojeno po gore navedenim područjima.\n\nVoditelji projekata odgovorni su za izradu i prijavu planova izobrazbe i uvježbavanja svojih suradnika na temelju planova aktivnosti za poslove iz njihove nadležnosti.\n\nVoditelj QA odgovoran je za izradu i prijavu planova izobrazbe za područje sustava kvalitete.\n\nOdgovorni referent za kadrove ili za to ovlaštena osoba izrađuje konačan plan izobrazbe.\n\nDirektor Enconeta odobrava sve planove izobrazbe.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0027-0010"},{"char_end":11246,"char_start":7806,"chunk_id":"CHUNK-DOC-0027-0011","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0027","heading_path":"SADRŽAJ [line 34] > 6.2 Provođenje izobrazbe i uvježbavanja [line 192]","next_chunk_id":"CHUNK-DOC-0027-0012","previous_chunk_id":"CHUNK-DOC-0027-0010","sequence":11,"source_sha256":"460ea5ace2a3f1a34349dd91dc728fe5a9bfd396b68988a6c48ac9cb2a01f9b6","text":"## 6.2 Provođenje izobrazbe i uvježbavanja\n\nIzobrazba i uvježbavanje provodi se prema odgovarajućem Planu i u nadležnoj vanjskoj instituciji ili u Enconetu kao interno osposobljavanje.\n\nQA osposobljavanje internih auditora vrši se pohađanjem specijalističkih seminara kod ovlaštenih institucija ili organizacija. Tako osposobljeni interni auditori ovlašteni su za provođenje internih audita u Enconetu.\n\nInterna QA izobrazba/uvježbavanje o sustavu kvalitete i njegovoj primjeni u Enconetu obavezna je, kako za rukovodeće osoblje Enconeta, tako i za osoblje u pojedinim odjelima i to u dovoljnoj mjeri da bi se ostvarila djelotvorna provedba sustava kvalitete.\n\nQA izobrazba/uvježbavanje provodi se u obliku predavanja (seminari, tečajevi i sl.) ili putem čitanja i razumijevanja određenih dokumenata.\n\nEnconet d.o.o., Zagreb\n---\nProgramski postupak\nIZOBRAZBA I UVJEŽBAVANJE OSOBLJA                                                                                                                                                        Oznaka dok: PP-62-01\n                                                                                                                                                                                          Rev: 4     Str. 6/12\n\nIzobrazba/uvježbavanje planira se prema obrascu OB-PIU-005 priloženom u točki 7. ovog postupka. Odobreni plan s utvrđenim temama i predavačima, planiranim učesnicima i pripadajućom dokumentacijom, dostavlja se svim učesnicima najmanje tjedan dana prije predviđenog termina izobrazbe. Učesnici izobrazbe/uvježbavanja potvrđuju primitak poziva i dokumentacije vlastoručnim potpisom na obrascu OB-PIU-005 koji se zatim čuva kao zapis kvalitete klase dokumen
