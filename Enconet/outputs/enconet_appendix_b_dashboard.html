 oštećenja voditelju projekta i pokrenuti korektivni postupak.\n\nKorisnik opreme dužan je zapisati jedinstvenu identifikacijsku oznaku instrumenta na radni nalog ili testnu mjernu listu.\n\nUkoliko se prilikom upotrebe primjeti odstupanje na instrumentu, mjerenje se prekida, obavještava se voditelj projekta i pokreće postupak za kalibraciju. Sva posljednja sumnjiva mjerenja treba ponoviti.\n\n### 6.5 Kalibracija MTE\n\nKalibracija se može izvoditi ili u organizaciji gdje se mjerenje izvodi (NEK) ili u nekoj vanjskoj akreditiranoj instituciji.\n\nInstrumenti se kalibriraju od niže prema višoj klasi.\n\nKalibraciju izvode osposobljene osobe, koristeći odgovarajuće priručnike.\n\nInstrumenti se mogu kalibrirati i u vanjskim akreditiranim institucijama ako su potvrđene i odobrene od strane QA (za NEK moraju biti na listi odobrenih dobavljača).\n\nNakon izvršene kalibracije moraju instrumenti imati kalibracijske naljepnice i biti popraćeni kalibracijskom listom (certifikatom), s nađenim stanjem i ostavljenim stanjem (as-found / as-left).\n\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0045-0009"},{"char_end":11570,"char_start":10769,"chunk_id":"CHUNK-DOC-0045-0010","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0045","heading_path":"SADRŽAJ [line 32] > 7. PRILOZI [line 205]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0045-0009","sequence":10,"source_sha256":"30ecac5384173d0ba92cdb6d617fec2caef8d573d0b34229631f09e695ba4a78","text":"## 7. PRILOZI\n\n### 7.1 Obrazac: OB-LMT-054 Rev. 2    Lista korištene MTE opreme Enconeta\n\n\n\n\nLista korištene MTE opreme Enconeta\n                                                                           Broj liste __/__\n\n| JEDINSTVENA OZNAKA INSTRUMENTA | | | | |\n|--------------------------------|---|---|---|---|\n| PROJEKT | | | | |\n| VODITELJ PROJEKTA | | | | |\n| OVLAŠTENI KORISNIK | | | | |\n| NAZIV INSTRUMENTA | | | | |\n| PROIZVOĐAČ MODEL TIP | | | | |\n| SERIJSKI BROJ | | | ce":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_III-0004","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0008-01","source_locator":"8.3.5 Izlazni podaci projektiranja i razvoja, lines 892-905","source_order":1,"text_original":"- Biti u obliku koji omogućava verifikaciju s obzirom na ulazne podatke","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0008-01"},{"chunk_id":"CHUNK-DOC-0022-0032","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_III-0004","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0008-02","source_locator":"8.3.5 Izlazni podaci projektiranja i razvoja, lines 892-905","source_order":2,"text_original":"- Biti odobreni prije objavljivanja","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0008-02"},{"chunk_id":"CHUNK-DOC-0022-0032","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_III-0004","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0008-03","source_locator":"8.3.5 Izlazni podaci projektiranja i razvoja, lines 892-905","source_order":3,"text_original":"- Definirati kriterije prihvatljivosti za proizvod ili na njih upućivati","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0008-03"},{"chunk_id":"CHUNK-DOC-0022-0032","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_III-0005","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0009-01","source_locator":"8.3.6 Promjene u projektiranju i razvoju, lines 907-915","source_order":1,"text_original":"Promjene u projektiranju i razvoju, kada je to svrsishodno, treba ocijeniti, ovjeriti, utvrditi prihvatljivost i odobriti prije primjene.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0009-01"},{"chunk_id":"CHUNK-DOC-0022-0032","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_III-0005","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0009-02","source_locator":"8.3.6 Promjene u projektiranju i razvoju, lines 907-915","source_order":2,"text_original":"Ocjena promjene treba sadržavati i ocjenu posljedica za sastavne dijelove i ranije isporučene proizvode.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0009-02"},{"chunk_id":"CHUNK-DOC-0022-0034","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_IV-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0010-01","source_locator":"8.4.3 Informacije za vanjske pružatelje usluga, lines 954-960","source_order":1,"text_original":"Dokumenti nabave moraju sadržavati podatke koji jasno i nedvosmisleno opisuju naručeni proizvod. Ako je potrebno, tim podacima treba dodati zahtjeve za odobravanje proizvoda, procesa, postupaka i opreme te zahtjeve za osposobljenost osoblja i zahtjeve za SUK.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0010-01"},{"chunk_id":"CHUNK-DOC-0022-0039","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_IX-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0017-01","source_locator":"8.5.5 Validacija procesa proizvodnje i pružanja usluga, lines 1010-1024","source_order":1,"text_original":"Procese, koji se ne mogu verificirati naknadnim praćenjem i mjerenjem, Enconet mora validirati kako bi dokazao sposobnost tih procesa za ostvarivanje planiranih rezultata.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0017-01"},{"chunk_id":"CHUNK-DOC-0022-0039","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_IX-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0017-02","source_locator":"8.5.5 Validacija procesa proizvodnje i pružanja usluga, lines 1010-1024","source_order":2,"text_original":"- Odrediti kriterije za vrednovanje i odobravanje tih procesa","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0017-02"},{"chunk_id":"CHUNK-DOC-0022-0039","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_IX-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0017-03","source_locator":"8.5.5 Validacija procesa proizvodnje i pružanja usluga, lines 1010-1024","source_order":3,"text_original":"- Odobriti opremu i sredstva te verificirati osposobljenost osoblja","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0017-03"},{"chunk_id":"CHUNK-DOC-0022-0039","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_IX-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0017-04","source_locator":"8.5.5 Validacija procesa proizvodnje i pružanja usluga, lines 1010-1024","source_order":4,"text_original":"- Definirati potrebne zapise","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0017-04"},{"chunk_id":"CHUNK-DOC-0022-0033","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_VII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0014-01","source_locator":"8.4.1 Proces nabave, lines 919-939","source_order":1,"text_original":"- Treba utvrditi kriterije za odabir, ocjenu i ponovnu ocjenu dobavljača","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0014-01"},{"chunk_id":"CHUNK-DOC-0022-0033","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_VII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0014-02","source_locator":"8.4.1 Proces nabave, lines 919-939","source_order":2,"text_original":"Najmanje jedanput godišnje Enconet ocjenjuje svoje dobavljače. Ocjenjivanje se provodi po utvrđenim kriterijima a podloge za to su zapisi o ulaznoj (prijemnoj) kontroli te drugi dokazi i saznanja o dobavljačima.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0014-02"},{"chunk_id":"CHUNK-DOC-0022-0034","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_VII-0002","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0015-01","source_locator":"8.4.2 Ovjera/verifikacija nabavljenoga proizvoda, lines 946-952","source_order":1,"text_original":"Enconet mora uspostaviti i primjenjivati postupke pregleda i inspekcije kako bi verificirao da nabavljeni proizvod udovoljava traženim zahtjevima. Kod postupka prijemne (ulazne) kontrole treba utvrditi da li je proizvod sukladan zahtjevima iz Ugovora po količini i kvaliteti, a ako ne udovoljava tim zahtjevima, treba definirati daljnji status tog proizvoda u skladu s postupkom PP-74-01 «Proces nabave i ocjenjivanje dobavljača».","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0015-01"},{"chunk_id":"CHUNK-DOC-0022-0036","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_VIII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0016-01","source_locator":"8.5.2 Označivanje i sljedivost, lines 982-988","source_order":1,"text_original":"Kad god je primjereno, Enconet treba uspostaviti i obnavljati dokumentirane postupke za prepoznavanje proizvoda tijekom realizacije. Sistem označivanja mora osigurati jednoznačno prepoznavanje proizvoda (koji proizvod, za kojega kupca, status odnosno revizija i sl.) Posebno će se voditi briga o označavanju statusa proizvoda s obzirom na zahtjev za nadzor i mjerenje.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0016-01"},{"chunk_id":"CHUNK-DOC-0022-0041","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_X-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0018-01","source_locator":"8.6 Nadzor nad proizvodom i mjerenje proizvoda, lines 1045-1060","source_order":1,"text_original":"Enconet će provoditi radnje nadzora a, prema potrebi, i mjerenja karakteristika proizvoda kako bi se verificiralo da su zahtjevi za proizvod ispunjeni.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0018-01"},{"chunk_id":"CHUNK-DOC-0022-0041","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_X-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0018-02","source_locator":"8.6 Nadzor nad proizvodom i mjerenje proizvoda, lines 1045-1060","source_order":2,"text_original":"Enconet neće isporučiti proizvod kupcu ako nije prošao potrebne nadzore i mjerenja koji dokazuju ispravnost proizvoda odnosno zadovoljenje zahtjeva kupca.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0018-02"},{"chunk_id":"CHUNK-DOC-0022-0030","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_XI-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0019-01","source_locator":"8.1 Operativno planiranje i nadzor, lines 765-776","source_order":1,"text_original":"- Radnje i aktivnosti za verifikaciju, validaciju, nadzor, inspekciju i ispitivanje koje su svojstvene tom proizvodu te kriterije za prihvaćanje proizvoda","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0019-01"},{"chunk_id":"CHUNK-DOC-0022-0038","confidence":1.0,"crumb_id":"CRUMB-DOC-0022-APP_B_XIII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0022-0021-01","source_locator":"8.5.4 Čuvanje proizvoda, lines 1002-1008","source_order":1,"text_original":"Kako bi se očuvala sukladnost proizvoda tijekom procesa realizacije Enconet mora uspostaviti i održavati dokumentirane postupke za identifikaciju (označivanje), rukovanje, pakiranje, skladištenje i zaštitu proizvoda. Sve ovo odnosi se kako na cijeli proizvod tako i na sastavne dijelove proizvoda.","viewer_target":"#evidence/quote/QUOTE-DOC-0022-0021-01"},{"chunk_id":"CHUNK-DOC-0023-0020","confidence":1.0,"crumb_id":"CRUMB-DOC-0023-APP_B_III-0002","language":"en","link_method":"EXACT","quote_id":"QUOTE-DOC-0023-0005-01","source_locator":"4.2.1.4 Base input deck applicability, page 18, lines 525-534","source_order":1,"text_original":"d. Nodalization supervisor shall verify base input deck applicability according to format presented in Appendix 6.6.","viewer_target":"#evidence/quote/QUOTE-DOC-0023-0005-01"},{"chunk_id":"CHUNK-DOC-0023-0020","confidence":1.0,"crumb_id":"CRUMB-DOC-0023-APP_B_III-0002","language":"en","link_method":"EXACT","quote_id":"QUOTE-DOC-0023-0005-02","source_locator":"4.2.1.4 Base input deck applicability, page 18, lines 525-534","source_order":2,"text_original":"e. RELAP5 analyst shall proceed with transient analysis only if base input deck is approved as applicable.","viewer_target":"#evidence/quote/QUOTE-DOC-0023-0005-02"},{"chunk_id":"CHUNK-DOC-0023-0019","confidence":1.0,"crumb_id":"CRUMB-DOC-0023-APP_B_VIII-0001","language":"en","link_method":"EXACT","quote_id":"QUOTE-DOC-0023-0010-01","source_locator":"4.1.1.2 RELAP5 Za izvršenje zadataka koji spadaju u kategoriju specijalnih procesa (zavarivanje, toplinska obrada, ispitivanje bez razaranja.....) osigurat će se zahtijevani trening i postupci.","viewer_target":"#evidence/quote/QUOTE-DOC-0024-0009-01"},{"chunk_id":"CHUNK-DOC-0024-0031","confidence":1.0,"crumb_id":"CRUMB-DOC-0024-APP_B_VII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0024-0007-01","source_locator":"6.3 Kontrola naručenih proizvoda i usluga, page 13, lines 423-432","source_order":1,"text_original":"Inspekcije i nezavisno ocjenjivanje kvalitete kod isporučitelja, kao i ispitivanje\nproizvoda ili usluge nakon isporuke, mora se provesti prema zahtjevima iz\nnabavnih dokumenata radi provjere sukladnosti.","viewer_target":"#evidence/quote/QUOTE-DOC-0024-0007-01"},{"chunk_id":"CHUNK-DOC-0024-0033","confidence":1.0,"crumb_id":"CRUMB-DOC-0024-APP_B_VIII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0024-0008-01","source_locator":"7.1 Identifikacija i kontrola materijala, dijelova i komponenti, page 14, lines 441-445","source_order":1,"text_original":"Enconet mora obavljati identifikaciju i kontrolu materijala, dijelova i komponenti koji su pod nadzorom Enconeta prilikom isporuke, ugradnje i rada, pomoću oznaka šarže, broja dijela, serijskog broja ili nekim drugim odgovarajućim načinom, bilo oznakom na dijelu bilo pomoću zapisa o sljedivosti dijelova.","viewer_target":"#evidence/quote/QUOTE-DOC-0024-0008-01"},{"chunk_id":"CHUNK-DOC-0024-0040","confidence":1.0,"crumb_id":"CRUMB-DOC-0024-APP_B_X-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0024-0010-01","source_locator":"9.1 Program inspekcije, page 16, lines 491-499","source_order":1,"text_original":"Ispitivanje dijelova, proizvoda ili usluga u opsegu isporuke Enconeta ili pod njegovim nadzorom mora provoditi osoblje koje nije sudjelovalo u izvođenju aktivnosti koje se pregledavaju.","viewer_target":"#evidence/quote/QUOTE-DOC-0024-0010-01"},{"chunk_id":"CHUNK-DOC-0024-0042","confidence":1.0,"crumb_id":"CRUMB-DOC-0024-APP_B_XII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0024-0012-01","source_locator":"9.3 Kalibracija i kontrola opreme za mjerenje i testiranje, page 16, lines 507-513","source_order":1,"text_original":"Ukoliko se utvrdi odstupanje izmjerenih vrijednosti preko dopuštenih ograničenja, mora se izvršiti vrednovanje vjerodostojnosti prije obavljenih mjerenja, a rezultati ispitivanja moraju se ponovno procijeniti za cjelokupno razdoblje od zadnje kalibracije.","viewer_target":"#evidence/quote/QUOTE-DOC-0024-0012-01"},{"chunk_id":"CHUNK-DOC-0024-0034","confidence":1.0,"crumb_id":"CRUMB-DOC-0024-APP_B_XIII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0024-0013-01","source_locator":"7.2 Rukovanje, skladištenje i otprema, page 14, lines 451-453","source_order":1,"text_original":"Enconet mora kontrolirati aktivnosti rukovanja, otpreme i skladištenja u svrhu sprječavanja oštećenja, propadanja ili gubitka proizvoda.","viewer_target":"#evidence/quote/QUOTE-DOC-0024-0013-01"},{"chunk_id":"CHUNK-DOC-0025-0009","confidence":1.0,"crumb_id":"CRUMB-DOC-0025-APP_B_V-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0025-0001-01","source_locator":"6.3 Sadržaj dokumenata, page 8, lines 200-208","source_order":1,"text_original":"Određuje se način izvođenja radnje s opisom pojedinačnih aktivnosti, Utvrđuje\n    se što se mora napraviti, tko će to napraviti, kada, gdje i kako.","viewer_target":"#evidence/quote/QUOTE-DOC-0025-0001-01"},{"chunk_id":"CHUNK-DOC-0025-0012","confidence":1.0,"crumb_id":"CRUMB-DOC-0025-APP_B_VI-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0025-0002-01","source_locator":"6.5 Priprema, pregled i odobravanje dokumenata, page 12, lines 389-407","source_order":1,"text_original":"Pregled i procjenu usklađenosti dokumenata s propisanim zahtjevima obavlja\nstručna ovlaštena osoba koja je barem jednako osposobljena kao i autor\ndokumenta.","viewer_target":"#evidence/quote/QUOTE-DOC-0025-0002-01"},{"chunk_id":"CHUNK-DOC-0025-0014","confidence":1.0,"crumb_id":"CRUMB-DOC-0025-APP_B_VI-0002","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0025-0003-01","source_locator":"6.7 Objavljivanje, dostava i poništavanje dokumenata, page 13, lines 422-435","source_order":1,"text_original":"Administrator prije urudžbiranja i dostave treba provjeriti da li dokument ima naslov i naziv, IOD broj, broj važeće revizije, vlastoručne potpise osoba koje su dokument izradile, pregledale i odobrile, te da li su kompletirani svi prilozi.","viewer_target":"#evidence/quote/QUOTE-DOC-0025-0003-01"},{"chunk_id":"CHUNK-DOC-0025-0014","confidence":1.0,"crumb_id":"CRUMB-DOC-0025-APP_B_VI-0003","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0025-0004-01","source_locator":"6.7 and 6.8.1, pages 13-14, lines 437-458","source_order":1,"text_original":"Kad korisnici prime dokument s dostavnom listom, dostavnu listu potpisuju i vraćaju administratoru a staru nevažeću reviziju dokumenta uništavaju ili vidljivo označavaju da nije za upotrebu, te uklanjaju s mjesta korištenja.","viewer_target":"#evidence/quote/QUOTE-DOC-0025-0004-01"},{"chunk_id":"CHUNK-DOC-0025-0015","confidence":1.0,"crumb_id":"CRUMB-DOC-0025-APP_B_VI-0003","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0025-0004-02","source_locator":"6.7 and 6.8.1, pages 13-14, lines 437-458","source_order":2,"text_original":"Dokument, podvrgnut periodičkom pregledu, prolazi isti postupak pregleda i odobravanja kao i izvorni dokument prema točki 6.5, a objavljivanje i dostava nove te poništavanje stare revizije dokumenta prema točki 6.6.","viewer_target":"#evidence/quote/QUOTE-DOC-0025-0004-02"},{"chunk_id":"CHUNK-DOC-0026-0008","confidence":1.0,"crumb_id":"CRUMB-DOC-0026-APP_B_XVII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0026-0001-01","source_locator":"5. Odgovornosti, page 4, lines 107-115","source_order":1,"text_original":"Vo je zapisa, page 5, lines 154-183","source_order":1,"text_original":"Radi evidencije, održavanja te pretraživanja/pronalaženja i korištenja, zapisi se\nulažu u označene registratore (papirnati zapisi) odnosno upisuju na elektronski\nmedij (elektronski zapisi).","viewer_target":"#evidence/quote/QUOTE-DOC-0026-0005-01"},{"chunk_id":"CHUNK-DOC-0027-0009","confidence":1.0,"crumb_id":"CRUMB-DOC-0027-APP_B_I-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0027-0001-01","source_locator":"5. Odgovornosti, page 4, lines 128-143","source_order":1,"text_original":"**Voditelj QA poslova** odgovoran je za planiranje i provođenje izobrazbe osoblja","viewer_target":"#evidence/quote/QUOTE-DOC-0027-0001-01"},{"chunk_id":"CHUNK-DOC-0027-0011","confidence":1.0,"crumb_id":"CRUMB-DOC-0027-APP_B_II-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0027-0002-01","source_locator":"6.2 Provođenje izobrazbe i uvježbavanja, page 5, lines 192-200","source_order":1,"text_original":"Interna QA izobrazba/uvježbavanje o sustavu kvalitete i njegovoj primjeni u Enconetu obavezna je, kako za rukovodeće osoblje Enconeta, tako i za osoblje u pojedinim odjelima i to u dovoljnoj mjeri da bi se ostvarila djelotvorna provedba sustava kvalitete.","viewer_target":"#evidence/quote/QUOTE-DOC-0027-0002-01"},{"chunk_id":"CHUNK-DOC-0029-0009","confidence":1.0,"crumb_id":"CRUMB-DOC-0029-APP_B_V-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0029-0007-01","source_locator":"6.1 Proces projektiranja i razvoja, page 4, lines 146-163","source_order":1,"text_original":"Proces projektiranja i razvoja obuhvaća slijedeće aktivnosti:","viewer_target":"#evidence/quote/QUOTE-DOC-0029-0007-01"},{"chunk_id":"CHUNK-DOC-0030-0009","confidence":1.0,"crumb_id":"CRUMB-DOC-0030-APP_B_II-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0030-0002-01","source_locator":"6.2 Učestalost audita, page 4, lines 145-160","source_order":1,"text_original":"U ciklusu od tri godi uage":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0032-0005-01","source_locator":"6.2 Preventivne radnje, page 6, line 224","source_order":1,"text_original":"Utvrđuje se i vremensko razdoblje u kojem će se pratiti rezultati provedbe preventivne radnje o čemu će se izvještavati direktor Enconeta i voditelj QA poslova.","viewer_target":"#evidence/quote/QUOTE-DOC-0032-0005-01"},{"chunk_id":"CHUNK-DOC-0038-0019","confidence":1.0,"crumb_id":"CRUMB-DOC-0038-APP_B_V-0001","language":"en","link_method":"EXACT","quote_id":"QUOTE-DOC-0038-0004-01","source_locator":"4.1.6 V\u0026V Documentation, page 9, lines 183-199","source_order":1,"text_original":"4.1.6.1 Tasks and criteria for accomplishing the verification of the","viewer_target":"#evidence/quote/QUOTE-DOC-0038-0004-01"},{"chunk_id":"CHUNK-DOC-0040-0027","confidence":1.0,"crumb_id":"CRUMB-DOC-0040-APP_B_XI-0001","language":"en","link_method":"EXACT","quote_id":"QUOTE-DOC-0040-0003-01","source_locator":"1.2 Scope and 8. Acceptance Criteria, pages 3 and 27, lines 76-87 and 715-717","source_order":1,"text_original":"Acceptance criteria encompass the set of critical parameters for selected diagnostic testing type.","viewer_target":"#evidence/quote/QUOTE-DOC-0040-0003-01"},{"chunk_id":"CHUNK-DOC-0040-0021","confidence":1.0,"crumb_id":"CRUMB-DOC-0040-APP_B_XIV-0001","language":"en","link_method":"EXACT","quote_id":"QUOTE-DOC-0040-0005-01","source_locator":"6. Prerequisites and 7.4 As Found Test Performance, pages 13 and 22, lines 397 and 666-670","source_order":1,"text_original":"6.8 Request an equipment clearance (e.g. test tag) for the task specified on the work package.","viewer_target":"#evidence/quote/QUOTE-DOC-0040-0005-01"},{"chunk_id":"CHUNK-DOC-0045-0009","confidence":1.0,"crumb_id":"CRUMB-DOC-0045-APP_B_XII-0001","language":"hr","link_method":"EXACT","quote_id":"QUOTE-DOC-0045-0003-01","source_locator":"6.1 Nabava i verifikacija nove MTE, page 6, lines 142-161","source_order":1,"text_original":"Ako je novonabavl   <script>
    'use strict';
    const dashboardData=JSON.parse(document.getElementById('dashboard-data').textContent);
    const ui=JSON.parse(document.getElementById('dashboard-ui').textContent);
    const evidenceElement=document.getElementById('evidence-bundle');
    const evidenceBundle=JSON.parse(evidenceElement.textContent);
    const evidenceMaps=evidenceBundle?{crumbs:new Map(evidenceBundle.crumbs.map(item=>[item.crumb_id,item])),documents:new Map(evidenceBundle.documents.map(item=>[item.document_id,item])),quotes:new Map(evidenceBundle.quotes.map(item=>[item.quote_id,item])),chunks:new Map(evidenceBundle.chunks.map(item=>[item.chunk_id,item])),evaluations:new Map(evidenceBundle.evaluations.map(item=>[item.evaluation_id,item])),gaps:new Map(evidenceBundle.gaps.map(item=>[item.gap_id,item])),findings:new Map(evidenceBundle.findings.map(item=>[item.finding_id,item])),actions:new Map(evidenceBundle.actions.map(item=>[item.action_id,item]))}:null;
    let evidenceReturnFocus=null;
    let currentEvidenceCrumb=null;
    let currentEvidenceChunkId=null;
    let currentEvidenceDocumentId=null;
    let descending=false;
    const byId=id=>document.getElementById(id);
    const text=(id,value)=>{byId(id).textContent=value;};
    const escapeText=value=>String(value??'');
    function visibleCriteria(){const rating=byId('rating-filter').value;const query=byId('criterion-search').value.toLocaleLowerCase();return dashboardData.criteria.filter(c=>(!rating||c.rating===rating)&&(`${c.n} ${c.title} ${c.aff} ${c.con} ${c.judge}`).toLocaleLowerCase().includes(query));}
    function evidenceControl(crumbId){const button=document.createElement('button');button.type='button';button.className='evidence-control';button.setAttribute('data-evidence-id',crumbId);button.setAttribute('data-evidence-target',`#evidence/crumb/${crumbId}`);button.textContent=crumbId;button.addEventListener('click',()=>openEvidence(button.dataset.evidenceTarget,button));return button;}
    function appendEvidenceControls(container,refs){container.classList.add('evidence-controls');if(!refs.length){container.textContent=ui.none;return;}refs.forEach(crumbId=>container.append(evidenceControl(crumbId)));}
    function findAll(source,needle){const matches=[];if(!needle)return matches;let offset=0;while(offset<=source.length-needle.length){const index=source.indexOf(needle,offset);if(index<0)break;matches.push([index,index+needle.length]);offset=index+1;}return matches;}
    function normalizedTextMap(value){const normalized=[];const starts=[];const ends=[];let needsSpace=false;for(const match of value.matchAll(/\s+|[^\s]+/gu)){if(/^\s+$/u.test(match[0])){if(normalized.length)needsSpace=true;continue;}if(needsSpace){normalized.push(' ');starts.push(match.index);ends.push(match.index);needsSpace=false;}const token=match[0].normalize('NFC');for(let index=0;index<token.length;index+=1){normalized.push(token[index]);starts.push(match.index);ends.push(match.index+match[0].length);}}return {text:normalized.join(''),starts,ends};}
    function quoteRanges(source,quote){const method=String(quote.link_method??'').toUpperCase();let matches=[];if(method==='EXACT'){matches=findAll(source,quote.text_original);}else{const sourceMap=normalizedTextMap(source);const needle=normalizedTextMap(quote.text_original).text;matches=findAll(sourceMap.text,needle).map(([start,end])=>[sourceMap.starts[start],sourceMap.ends[end-1]]);}const status=!matches.length?'not_found':matches.length>1?'ambiguous':method==='EXACT'?'exact':'normalized';return {quote_id:quote.quote_id,status,match_count:matches.length,link_method:method,ranges:matches};}
    function renderHighlightedText(container,source,quotes){const results=quotes.map(quote=>quoteRanges(source,quote));const intervals=results.flatMap(result=>result.ranges.map(([start,end])=>({start,end,quote_id:result.quote_id})));const boundaries=[...new Set([0,source.length,...intervals.flatMap(match=>[match.start,match.end])])].sort((a,b)=>a-b);container.replaceChildren();for(let index=0;index<boundaries.length-1;index+=1){const start=boundaries[index];const end=boundaries[index+1];if(end<=start)continue;const active=intervals.filter(match=>match.start<end&&match.end>start).map(match=>match.quote_id).sort();const node=active.length?document.createElement('mark'):document.createTextNode(source.slice(start,end));if(active.length){node.setAttribute('data-quote-ids',active.join(' '));node.textContent=source.slice(start,end);}container.append(node);}return results.map(({ranges,...result})=>result);}
    function renderChunk(chunk,quotes){currentEvidenceChunkId=chunk.chunk_id;text('evidence-current-chunk-id',chunk.chunk_id);byId('evidence-primary-chunk').setAttribute('data-chunk-id',chunk.chunk_id);text('evidence-heading-path',chunk.heading_path);const applicable=quotes.filter(quote=>quote.chunk_id===chunk.chunk_id);const results=renderHighlightedText(byId('evidence-chunk-text'),chunk.text,applicable);const byQuote=new Map(results.map(result=>[result.quote_id,result]));quotes.forEach(quote=>{const article=document.querySelector(`[data-quote-id="${quote.quote_id}"]`);const result=byQuote.get(quote.quote_id);const status=result?result.status:'outside_chunk';article.setAttribute('data-highlight-status',status);article.querySelector('.quote-match-status').textContent=ui[`highlight_${status}`]??status;});const warnings=results.filter(result=>['ambiguous','not_found'].includes(result.status));const warning=byId('evidence-highlight-status');warning.hidden=!warnings.length;warning.textContent=warnings.length?ui.highlight_warning.replace('{count}',warnings.length):'';const neighbor=id=>{const candidate=id&&evidenceMaps.chunks.get(id);return candidate&&candidate.document_id===currentEvidenceDocumentId?candidate:null;};byId('evidence-previous-chunk').disabled=!neighbor(chunk.previous_chunk_id);byId('evidence-next-chunk').disabled=!neighbor(chunk.next_chunk_id);}
    function navigateChunk(direction){const current=evidenceMaps&&evidenceMaps.chunks.get(currentEvidenceChunkId);if(!current||!currentEvidenceCrumb)return;const targetId=direction==='previous'?current.previous_chunk_id:current.next_chunk_id;const target=targetId&&evidenceMaps.chunks.get(targetId);if(!target||target.document_id!==currentEvidenceDocumentId)return;const quotes=currentEvidenceCrumb.quote_ids.map(id=>evidenceMaps.quotes.get(id)).filter(Boolean);renderChunk(target,quotes);}
    function buildEvidenceCitation(crumb){if(!crumb||!evidenceMaps)return'';const documentRecord=evidenceMaps.documents.get(crumb.document_id);if(!documentRecord)return'';const lines=['Evidence citation',`Run-ID: ${evidenceBundle.metadata.run_id}`,`Supplier: ${evidenceBundle.metadata.supplier}`,`Language: ${evidenceBundle.metadata.deliverable_language}`,`Package-SHA256: ${evidenceBundle.lineage.package.sha256}`,`Bundle-SHA256: ${evidenceElement.dataset.sha256}`,`Document-ID: ${documentRecord.document_id}`,`Document-title: ${documentRecord.title}`,`Source-filename: ${documentRecord.filename}`,`Source-SHA256: ${documentRecord.source_sha256}`,`Crumb-ID: ${crumb.crumb_id}`,`Criterion-ID: ${crumb.criterion_id}`,`Item-type: ${crumb.item_type}`,`Statement: ${crumb.statement}`];crumb.quote_ids.forEach(quoteId=>{const quote=evidenceMaps.quotes.get(quoteId);const chunk=quote&&evidenceMaps.chunks.get(quote.chunk_id);if(!quote||!chunk)return;lines.push('',`Quote-ID: ${quote.quote_id}`,`Link-method: ${quote.link_method}`,`Confidence: ${quote.confidence}`,`Locator: ${quote.source_locator}`,`Chunk-ID: ${chunk.chunk_id}`,`Chapter-reference: ${chunk.heading_path}`,'Quote-text:',quote.text_original);});return lines.join('\n');}
    async function copyEvidenceCitation(){const output=byId('evidence-citation-output');const citation=buildEvidenceCitation(currentEvidenceCrumb);output.value=citation;byId('evidence-citation-print').textContent=citation;try{if(!navigator.clipboard||typeof navigator.clipboard.writeText!=='function')throw new Error('clipboard unavailable');await navigator.clipboard.writeText(citation);text('evidence-copy-status',ui.copy_success);}catch(_error){text('evidence-copy-status',ui.copy_fallback);output.focus();output.select();}}
    function printEvidence(){if(!currentEvidenceCrumb)return;document.body.classList.add('evidence-print');window.print();}
    function showEvidenceError(target){text('evidence-requested-target',target);text('evidence-status',ui.evidence_unavailable);byId('evidence-status').hidden=false;byId('evidence-resolved-content').hidden=true;}
    function renderEntityContext(resolved){const section=byId('evidence-entity-context');const values=byId('evidence-context-values');values.replaceChildren();section.hidden=resolved.type==='crumb';if(section.hidden)return;Object.entries(resolved.entity??{}).filter(([key])=>key!=='viewer_target').forEach(([key,value])=>{const term=document.createElement('dt');term.textContent=key;const detail=document.createElement('dd');detail.textContent=Array.isArray(value)?value.join(', '):String(value??'');values.append(term,detail);});}
    function showResolvedContent(target){text('evidence-requested-target',target);byId('evidence-status').hidden=true;byId('evidence-status').textContent='';byId('evidence-resolved-content').hidden=false;}
    function renderEvidenceEntity(resolved,target){currentEvidenceCrumb=null;currentEvidenceChunkId=null;currentEvidenceDocumentId=null;byId('evidence-crumb-content').hidden=true;renderEntityContext(resolved);showResolvedContent(target);return true;}
    function renderEvidenceCrumb(crumb,target){const documentRecord=evidenceMaps.documents.get(crumb.document_id);const quotes=crumb.quote_ids.map(id=>evidenceMaps.quotes.get(id)).filter(Boolean);const chunk=evidenceMaps.chunks.get(crumb.chunk_ids[0]);if(!documentRecord||quotes.length!==crumb.quote_ids.length||!chunk){showEvidenceError(target);return false;}currentEvidenceCrumb=crumb;currentEvidenceDocumentId=crumb.document_id;byId('evidence-crumb-content').hidden=false;text('evidence-statement',crumb.statement);text('evidence-document-id',documentRecord.document_id);text('evidence-document-title',documentRecord.title);text('evidence-document-filename',documentRecord.filename);text('evidence-document-language',documentRecord.language);text('evidence-reference-id',crumb.crumb_id);text('evidence-criterion-id',crumb.criterion_id);text('evidence-item-type',crumb.item_type);const quoteContainer=byId('evidence-quotes');quoteContainer.replaceChildren();quotes.forEach(quote=>{const quoteChunk=evidenceMaps.chunks.get(quote.chunk_id);if(!quoteChunk||quoteChunk.document_id!==crumb.document_id){showEvidenceError(target);return;}const article=document.createElement('article');article.className='evidence-quote';article.setAttribute('data-quote-id',quote.quote_id);const id=document.createElement('strong');id.textContent=quote.quote_id;const metadata=document.createElement('p');metadata.textContent=`${quote.link_method} · ${ui.confidence}: ${quote.confidence}`;const locator=document.createElement('p');locator.textContent=quote.source_locator;const chapter=document.createElement('p');chapter.className='quote-chapter-reference';chapter.textContent=`${ui.chapter_reference}: ${quoteChunk.heading_path}`;const source=document.createElement('pre');source.className='evidence-source';source.textContent=quote.text_original;const matchStatus=document.createElement('p');matchStatus.className='quote-match-status';article.append(id,metadata,locator,chapter,source,matchStatus);quoteContainer.append(article);});renderChunk(chunk,quotes);const citation=buildEvidenceCitation(crumb);byId('evidence-citation-output').value=citation;byId('evidence-citation-print').textContent=citation;text('evidence-copy-status','');showResolvedContent(target);return true;}
    function evidenceCrumbFor(type,id){if(!evidenceMaps)return null;const first=ids=>(ids??[]).map(crumbId=>evidenceMaps.crumbs.get(crumbId)).find(Boolean)??null;if(type==='crumb')return evidenceMaps.crumbs.get(id)??null;if(type==='evaluation'){const row=evidenceMaps.evaluations.get(id);return row?first(row.evidence_crumb_ids):null;}if(type==='gap'){const row=evidenceMaps.gaps.get(id);return row?(evidenceMaps.crumbs.get(row.evidence_crumb_id)??evidenceCrumbFor('evaluation',row.evaluation_id)):null;}if(type==='finding'){const row=evidenceMaps.findings.get(id);return row?(evidenceMaps.crumbs.get(row.evidence_crumb_id)??evidenceCrumbFor('gap',row.gap_id)??evidenceCrumbFor('evaluation',row.evaluation_id)):null;}if(type==='action'){const row=evidenceMaps.actions.get(id);return row?(evidenceCrumbFor('finding',row.finding_id)??evidenceCrumbFor('gap',row.gap_id)):null;}return null;}
    function resolveEvidenceTarget(target){if(typeof target!=='string'||target.includes('%'))return null;const match=target.match(/^#evidence\/(crumb|document|evaluation|gap|finding|action|source)\/([A-Za-z0-9_.:-]+)$/u);if(!match)return null;const [,type,id]=match;const collection=type==='source'?null:evidenceMaps?.[`${type}s`];const entity=type==='source'&&id==='package'?{viewer_target:target,run_id:evidenceBundle.metadata.run_id,supplier:evidenceBundle.metadata.supplier,deliverable_language:evidenceBundle.metadata.deliverable_language,package_sha256:evidenceBundle.lineage.package.sha256,evidence_bundle_sha256:evidenceElement.dataset.sha256}:collection?.get(id);if(!entity||entity.viewer_target!==target)return null;const entityOnly=type==='document'||type==='source';const crumb=entityOnly?null:evidenceCrumbFor(type,id);return entityOnly||crumb?{type,id,entity,crumb}:null;}
    function openEvidence(target,trigger=null,cause='activate'){evidenceReturnFocus=trigger instanceof HTMLElement?trigger:document.activeElement;byId('evidence-drawer').hidden=false;byId('evidence-backdrop').hidden=false;const resolved=resolveEvidenceTarget(target);const rendered=Boolean(resolved&&(resolved.crumb?renderEvidenceCrumb(resolved.crumb,target):renderEvidenceEntity(resolved,target)));if(rendered&&resolved.crumb)renderEntityContext(resolved);if(!rendered)showEvidenceError(String(target??''));if(rendered&&cause==='activate')history.pushState(null,'',target);if(rendered&&cause==='initial_load')history.replaceState(null,'',target);byId('evidence-panel-heading').focus();}
    function hideEvidence(returnFocus=false){document.body.classList.remove('evidence-print');byId('evidence-drawer').hidden=true;byId('evidence-backdrop').hidden=true;if(returnFocus&&evidenceReturnFocus&&evidenceReturnFocus.isConnected)evidenceReturnFocus.focus();evidenceReturnFocus=null;}
    function closeEvidence(){hideEvidence(true);}
    function navigateEvidenceLocation(cause){if(location.hash.startsWith('#evidence/'))openEvidence(location.hash,null,cause);else hideEvidence(false);}
    function renderCriteria(){const rows=visibleCriteria().slice().sort((a,b)=>descending?b.order-a.order:a.order-b.order);const cards=byId('criterion-card-container');const matrix=byId('matrix-body');cards.replaceChildren();matrix.replaceChildren();rows.forEach(c=>{const article=document.createElement('article');article.className='criterion-card';article.dataset.rating=c.rating;const heading=document.createElement('h3');heading.textContent=`${c.n} — ${c.title}`;const badge=document.createElement('div');badge.className='rating';badge.textContent=c.rating;const button=document.createElement('button');button.type='button';button.textContent=ui.details;button.addEventListener('click',()=>toggleCard(button));const body=document.createElement('div');body.className='criterion-body';[['aff',ui.affirmative],['con',ui.contrary],['judge',ui.judgement]].forEach(([key,label])=>{const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=`${label}: `;p.append(strong,document.createTextNode(escapeText(c[key])));body.append(p);});const refs=document.createElement('div');refs.className='evidence';appendEvidenceControls(refs,c.refs);body.append(refs);article.append(heading,badge,button,body);cards.append(article);const tr=document.createElement('tr');[c.n,c.title,c.rating,c.score??ui.na].forEach(value=>{const td=document.createElement('td');td.textContent=escapeText(value);tr.append(td);});const evidenceCell=document.createElement('td');appendEvidenceControls(evidenceCell,c.refs);tr.append(evidenceCell);matrix.append(tr);});}
    function filterCriteria(){renderCriteria();}
    function searchCriteria(){renderCriteria();}
    function sortCriteria(){descending=!descending;renderCriteria();}
    function toggleCard(button){const body=button.parentElement.querySelector('.criterion-body');body.hidden=!body.hidden;}
    function toggleAll(open){document.querySelectorAll('.criterion-body').forEach(body=>{body.hidden=!open;});}
    function printDashboard(){window.print();}
    function renderDashboard(){document.documentElement.lang=dashboardData.deliverable_language;document.title=`${ui.title} — ${dashboardData.supplier}`;[['header-kicker',ui.kicker],['dashboard-title',document.title],['header-run',`${dashboardData.run_id} · ${dashboardData.generated_date}`],['label-score',ui.score],['metric-score',`${dashboardData.weighted_score} / 100`],['label-applicable',ui.applicable],['metric-applicable',dashboardData.applicable_count],['label-classification',ui.classification],['metric-classification',dashboardData.classification],['heading-summary',ui.summary],['summary-text',ui.summary_text.replace('{count}',dashboardData.applicable_count).replace('{score}',dashboardData.weighted_score)],['heading-distribution',ui.distribution],['label-filter',ui.filter],['label-search',ui.search],['sort-button',ui.sort],['expand-button',ui.expand],['collapse-button',ui.collapse],['print-button',ui.print],['heading-criteria',ui.criteria],['heading-matrix',ui.matrix],['heading-actions',ui.actions],['footer-dash',dashboardData.dash_id],['footer-date',dashboardData.generated_date],['metadata-package-hash',evidenceBundle?.lineage?.package?.sha256??ui.none],['metadata-bundle-hash',evidenceElement.dataset.sha256||ui.none],['evidence-panel-heading',ui.evidence_title],['evidence-close',ui.evidence_close],['evidence-context-label',ui.evidence_context],['evidence-statement-label',ui.evidence_statement],['evidence-document-label',ui.evidence_document],['evidence-traceability-label',ui.evidence_traceability],['evidence-quotes-label',ui.evidence_quotes],['evidence-chunk-label',ui.evidence_chunk],['evidence-previous-chunk',ui.previous_chunk],['evidence-next-chunk',ui.next_chunk],['evidence-actions-label',ui.evidence_actions],['evidence-copy',ui.copy_citation],['evidence-print',ui.print_evidence],['evidence-citation-label',ui.citation_label]].forEach(([id,value])=>text(id,value));const filter=byId('rating-filter');filter.replaceChildren();[['',ui.all],...Object.keys(dashboardData.classification_counts).map(v=>[v,v])].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;filter.append(option);});const dist=byId('distribution-values');dist.replaceChildren();Object.entries(dashboardData.classification_counts).forEach(([name,count])=>{const div=document.createElement('div');const strong=document.createElement('strong');strong.textContent=count;div.append(document.createTextNode(`${name} `),strong);dist.append(div);});const head=byId('matrix-head');[ui.id,ui.name,ui.rating,ui.criterion_score,ui.evidence].forEach(label=>{const th=document.createElement('th');th.textContent=label;head.append(th);});const actions=byId('actions-list');actions.replaceChildren();if(!dashboardData.priority_actions.length){const p=document.createElement('p');p.className='empty';p.textContent=ui.none_actions;actions.append(p);}dashboardData.priority_actions.forEach(a=>{const p=document.createElement('p');p.textContent=`${a.action_id} · ${a.description}`;actions.append(p);});renderCriteria();}
    byId('evidence-close').addEventListener('click',closeEvidence);
    byId('evidence-backdrop').addEventListener('click',closeEvidence);
    byId('evidence-previous-chunk').addEventListener('click',()=>navigateChunk('previous'));
    byId('evidence-next-chunk').addEventListener('click',()=>navigateChunk('next'));
    byId('evidence-copy').addEventListener('click',copyEvidenceCitation);
    byId('evidence-print').addEventListener('click',printEvidence);
    window.addEventListener('afterprint',()=>document.body.classList.remove('evidence-print'));
    window.addEventListener('popstate',()=>navigateEvidenceLocation('popstate'));
    window.addEventListener('hashchange',()=>navigateEvidenceLocation('hashchange'));
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!byId('evidence-drawer').hidden)closeEvidence();});
    renderDashboard();
    navigateEvidenceLocation('initial_load');
  </script>
