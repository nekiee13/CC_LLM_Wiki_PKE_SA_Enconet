<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <style>
    :root{--ink:#17202a;--muted:#607080;--paper:#f4f7f8;--card:#fff;--line:#d7e0e4;--accent:#005b66;--good:#287a45;--warn:#a85d00;--bad:#a12a2a}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
    header,main,footer{max-width:1180px;margin:auto;padding:1.2rem}header{background:var(--accent);color:#fff;max-width:none}
    header>div{max-width:1138px;margin:auto}.eyebrow{letter-spacing:.12em;text-transform:uppercase;opacity:.8}
    .metric-bar,.distribution,.criteria-grid{display:grid;gap:1rem}.metric-bar{grid-template-columns:repeat(3,1fr);margin:1rem 0}
    .metric,.panel,.criterion-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem}
    .metric strong{display:block;font-size:1.6rem}.distribution{grid-template-columns:repeat(7,minmax(80px,1fr))}
    .distribution div{text-align:center}.controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
    input,select,button{font:inherit;padding:.55rem;border:1px solid var(--line);border-radius:5px;background:#fff}button{cursor:pointer}
    .criteria-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.criterion-card h3{margin:.2rem 0}.rating{font-weight:700;color:var(--accent)}
    .criterion-body[hidden]{display:none}.evidence{font-family:ui-monospace,monospace;font-size:.88rem;color:var(--muted)}
    .evidence-controls{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.7rem}.evidence-control{font-family:ui-monospace,monospace;font-size:.82rem;color:var(--accent);text-align:left}
    .evidence-backdrop{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:10}.evidence-drawer{position:fixed;z-index:11;top:0;right:0;width:min(720px,94vw);height:100vh;overflow:auto;background:var(--card);border-left:1px solid var(--line);padding:1.2rem;box-shadow:-8px 0 24px rgb(0 0 0/.2)}
    .evidence-drawer header{display:flex;justify-content:space-between;align-items:start;background:transparent;color:var(--ink);padding:0}.evidence-drawer h2{margin-top:0}.evidence-drawer dl{display:grid;grid-template-columns:max-content 1fr;gap:.25rem .7rem}.evidence-drawer dt{font-weight:700}.evidence-drawer dd{margin:0;overflow-wrap:anywhere}.evidence-quote,.evidence-chunk{border:1px solid var(--line);border-radius:6px;padding:.75rem;margin:.6rem 0}.evidence-source{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);padding:.65rem;border-radius:4px}.evidence-error{color:var(--bad);font-weight:700}
    .evidence-source mark{background:#ffe36e;color:inherit;padding:0}.chunk-nav,.evidence-action-controls{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.highlight-note{color:var(--warn);font-weight:700}.quote-match-status{color:var(--muted)}
    .citation-fallback{display:block;width:100%;min-height:16rem;white-space:pre;font:inherit;font-family:ui-monospace,monospace}.citation-print{display:none;white-space:pre-wrap;overflow-wrap:anywhere}
    [hidden]{display:none!important}
    table{width:100%;border-collapse:collapse}th,td{padding:.55rem;border-bottom:1px solid var(--line);text-align:left}
    .scroll{overflow:auto}.empty{color:var(--muted)}footer{color:var(--muted);text-align:center}
    @media(max-width:700px){.metric-bar,.distribution{grid-template-columns:1fr 1fr}.criteria-grid{grid-template-columns:1fr}}
    @media print{body{background:#fff}.controls,button,.evidence-backdrop{display:none!important}.criterion-body[hidden]{display:block}.panel,.criterion-card{break-inside:avoid;box-shadow:none}.evidence-drawer{position:static;width:auto;height:auto;box-shadow:none;border:1px solid var(--line)}body.evidence-print>header,body.evidence-print>main,body.evidence-print>footer,body.evidence-print>noscript{display:none!important}body.evidence-print>.evidence-drawer{display:block!important}body.evidence-print .citation-fallback{display:none!important}body.evidence-print .citation-print{display:block!important}}
  </style>
</head>

  <header id="dashboard-header" data-section="header"><div><div class="eyebrow" id="header-kicker"></div><h1 id="dashboard-title"></h1><div id="header-run"></div></div></header>
  <main>
    <section id="metric-bar" class="metric-bar" data-section="metric-bar">
      <div class="metric"><span id="label-score"></span><strong data-bind="weighted_score" id="metric-score"></strong></div>
      <div class="metric"><span id="label-applicable"></span><strong data-bind="applicable_count" id="metric-applicable"></strong></div>

    <section id="executive-summary" class="panel" data-section="executive-summary"><h2 id="heading-summary"></h2><p id="summary-text"></p></section>
    <section id="distribution" class="panel" data-section="distribution"><h2 id="heading-distribution"></h2><div class="distribution" data-bind="classification_counts" id="distribution-values"></div></section>
    <section id="dashboard-controls" class="panel controls" data-section="controls">
      <label><span id="label-filter"></span> <select id="rating-filter" onchange="filterCriteria()"></select></label>
      <label><span id="label-search"></span> <input id="criterion-search" type="search" oninput="searchCriteria()"></label>
      <button id="sort-button" type="button" onclick="sortCriteria()"></button>
      <button id="expand-button" type="button" onclick="toggleAll(true)"></button>
      <button id="collapse-button" type="button" onclick="toggleAll(false)"></button>
      <button id="print-button" type="button" onclick="printDashboard()"></button>
    </section>
    <section id="criterion-cards" data-section="criterion-cards"><h2 id="heading-criteria"></h2><div class="criteria-grid" data-bind="criteria" id="criterion-card-container"></div></section>
    <section id="criterion-matrix" class="panel scroll" data-section="matrix"><h2 id="heading-matrix"></h2><table><thead><tr id="matrix-head"></tr></thead><tbody data-bind="criteria" id="matrix-body"></tbody></table></section>
    <section id="priority-actions" class="panel" data-section="actions"><h2 id="heading-actions"></h2><div data-bind="priority_actions" id="actions-list"></div></section>
    <section id="artifact-metadata" class="panel" data-section="artifact-metadata">
      <h2>Artifact metadata</h2>
      <p>Package SHA-256: <code id="metadata-package-hash"></code></p>
      <p>Evidence bundle SHA-256: <code id="metadata-bundle-hash"></code></p>
    </section>
  </main>
  <div id="evidence-backdrop" class="evidence-backdrop" hidden></div>
  <aside id="evidence-drawer" class="evidence-drawer" role="dialog" aria-modal="true" aria-labelledby="evidence-panel-heading" hidden>
    <header><h2 id="evidence-panel-heading" tabindex="-1"></h2><button id="evidence-close" type="button"></button></header>
    <p id="evidence-status" class="evidence-error" role="status" aria-live="polite" hidden></p>
    <p><code id="evidence-requested-target"></code></p>
    <div id="evidence-resolved-content">
      <section id="evidence-entity-context" hidden><h3 id="evidence-context-label"></h3><dl id="evidence-context-values"></dl></section>
      <div id="evidence-crumb-content">
        <section><h3 id="evidence-statement-label"></h3><p id="evidence-statement"></p></section>
        <section><h3 id="evidence-document-label"></h3><dl><dt>ID</dt><dd id="evidence-document-id"></dd><dt>Title</dt><dd id="evidence-document-title"></dd><dt>File</dt><dd id="evidence-document-filename"></dd><dt>Language</dt><dd id="evidence-document-language"></dd></dl></section>
        <section><h3 id="evidence-traceability-label"></h3><dl><dt>Reference</dt><dd id="evidence-reference-id"></dd><dt>Criterion</dt><dd id="evidence-criterion-id"></dd><dt>Type</dt><dd id="evidence-item-type"></dd></dl></section>
        <section><h3 id="evidence-quotes-label"></h3><div id="evidence-quotes"></div></section>
        <section><h3 id="evidence-chunk-label"></h3><nav class="chunk-nav" aria-label="Source chunk navigation"><button id="evidence-previous-chunk" type="button"></button><code id="evidence-current-chunk-id"></code><button id="evidence-next-chunk" type="button"></button></nav><p id="evidence-highlight-status" class="highlight-note" role="status" aria-live="polite" hidden></p><article id="evidence-primary-chunk" class="evidence-chunk"><p><strong id="evidence-heading-path"></strong></p><pre id="evidence-chunk-text" class="evidence-source"></pre></article></section>
        <section id="evidence-record-actions"><h3 id="evidence-actions-label"></h3><div class="evidence-action-controls"><button id="evidence-copy" type="button"></button><button id="evidence-print" type="button"></button></div><p id="evidence-copy-status" role="status" aria-live="polite"></p><label for="evidence-citation-output" id="evidence-citation-label"></label><textarea id="evidence-citation-output" class="citation-fallback" readonly></textarea><pre id="evidence-citation-print" class="citation-print"></pre></section>
      </div>
    </div>

gledati zapise rukovanja, otpreme i skladištenja reprezentativnih fizičkih proizvoda te potvrditi propisane uvjete zaštite.","finding_id":"FIND-0007","gap_id":null,"priority":0,"viewer_target":"#evidence/action/ACT-0008"},{"action_id":"ACT-0009","description":"Pregledati uzorak statusnih oznaka i registara za inspekciju, ispitivanje, kalibraciju i nesukladne stavke.","finding_id":"FIND-0008","gap_id":null,"priority":0,"viewer_target":"#evidence/action/ACT-0009"}],"chunks":[{"char_end":94646,"char_start":94322,"chunk_id":"CHUNK-DOC-0021-0104","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0021","heading_path":"1. PRILOG PRAVILNIKA O RADU [line 1270] > Članak 3. [line 1311]","next_chunk_id":"CHUNK-DOC-0021-0105","previous_chunk_id":null,"sequence":104,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## Članak 3.\n\nPored organizacijskih cjelina, direktor po potrebi može imenovati i zaposliti radne grupe, timove, pojedine radnike i slično radi obavljanja poslova ukoliko je to svrsishodnije ili ekonomičnije ili ukoliko se radi o poslovima koji se ne mogu iz bilo kojeg razloga obaviti u stalnim organizacijskim cjelinama.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0104"},{"char_end":97215,"char_start":94646,"chunk_id":"CHUNK-DOC-0021-0105","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0021","heading_path":"1. PRILOG PRAVILNIKA O RADU [line 1270] > OPIS RADNIH MJESTA [line 1315]","next_chunk_id":"CHUNK-DOC-0021-0106","previous_chunk_id":"CHUNK-DOC-0021-0104","sequence":105,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## OPIS RADNIH MJESTA\n\n### Članak 4.\n\nOvim prilogom Pravilnika o radu, utvrđuje se popis radnih mjesta te uvjeti, obveze i odgovornosti radnika za pojedino radno mjesto.\n\nRadno mjesto je skup radnih zadataka koje izvršava pojedini radnik.\n\nBroj radnika i opseg radnih zadataka utvrđuje se tako da se osigura puna zaposlenost tijekom redovnog radnog vremena. Kako bi isto bilo osigurano, ovaj prilog Pravilnika o radu predviđa potreban broj radnika, odnosno izvršitelja za određeno radno mjesto.\n\nPotrebu za otvaranjem novog radnog mjesta odnosno ukidanjem postojećeg, određuje direktor sa svrhom uspješnog poslovanja Društva, a uslijed gospodarskih, tehničkih ili organizacijskih razloga te u skladu sa organizacijom rada u Društvu.\n\n### Članak 5.\n\nOpis radnih zadataka i odgovornosti svakog pojedinog radnog mjesta, te uvjeta kojima radnik mora udovoljiti za obavljanje poslova odnosno radnog mjesta sadržan je u POPISU POSLOVA S OPISOM I UVJETIMA ZA RADNO MJESTO koji je sastavni dio ovog priloga Pravilnika o radu. Izrazi koji se koriste a imaju rodno značenje, koriste se neutralno i odnose se jednako na muški i ženski rod.\n\nOsim poslova utvrđenih ovim prilogom Pravilnika o radu, radnik je dužan obavljati i sve ostale poslove koji s obzirom na organizaciju rada, interna pravila i upute Društva, pravila i standarde struke, pripadaju u njegov djelokrug rada te obavljanje drugih poslova i radnih zadataka koje mu je privremeno ili trajno naložio glavni operativni direktor ili neposredni voditelj, ali u skladu sa Zakonom o radu i sklopljenim ugovorom o radu.\n\n### Članak 6.\n\nSuprotnost bilo koje odredbe ovog priloga Pravilnika o radu, s prisilnom odredbom sada važećeg ili naknadno donesenog zakona ili drugog propisa ili naknadno sklopljenog kolektivnog ugovora koji obvezuje Društvo, ne utječe na valjanost ovog priloga u cijelosti, već će se umjesto odredbe suprotne zakonu, drugom propisu ili kolektivnom ugovoru neposredno primijeniti odgovarajuća odredba.\n\nOrganizacija i sistematizacija radnih mjesta    2\n---\n```mermaid\ngraph TD\n    A[SKUPŠTINA DRUŠTVA ENCONET D.O.O.]\n    B[UPRAVA DRUŠTVA]\n    C[ADMINISTRACIJA]\n    D[OSIGURANJE KVALITETE]\n    E[INŽENJERSKE USLUGE U NUKLEARNOJ ELEKTRANI]\n    F[PROCJENE SIGURNOSTI ELEKTROENERGETSKIH POSTROJENJA]\n    G[ZBRINJAVANJE RADIOAKTIVNOG OTPADA / RAZGRADNJA]\n    H[PROCJENE RIZIKA / PRIPRAVNOST NA IZVANREDNI DOGAĐAJ]\n\n    A --- B\n    B --- C\n    B --- D\n    B --- E\n    B --- F\n    B --- G\n    B --- H\n```\n\nSlika 1: Organizacijska shema ENCONET d.o.o. 1/3\n\nOrganizacija i sistematizacija radnih mjesta 3\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0105"},{"char_end":97260,"char_start":97215,"chunk_id":"CHUNK-DOC-0021-0106","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0021","heading_path":"INŽENJERSKE USLUGE U NUKLEARNOJ ELEKTRANI [line 1363]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0021-0105","sequence":106,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"# INŽENJERSKE USLUGE U NUKLEARNOJ ELEKTRANI\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0106"},{"char_end":103409,"char_start":101873,"chunk_id":"CHUNK-DOC-0021-0118","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0021","heading_path":"ADMINISTRACIJA [line 1472] > 2) Naziv radnog mjesta: VODITELJ KOMERCIJALNO FINANCIJSKIH POSLOVA [line 1474]","next_chunk_id":"CHUNK-DOC-0021-0119","previous_chunk_id":null,"sequence":118,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## 2) Naziv radnog mjesta: VODITELJ KOMERCIJALNO FINANCIJSKIH POSLOVA\n\n### Opis posla\n\n- Vođenje komercijalno financijskih poslova\n- Planiranje i vođenje tekućih financijskih pokazatelja te izvršenja pojedinih odjela Društva (resursi, procesi, troškovi i sl.)\n- Izvještavanje Direktora o financijskom stanju u Društvu (primanja, projekti, kontinuirane usluge i sl.)\n- Korištenje znanja i vještina u svrhu praćenja komercijalno-financijskih pokazatelja Društva\n- Sudjelovanje u izradi ponuda za usluge Društva\n- Planiranje i nadzor ostvarivanja ciljeva odjela Društva\n- Osiguravanje primjene odgovarajućih postupaka i metoda rada\n- Blagajnički poslovi u Društvu\n- Praćenje potreba, zahtjeva, očekivanja i zadovoljstva kupaca\n- Komunikacija i suradnja s kupcima\n- Praćenje konkurencije\n- Planiranje i nabava opreme i materijala\n- Izrada godišnjih i drugih periodičnih financijskih izvješća\n- Izrada godišnjih i drugih periodičnih statističkih izvješća\n\n### Uvjeti za radno mjesto:\n\n#### Potrebna stručna sprema i broj izvršitelja\n- VSS ekonomije (1 izvršitelj)\n\n#### Dodatna edukacija, specifična znanja i vještine\n- Dobro poznavanje zakona i propisa iz područja komercijale i financija\n- Dobro poznavanje djelatnosti, tržišta, kupaca i konkurencije iz djelokruga Društva\n- Poznavanje rada na računalu (MS Office, MS Windows)\n- Znanje engleskog jezika\n- Sposobnost timskog rada\n\n#### Radno iskustvo\n- 10 godina radnog iskustva na komercijalno financijskim poslovima, od toga najmanje 5 godina u vođenju komercijalno financijskih poslova\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0118"},{"char_end":106282,"char_start":103409,"chunk_id":"CHUNK-DOC-0021-0119","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0021","heading_path":"ADMINISTRACIJA [line 1472] > 3) Naziv radnog mjesta: REFERENT ZA ADMINISTRATIVNE, NABAVNE, RAČUNOVODSTVENE I KADROVSKE POSLOVE [line 1508]","next_chunk_id":"CHUNK-DOC-0021-0120","previous_chunk_id":"CHUNK-DOC-0021-0118","sequence":119,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## 3) Naziv radnog mjesta: REFERENT ZA ADMINISTRATIVNE, NABAVNE, RAČUNOVODSTVENE I KADROVSKE POSLOVE\n\n### Opis posla\n\n- Vođenje evidencije o radnicima, obračunava radne sate za plaću\n- Priprema dokumentacije za računovodstvo (evidencija ulaznih računa; izdavanje, likvidacija i obračun putnih naloga; unos naloga za plaćanje i dr.)\n- Priprema obrazaca za ponude i prikupljanje dokumentaciju prema zahtjevima naručitelja\n- Vođenje administrativno kadrovskih poslova\n- Arhiviranje financijske, kadrovske, QA i druge dokumentacije\n- Popunjavanje Evidencije prema uredbi GDPR-a\n- Nabava potrošnih materijala, vođenje blagajne, izračun troškova\n- Poslovna korespondencija na hrvatskom i engleskom jeziku\n\nOrganizacija i sistematizacija radnih mjesta 7\n---\n• Briga o redovitom održavanju radnih prostora\n• Drugi poslovi sukladno odluci Direktora i poslovnim potrebama\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n\n• VSS društvenih znanosti (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n\nRadno iskustvo\n\n• 3 godine radnog iskustva na poslovima administracije, nabave, računovodstva i\nkadrovskih poslova\n\n4) Naziv radnog mjesta:    VODITELJ QA POSLOVA\n\nOpis posla\n\n• Vođenje poslova upravljanja kvalitetom\n• Predstavljanje Društva u području upravljanja kvalitetom\n• Osiguravanje sukladnosti SUK-a (Sustav upravljanja kvalitetom Društva) s normom ISO 9001 i\nzahtjevima iz nuklearne industrije (10CFR50 App. B)\n• Planiranje i provođenje internih i eksternih audita\n• Analiza nađenih nesukladnosti\n• Nadzor provođenja popravnih radnji\n• Verifikacija da su popravne radnje postigle željeni rezultat\n• Identifikacija preventivnih akcija i praćenje njihovog provođenja\n• Izvještavanje o stanju SUK-a\n• Planiranje i provođenje izobrazbe djelatnika o SUK-u\n• Planiranje i ostvarivanje poboljšanja SUK-a\n• Sudjelovanje kod izrade Direktorove ocjene SUK-a\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n\n• VSS elektrotehnike / strojarstva (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n\n• Dobro poznavanje međunarodnih i nacionalnih standarda te prakse koja se odnosi na sustave\nupravljanja kvalitetom, posebice za nuklearnu industriju\n• Dobro poznavanje djelatnosti i prakse iz djelokruga Društva, a posebno sustava upravljanja\nkvalitetom u usporedivim sa onim u Društvu (SUK)\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja osiguranja kvalitete u nuklearnim objektima:\n  o Nuclear Quality Assurance Lead Auditor NQA-1\n  o ISO 9001 Interni auditor\n\nOrganizacija i sistematizacija radnih mjesta   8\n---\nRadno iskustvo\n• 10 godina radnog iskustva na poslovima upravljanja kvalitetom za nuklearne objekte\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0119"},{"char_end":107894,"char_start":106282,"chunk_id":"CHUNK-DOC-0021-0120","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0021","heading_path":"ADMINISTRACIJA [line 1472] > 5) Naziv radnog mjesta: SISTEM ADMINISTRATOR / IT ADMINISTRATOR [line 1585]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0021-0119","sequence":120,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## 5) Naziv radnog mjesta: SISTEM ADMINISTRATOR / IT ADMINISTRATOR\n\nOpis posla\n\n• Tehnički nadzor hardwarea i softwarea te provjera ispravnosti tehničke opreme\n• Aktivno planiranje i implementacija novih i održavanje postojećih tehničkih rješenja\n• Tehnička podrška radnicima tvrtke\n• Nabava tehničke opreme te izrada, nadzor i vođenje inventurne liste\n• Instalacija korisničkih računala (Windows, Linux)\n• Optimizacija i nadogradnja mreže i sustava\n• Ovlaštenik za zaštitu na radu kod poslodavca\n• Unutarnji nadzor nad primjenom pravila zaštite na radu te poticanje i savjetovanje poslodavca i njegovih ovlaštenika da otklanjaju nedostatke u zaštiti na radu utvrđene unutarnjim nadzorom\n• Sudjelovanje u izradi procjene rizika\n• Osposobljavanje radnika za rad na siguran način te vođenje evidencije o istom\n• Svi drugi poslovi sukladno odluci nadređenog, poslovnim potrebama te naravi i vrsti posla pripadajućeg radnog mjesta i poslovnog područja\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n• SSS elektrotehnike (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n• Podrška za Windows i linux operativne sustave i okruženje\n• Izvrsno poznavanje procesa i procedura u domeni podrške radnicima\n• Obuka sistemskog mrežnog administratora\n• Obuka za specijalista zaštite na radu prvog stupnja\n• Certifikat iz sigurnosnih sustava upravljanja\n• Komunikacijske vještine\n• Poznavanje rada na računalu\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n\nRadno iskustvo\n• 5 godina rada na poslovima informacijskih tehnologija\n\nOrganizacija i sistematizacija radnih mjesta       9\n---\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0120"},{"char_end":109502,"char_start":107939,"chunk_id":"CHUNK-DOC-0021-0122","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0021","heading_path":"INŽENJERSKE USLUGE U NUKLEARNOJ ELEKTRANI [line 1622] > 6) Naziv radnog mjesta: VODEĆI INŽENJER ZA ELEKTROMOTORNO UPRAVLJANE VENTILE [line 1624]","next_chunk_id":"CHUNK-DOC-0021-0123","previous_chunk_id":null,"sequence":122,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## 6) Naziv radnog mjesta: VODEĆI INŽENJER ZA ELEKTROMOTORNO UPRAVLJANE VENTILE\n\n### Opis posla\n\n- Priprema radnih naloga iz područja elektromotorno upravljanih ventila\n- Inženjerska potpora pri implementaciji programa za elektromotorno upravljane ventile u nuklearnoj elektrani\n- Praćenje međunarodnih standarda i industrijske prakse iz područja elektromotorno upravljanih ventila u nuklearnoj elektrani\n- Uspostavljanje i održavanje baze za elektromotorno upravljane ventile\n- Izvođenje, dokumentiranje i evaluacija rezultata testiranja elektromotorno upravljanih ventila\n- Trendiranje testnih parametara elektromotorno upravljanih ventila\n- Revizija postupaka i frekvencije izvođenja testiranja statičkih i dinamičkih elektromotorno upravljanih ventila\n- Provođenje analiza, akcija i izvršenje istih u okviru programa korektivnih radnji iz područja elektromotorno upravljanih ventila\n- Priprema, izvedba i sudjelovanje na internim osposobljavanjima unutar vezanih na elektromotorno upravljane ventile\n- Bilježenje tehničkih odstupanja iz područja elektromotorno upravljanih ventila\n\n### Uvjeti za radno mjesto:\n\n#### Potrebna stručna sprema i broj izvršitelja\n\n- VSS strojarstva/elektrotehnike (1 izvršitelj)\n\n#### Dodatna edukacija, specifična znanja i vještine\n\n- Poznavanje rada na računalu\n- Znanje engleskog jezika\n- Sposobnost timskog rada\n- Specijalizirana edukacija:\n  - VOTES Infinity MOV\n  - Elektromotorno upravljani ventili\n\n#### Radno iskustvo\n\n- 10 godina radnog iskustva na inženjerskim poslovima iz područja elektromotorno upravljanih ventila\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0122"},{"char_end":118682,"char_start":109502,"chunk_id":"CHUNK-DOC-0021-0123","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0021","heading_path":"INŽENJERSKE USLUGE U NUKLEARNOJ ELEKTRANI [line 1622] > 7) Naziv radnog mjesta: VODEĆI INŽENJER NADZORA STARENJA KABLOVA [line 1658]","next_chunk_id":"CHUNK-DOC-0021-0124","previous_chunk_id":"CHUNK-DOC-0021-0122","sequence":123,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## 7) Naziv radnog mjesta: VODEĆI INŽENJER NADZORA STARENJA KABLOVA\n\n### Opis posla\n\n- Pregled tehnoloških prostora sa kabelima sa praćenjem parametara lokacije (temperatura, vlaga, radijacija...).\n- Vizualni pregled uzorkovanih kabela\n- Izvođenje mjerenja predviđenih programom nadzora staranja kablova\n- Pregled rezultata kalibracijskih mjerenja na kabelima\n- Sudjelovanje i potpora pri izvođenju poslova predviđenih programom nadzora staranja kablova\n- Praćenje međunarodnih standarda i industrijske prakse iz područja staranja kablova u nuklearnoj elektrani\n- Sanacija utvrđenih odstupanja kabelskih trasa uz proces radnog naloga\n- Pomoć u planiranju sanacije i popravka ili zamjene oštećenih električnih kabela.\n- Izrada izvještaja o izvršenim radovima i tehničko dokumentiranje\n\nOrganizacija i sistematizacija radnih mjesta                                                               10\n---\n• Izrada izvještaja o preostalom životnom vijeku kabela i rangiranje rezultata u skladu sa industrijskom praksom\n• Priprema, izvedba i sudjelovanje na internim osposobljavanjima unutar vezanih na starenje kablova\n• Bilježenje tehničkih odstupanja iz područja nadzora staranja kablova\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n• VSS elektrotehnike (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja nadzora staranja kablova:\n  o Testiranje niskonaponskih i visokonaponskih kablova\n  o Visokonaponsko testiranje kablova\n  o Analiza stanja kablova\n\nRadno iskustvo\n• 10 godina radnog iskustva na inženjerskim poslovima iz područja nadzora staranja kablova\n\n8) Naziv radnog mjesta:    VODEĆI INŽENJER KONTROLE KVALITETE\n\nOpis posla\n• Kontrola aktivnosti elektro radova u procesu radnog naloga na primarnoj i sekundarnoj strani nuklearne elektrane za vrijeme pogona i u remontu\n• Pregled i procesiranje radnih naloga u nuklearnoj elektrani\n• Izvođenje aktivnosti kontrole kvalitete prema definiranim postupcima, procedurama i uputama izvođača radova i/ili kontrolnim postupcima\n• Bilježenje svih tehničkih i procesnih odstupanja u skladu sa važećim zahtjevima\n• Revizija i pisanje postupaka kontrole kvalitete za održavanje tehničke opreme u nuklearnoj elektrani\n• Pregled i odobravanje dokumentacije u sklopu projektnih promjena u nuklearnoj elektrani\n• Pregled radnih (pogonskih i remontnih) paketa i dokumentacije izvođača radova u nuklearnoj elektrani\n• Poznavanje principa rada i održavanja sa osvrtom na kontrolu kvalitete elektro opreme\n• Priprema, izvedba i sudjelovanje na internim osposobljavanjima unutar službe kontrole kvalitete\n• Izvođenje aktivnosti neovisnog nadzora u tehnološkom djelu elektrane\n• Poznavanje i rad sa bazama podataka za opremu i dokumentaciju u nuklearnoj elektrani\n• Održavanje znanja kroz praćenje međunarodnih standarda i industrijske prakse iz područja kontrole kvalitete u nuklearnoj elektrani\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n• VSS elektrotehnike (2 izvršitelja)\n\nDodatna edukacija, specifična znanja i vještine\n• Poznavanje rada na računalu (MS Office, MS Windows)\n\nOrganizacija i sistematizacija radnih mjesta                                                                 11\n---\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja kontrole kvalitete:\n    o Nuclear Quality Assurance Lead Auditor NQA-1\n    o 10 CFR 50.59 Changes, Tests and Experiments Screening Process\n    o Vizualna kontrola VT II – ANSI/ASNT CP-189\n\nRadno iskustvo\n\n• 10 godina radnog iskustva na inženjerskim poslovima iz područja kontrole kvalitete u\n  nuklearnoj elektrani\n\n9) Naziv radnog mjesta:    VODEĆI INŽENJER OSIGURANJA KVALITETE\n\nOpis posla\n\n• Izvođenje audita procesa, organizacijskih jedinica, dobavljača opreme i/ili usluga u skladu\n  sa godišnjim planom, priprema izvještaja s procjena (audita), te praćenje izvođenja\n  korektivnih akcija\n• Ocjenjivanje i nadzor dobavljača u nuklearnoj elektrani\n• Pregled i procesiranje nabavne dokumentacije u skladu sa procesima u nuklearnoj\n  elektrani(tehničke specifikacije, narudžbenice, ugovori, ...)\n• Pregled i procesiranje te priprema i arhiviranje postupaka i programa iz područja osiguranja\n  kvalitete u nuklearnoj elektrani\n• Pregled i odobravanje dokumentacije u sklopu projektnih promjena u nuklearnoj elektrani\n• Izrada planova nadzora, nadzor izvedbe aktivnosti i testiranja opreme u nuklearnoj\n  elektrani\n• Sudjelovanje u projektnim timova za izvođenje projekata u nuklearnoj elektrani\n• Izvođenje aktivnosti neovisnog nadzora u tehnološkom djelu elektrane\n• Pregled radnih (pogonskih i remontnih) paketa, planova kontrole te ostale dokumentacije\n  izvođača radova u nuklearnoj elektrani\n• Priprema, izvedba i sudjelovanje na internim osposobljavanjima unutar službe osiguranja\n  kvalitete\n• Priprema podloga za izvještaje iz područja osiguranja kvalitete\n• Ostale tekuće aktivnosti: sastanci, praćenje stručnih područja iz područja osiguranja\n  kvalitete\n• Poznavanje i rad sa bazama podataka za opremu i dokumentaciju u nuklearnoj elektrani\n• Održavanje znanja kroz praćenje međunarodnih standarda i industrijske prakse iz područja\n  osiguranja kvalitete u nuklearnoj elektrani\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n\n• VSS strojarstva (1 izvršitelj)\n• VSS građevinarstva (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja osiguranja kvalitete\n\nOrganizacija i sistematizacija radnih mjesta                                                   12\n---\no Nuclear Quality Assurance Lead Auditor NQA-1\no ISO 9001\u0026 ISO 14001\no Standard ASME Sekcija III \u0026 XI (vrijedi za izvršitelja VSS strojarstva)\no Nuclear Safety-Related Concrete Structures (vrijedi za izvršitelja VSS\ngrađevinarstva)\n\nRadno iskustvo\n\n• 10 godina radnog iskustva na inženjerskim poslovima iz područja osiguranja kvalitete u\nnuklearnoj elektrani\n\n10) Naziv radnog mjesta:    REFERENT ZA ADMINISTRATIVNE I KOMUNIKACIJSKE POSLOVE\n\nOpis posla\n\n• Komunikacijska potpora na području osiguranja i kontrole kvalitete u nuklearnoj elektrani\n• Vođenje tehničke dokumentacije iz područja osiguranja i kontrole kvalitete\n• Administrativna potpora pri procesiranju tehnološke i ne-tehnološke dokumentacije\n(nacrti, procedure, ...) uz osiguravanje procesa sljedljivosti\n• Vođenje i nadzor nad administrativnim procesom (vođenje i uređivanje dozvola za dostup u\ntehnološki i ne-tehnološki dio nuklearne elektrane, evidentiranje, kontrola, vođenje i\nuređivanje evidencije certificiranih osoba, vođenje evidencije odrađenih sati osoblja\nosiguranja i kontrole kvalitete, vođenje evidencije godišnjih odmora, ...),\n• Praćenje korektivnih zahtjeva vezanih na administrativne procese\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n\n• VSS društvenih znanosti (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana znanja:\no Ažuriranje administrativnih baza podataka u nuklearnoj elektrani\n\nRadno iskustvo\n\n• 3 godine radnog iskustva na poslovima iz područja administrativnih i komunikacijskih\nposlova\n\n11) Naziv radnog mjesta:    VODEĆI INŽENJER ZA KVALIFIKACIJU OPREME\n\nOpis posla\n\n• Naručivanje opreme u skladu sa tehničkim specifikacijama\n• Izvođenje projektnih promjena na opremi bitnoj sa sigurnost u nuklearnoj elektrani\n• Potporne aktivnosti pripreme i pregleda dokumentacije za kvalifikaciju opreme\n• Poslovi odgovornog inženjera za potrebe programa okolišne kvalifikacije opreme\n• Održavanje baze kvalifikacije opreme u nuklearnoj elektrani\n• Verifikacija skladnosti ugrađene opreme sa projektnim zahtjevima\n• Izvođenje pregleda opreme na tehnološkom dijelu nuklearne elektrane\n\nOrganizacija i sistematizacija radnih mjesta                                                           13\n---\n• Održavanje i revizija nacrta za okolišno kvalificiranu opremu\n• Razvoj i nadogradnja programa za električnu i mehaničku okolišnu kvalifikaciju opreme projektne i van projektne uvijete\n• Nadzor zamjene opreme i dijelova koji ne zadovoljavaju kriterije po važećim postupcima\n• Uređenje postupaka i zahtjeva za skladištenje okolišno kvalificirane opreme\n• Uspostavljanje sustava za kontrolu preostale životne dobi kvalificirane opreme\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n• VSS/VŠS elektrotehnike (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja kvalifikacije opreme u nuklearnoj elektrani:\n   o Environmental Qualification\n   o 10 CFR 50.59 Changes, Tests and Experiments Screening Process\n   o 10 CFR 50.49 Environmental Qualification of Electric Equipment\n\nRadno iskustvo\n• 10 godina radnog iskustva na inženjerskim poslovima iz područja kvalifikacije opreme\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0123"},{"char_end":125893,"char_start":118682,"chunk_id":"CHUNK-DOC-0021-0124","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0021","heading_path":"INŽENJERSKE USLUGE U NUKLEARNOJ ELEKTRANI [line 1622] > 12) Naziv radnog mjesta: VODEĆI INŽENJER ZA NADZOR DOKUMENTACIJE [line 1858]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0021-0123","sequence":124,"source_sha256":"a2c316258415ae5ea18e9e057f4d1e814992ea59eb40cb70af485433221ddab3","text":"## 12) Naziv radnog mjesta: VODEĆI INŽENJER ZA NADZOR DOKUMENTACIJE\n\nOpis posla\n\n• Odgovornost za zaprimanje, upravljanje, obradu i distribuciju dokumenata te revizija dokumenata u nuklearnoj elektrani\n• Odgovaranje na tehnička i administrativna pitanja koja se odnose na nadzor dokumenata u nuklearnoj elektrani\n• Pregled zahtjeva za identifikacijom i kvalifikacijom dokumentacije, distribucija i pohrana dokumenta\n• Upravljanje sustavima za nadzor dokumenata i zapisa\n• Kontrola distribucija kontroliranih i radnih kopija dokumenata\n• Održavanje kvalitete računalnog sustava za nadzor dokumentacije u nuklearnoj elektrani te kreiranje zahtjeva za promjene u sustavu\n• Održavanje veza sa konfiguracijskom kontrolom zbog održavanja veze dokumenata i opreme\n• Obrada i odlaganje evidencijskih lista sa namjerom praćenja skladištenja dokumentacije\n• Kontinuirano praćenje i savladavanje novosti na području administracije, zakonskih standarda i industrijske prakse, kao i njihove primjene u procesu nadzora dokumentacije u nuklearnoj elektrani\n• Sudjelovanje u projektima iz područja inženjerske podrške dugoročnom radu nuklearne elektrane\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n• VSS/VŠS elektrotehnike (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja nadzora dokumentacije:\n\nOrganizacija i sistematizacija radnih mjesta                                                                    14\n---\no Upravljanje dokumentacijom i arhiviranje u nuklearnoj elektrani\no 10 CFR 50.59 Safety screening and safety evaluation process\n\nRadno iskustvo\n\n• 10 godina radnog iskustva na inženjerskim poslovima iz područja nadzora dokumentacije u nuklearnoj elektrani\n\n13) Naziv radnog mjesta:    INŽENJER ZA NADZOR DOKUMENTACIJE\n\nOpis posla\n\n• Pohrana izvornih zapisa i dokumenata te priprema kontroliranih dokumenata za distribuciju\n• Održavanje i kontrola glavne arhive dokumenata u nuklearnoj elektrani\n• Reprodukcija zapisa, planova i drugih dokumenata\n• Skeniranje zapisa, obrada i kontrolirano postavljanje u sustav za nadzor dokumentacije\n• Distribucija kontroliranih kopija dokumenata u nuklearnoj elektrani\n• Provedba elektroničkog arhiviranja i obrade zapisa u nuklearnoj elektrani\n• Kontrolirano izdavanje dokumenata kroz sustav za nadzor dokumentacije\n• Unos podataka u baze podataka sustava za nadzor dokumenata u nuklearnoj elektrani\n• Sudjelovanje u projektima iz područja inženjerske podrške dugoročnom radu nuklearne elektrane\n• Edukacije i usavršavanje u području nadzora dokumenata u nuklearnoj elektrani\n• Izvršavanje zadataka putem korektivnog programa\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n\n• VSS/VŠS elektrotehnike / aeronautike (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja nadzora dokumentacije:\n    o Upravljanje dokumentacijom u nuklearnoj elektrani\n\nRadno iskustvo\n\n• 2 godine radnog iskustva na inženjerskim poslovima iz područja nadzora dokumentacije\n\n14) Naziv radnog mjesta:    VODEĆI INŽENJER ZA KONTROLU KONFIGURACIJE\n\nOpis posla\n\n• Sustavno ažuriranje postojećih podataka u bazama kontrole konfiguracije opreme u nuklearnoj elektrani\n• Nadogradnja baza kontrole konfiguracije opreme novim vrstama/podvrstama opreme u nuklearnoj elektrani\n• Priprava, kreiranje i održavanje specifičnih ispisa i popisa opreme u poslovnim aplikacijama za kontrolu konfiguracije opreme\n• Ishođenje i obrada podataka za novo ugrađene komponente/podkomponente\n• Sudjelovanje u pripremi, izradi i postavljanju identifikacijskih oznaka opreme u tehnološkom dijelu nuklearne elektrane\n• Pregled paketa projektnih promjena u nuklearnoj elektrani\n\nOrganizacija i sistematizacija radnih mjesta                                                                   15\n---\n• Sudjelovanje u projektnim timovima za izvođenje projekata i pregled projektnih promjena u\nnuklearnoj elektrani\n• Sudjelovanje u revidiranju postupaka iz područja kontrole konfiguracije\n• Izvođenje drugih aktivnosti i sudjelovanje u projektima u svrhu održavanja kontrole konfiguracije\n• Praćenje stanja komponenti na objektu, arhiviranje i njihovo povezivanje u bazama kontrole\nkonfiguracije\n• Obavljanje vizualnog pregleda za provjeru podataka o pojedinačnoj opremi u nuklearnoj elektrani\n• Kreiranje i rješavanje zahtjeva iz korektivnog programa iz područja kontrole konfiguracije\n• Sudjelovanje u projektima iz područja inženjerske podrške dugoročnom radu nuklearne elektrane\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n\n• VSS/VŠS elektrotehnike (1 izvršitelj)\n\nDodatna edukacija, specifična znanja i vještine\n\n• Poznavanje rada na računalu (MS Office, MS Windows)\n• Znanje engleskog jezika\n• Sposobnost timskog rada\n• Specijalizirana edukacija iz područja kontrole konfiguracije:\n   o Kvalifikacija opreme i konfiguracijska kontrola\n   o 10 CFR 50.59 Changes, Tests and Experiments Screening Process\n\nRadno iskustvo\n\n• 10 godina radnog iskustva na inženjerskim poslovima iz područja kontrole konfiguracije\n\n15) Naziv radnog mjesta:    INŽENJER ZA KONTROLU KONFIGURACIJE\n\nOpis posla\n\n• Sustavno ažuriranje postojećih podataka u bazama kontrole konfiguracije opreme u nuklearnoj\nelektrani\n• Nadogradnja baza kontrole konfiguracije opreme novim vrstama/podvrstama opreme u nuklearnoj\nelektrani\n• Priprava, kreiranje i održavanje specifičnih ispisa i popisa opreme u poslovnim aplikacijama za\nkontrolu konfiguracije opreme\n• Ishođenje i obrada podataka za novo ugrađene komponente/podkomponente\n• Pregled projektnih promjena iz područja kontrole konfiguracije u nuklearnoj elektrani\n• Sudjelovanje u revidiranju postupaka iz područja kontrole konfiguracije\n• Periodični pregled i označavanje opreme u skladu sa valjanim postupcima\n• Praćenje stanja komponenti na objektu, arhiviranje i njihovo povezivanje u bazama kontrole\nkonfiguracije\n• Obavljanje vizualnog pregleda nuklearne elektrane za provjeru podataka o pojedinačnoj opremi\n• Kreiranje i rješavanje zahtjeva iz korektivnog programa iz područja kontrole konfiguracije\n• Sudjelovanje u projektima iz područja inženjerske podrške dugoročnom radu nuklearne elektrane\n\nUvjeti za radno mjesto:\n\nPotrebna stručna sprema i broj izvršitelja\n\n• VSS/VŠS elektrotehnike (1 izvršitelj)\n• VSS/VŠS strojarstva (1 izvršitelj)\n\nOrganizacija i sistematizacija radnih mjesta                                                                 16\n---\nDodatna edukacija, specifična znanja i vještine\n\n- Poznavanje rada na računalu (MS Office, MS Windows)\n- Znanje engleskog jezika\n- Sposobnost timskog rada\n- Specijalizirana edukacija iz područja kontrole konfiguracije:\n  - Kvalifikacija opreme i konfiguracijska kontrola\n  - Poslovne aplikacije u nuklearnoj elektrani (vrijedi za izvršitelja VSS elektrotehnike)\n  - Inženjerski modul za nuklearne elektrane (vrijedi za izvršitelja VSS strojarstva)\n\nRadno iskustvo\n\n- 5 godina radnog iskustva na inženjerskim poslovima iz područja kontrole konfiguracije\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0021-0124"},{"char_end":25689,"char_start":24548,"chunk_id":"CHUNK-DOC-0022-0017","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0022","heading_path":"5. VODSTVO [line 382] > 5.3. Organizacijske uloge, odgovornosti i ovlaštenja [line 433]","next_chunk_id":"CHUNK-DOC-0022-0018","previous_chunk_id":null,"sequence":17,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 5.3. Organizacijske uloge, odgovornosti i ovlaštenja\n\n### Odgovornosti i ovlaštenja\n\nDirektor Enconeta ima izvršnu funkciju te poduzima sve potrebne mjere da se ostvari strateški cilj poduzeća, snabdijevanje kupaca kvalitetnim proizvodima i uslugama u skladu s ugovorenim zahtjevima, unutar predviđenih rokova i prihvaćenih cijena.\n\nU cilju ostvarenja navedenih opredjeljenja direktor je odgovoran da:\n\n- Uspostavi djelotvoran sustav upravljanja kvalitetom\n- Definira politiku i ciljeve kvalitete\n- Osigura razumijevanje i realizaciju planirane politike i ciljeva kvalitete na svim nivoima organizacijske strukture\n- Definira odgovornosti i metode komuniciranja u cilju djelotvorne provedbe SUK-a\n- Osigura razvoj i stalno poboljšavanje SUK-a\n- Osigura organizacijske, ljudske i tehničke resurse\n\nPojedine funkcije Enconeta sa odgovarajućim poslovima i odgovornostima te njihove međusobne veze i odnosi definirani su i prikazani u organizacijskoj i funkcionalnoj shemi.\n\nKonkretne odgovornosti i ovlaštenja za sve funkcije i nositelje realizacije SUK-a date su u pojedinim procedurama koje opisuju procese sustava i zahtjeve kvalitete.\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0017"},{"char_end":26189,"char_start":25689,"chunk_id":"CHUNK-DOC-0022-0018","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"Predstavnik direktora za nadzor SUK-a [line 453]","next_chunk_id":"CHUNK-DOC-0022-0019","previous_chunk_id":"CHUNK-DOC-0022-0017","sequence":18,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"# Predstavnik direktora za nadzor SUK-a\n\nDirektor Enconeta imenuje Predstavnika dir. za nadzor SUK-a, koji neovisno o ostalim poslovima i odgovornostima, ima ovlaštenja i odgovornosti da:\n\n- Osigura da su procesi, nužni za SUK, uspostavljeni, primijenjeni i održavani\n\n- Obavještava direktora o djelovanju i potrebi poboljšavanja SUK-a\n\n- Promiče svijest kod svih djelatnika da je ispunjavanje zahtjeva kupca strateški cilj i interes Enconeta\n\n- Surađuje s vanjskim organizacijama u području SUK-a\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0018"},{"char_end":26224,"char_start":26189,"chunk_id":"CHUNK-DOC-0022-0019","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"6. PLANIRANJE SUSTAVA KVALITETE [line 466]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0022-0018","sequence":19,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"# 6. PLANIRANJE SUSTAVA KVALITETE\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0019"},{"char_end":42050,"char_start":42035,"chunk_id":"CHUNK-DOC-0022-0029","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763]","next_chunk_id":"CHUNK-DOC-0022-0030","previous_chunk_id":null,"sequence":29,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"# 8. PROVEDBA\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0029"},{"char_end":43150,"char_start":42050,"chunk_id":"CHUNK-DOC-0022-0030","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.1. Operativno planiranje i nadzor [line 765]","next_chunk_id":"CHUNK-DOC-0022-0031","previous_chunk_id":"CHUNK-DOC-0022-0029","sequence":30,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.1. Operativno planiranje i nadzor\n\nEnconet će planirati i razvijati procese i aktivnosti za realizaciju proizvoda u skladu sa zahtjevima sustava upravljanja kvalitetom. Pritom će za svaki proizvod, kada je to primjereno, na odgovarajući način utvrditi:\n\n- Ciljeve kvalitete i zahtjeve za konkretni proizvod\n- Potrebu za uspostavljanjem procesa (po fazama), dokumenata i osiguravanje resursa specifičnih za taj proizvod\n- Radnje i aktivnosti za verifikaciju, validaciju, nadzor, inspekciju i ispitivanje koje su svojstvene tom proizvodu te kriterije za prihvaćanje proizvoda\n\nOsnovni proizvodi Enconeta su projekti, studije, elaborati, analize, računalna programska podrška (software), te konzalting i druge inženjerske usluge. Voditelj posla će, za svaki takav pojedinačni proizvod predvidjeti i utvrditi Plan realizacije projekta s gore navedenim elementima. Taj Plan treba biti u obimu i obliku koji je primjeren svakom takvom proizvodu/projektu.\n\nDetaljniji postupak planiranja realizacije proizvoda odnosno projekta opisan je u posebnoj proceduri PP-73-01 \"Proces projektiranja i razvoja\".\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0030"},{"char_end":49256,"char_start":43150,"chunk_id":"CHUNK-DOC-0022-0031","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.2. Zahtjevi za proizvode i usluge [line 777]","next_chunk_id":"CHUNK-DOC-0022-0032","previous_chunk_id":"CHUNK-DOC-0022-0030","sequence":31,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.2. Zahtjevi za proizvode i usluge\n\n### 8.2.1. Komunikacija s kupcem\n\nOvisno o obimu i karakteru proizvoda, Enconet utvrđuje i provodi različite postupke i metode komuniciranja s kupcem kako bi osigurao:\n\n- Potrebne informacije o proizvodu\n- Rukovanje upitima, ugovorima ili narudžbama i njihovim dopunama\n- Povratne informacije od kupca uključujući i njegove reklamacije\n\nUčesnici te postupci i metode komuniciranja s kupcem definirani su u postupku PP-72-01 «Proces marketinga, ugovaranja i prodaje».\n\n### 8.2.2. Određivanje zahtjeva koji se odnose na proizvode i usluge\n\nEnconet mora utvrditi zahtjeve za proizvod uključujući:\n\n- Zahtjeve koje specificira kupac uključujući zahtjeve za isporuku i radnje poslije isporuke\n- Zahtjeve koje kupac nije specificirao a neophodni su zbog upotrebe proizvoda kada je ona poznata\n- Zahtjeve zakona i propisa koji se odnose na proizvod\n- Sve ostale zahtjeve koje utvrdi Enconet\n\n\n\n### 8.2.3. Preispitivanje zahtjeva koji se odnose na proizvode i usluge\n\nPrije preuzimanja obaveze na isporuku proizvoda (ponuda, ugovor ili narudžba) Enconet mora pregledati i ocijeniti sve zahtjeve za proizvod te osigurati:\n\n- Da su svi zahtjevi za proizvod definirani i evidentirani\n- Da su u procesu ugovaranja razriješene razlike između zahtjeva u ponudi i zahtjeva u ugovoru\n- Da je sposoban zadovoljiti te zahtjeve\n\nPregled i ocjena zahtjeva za proizvod obavlja se prema postupku PP-72-01 \"Proces marketinga, ugovaranja i prodaje\".\n\nKada kupac ne daje zahtjeve u dokumentiranom obliku (usmeni upit) Enconet ih treba evidentirati i potvrditi prije prihvaćanja.\n\nAko se zahtjevi za proizvod, iz bilo kojih razloga promijene, Enconet će, ako je potrebno, provesti ponovno ocjenjivanje te osigurati izmjenu odgovarajuće dokumentacije i da nadležno osoblje bude upoznato s promijenjenim zahtjevima.\n\nZnačajnije promjene zahtjeva za proizvod rješavaju se aneksima ili dopunama.\n\n### 8.2.4. Promjena zahtjeva za proizvode i usluge\n\nU slučaju izmjena zahtjeva za proizvod i/ili usluge voditelj projekta je dužan ponoviti postupak evaluacije i odobrenja kao i kod inicijalnih zahtjeva.\n\n### 8.3. Projektiranje i razvoj proizvoda i usluga\n\n#### 8.3.1. Općenito\n\nEnconet ima razvijen postupak PP-73-01 \"Proces projektiranja i razvoja\", koji se primjenjuje i održava u procesu projektiranja. Proces je prikladan za izvođenje i isporuku proizvoda i usluga Enconeta.\n\n#### 8.3.2. Planiranje projektiranja i razvoja\n\nPlaniranje projektiranja i razvoja\nProces projektiranja i razvoja u Enconetu obuhvaća izradu tehničkih projekata, studija, elaborata, analiza, računalne programske podrške (software), te konzalting i druge inženjerske usluge. Svaki takav zadatak odnosno proces, započinje izradom Plana realizacije kojim se utvrđuje:\n\n- Pojedine faze procesa\n- Pregledi, ocjene, verifikacije i validacije koji su primjereni svakoj fazi\n- Odgovornosti i ovlaštenja za izvođenje procesa\n- Upravljanje vezama i komunikacijama između grupa koje su uključene u aktivnosti projektiranja i razvoja\n\nTijekom izrade zadatka voditelj vrši nadzor odvijanja planiranih aktivnosti te prema potrebi vrši korekcije odnosno dopune Plana.\n\nAktivnosti i odgovornosti kod planiranja projektiranja i razvoja opisane su u postupku PP-73-01 \"Proces projektiranja i razvoja\".\n\n\nUgovaranje projektiranja i razvoja s vanjskim organizacijama, Outsourcing\n\n\"Ousourced process\" je proces koji je Enconetu potreban u smislu održavanja kvalitete proizvoda i koji Enconetu omogućuje dodjelu ugovorenih poslova trećim (vanjskim) organizacijama.\n\nU cilju održavanja osiguranja kvalitete, Enconet može prema potrebi poslove dodijeliti vanjskim podizvođačima, ali ga to ne oslobađa odgovornosti prema osiguranju svih statutarnih i regulatornih zahtjeva kupca.\n\nEksternizirani procesi (Ousourced process) se mogu primijeniti na sve poslove u smislu osiguranja kvalitete, kao što su:\n\n- Aktivnosti upravljanja (management)\n- Nabavu sredstava (provision of resources)\n- Realizacija proizvoda\n- Mjerenja, analize i usavršavanja\n\nNačin i opseg kontrole eksterniziranih procesa Enconet mora uspostaviti u skladu s utjecajnim faktorima, kao što su:\n\n- Potencijalni utjecaj procesa na mogućnost Enconeta da osigura proizvod koji odgovara postavljenim zahtjevima\n- Stupanj podjele kontrole između Enconeta i podizvođača\n- Mogućnost postizanja potrebne kontrole i nadzora dogovoren u procesu narudžbe\n\n### 8.3.3. Ulazni podaci za projektiranje i razvoj\n\n#### Ulazni podaci za projektiranje i razvoj\n\nEnconet će za svaki proizvod utvrditi ulazne podatke koji moraju sadržavati:\n\n- Zahtjeve na funkciju i karakteristike proizvoda\n- Odgovarajuće zakonske i pravne zahtjeve\n- Informacije od prijašnjih sličnih projekata ako je to korisno\n- Ostale zahtjeve potrebne za projektiranje i razvoj\n- Procjena rizika za uspješno izvođenje i završetak projekta\n\n### 8.3.4. Kontrola projektiranja i razvoja\n\n#### Ocjena projektiranja i razvoja\n\nProjektni tim odnosno učesnici u projektiranju i razvoju će, u primjerenim fazama i u skladu s utvrđenim Planom realizacije, provesti sustavnu ocjenu kako bi se:\n\n- Ocijenile mogućnosti za ispunjavanje zahtjeva\n- Identificirali problemi i predložile radnje za njihovo uklanjanje\n\nOdgovornost za donošenje ocjene projektiranja i razvoja snosi voditelj odgovarajućeg projekta.\n\n#### Ovjera/verifikacija projektiranja i razvoja\n\nU odgovarajućim kontrolnim točkama, definiranim u Planu realizacije, treba verificirati da li rezultati projektiranja i razvoja udovoljavaju ulaznim podacima i zahtjevima a na način definiran postupkom PP-73-01 «Proces projektiranja i razvoja».\n\n\n#### Utvrđivanje prihvatljivosti/validacija projektiranja i razvoja\n\nU odgovarajućim kontrolnim točkama, definiranim u planu zadatka, treba utvrditi da li proizvod odgovara namijenjenoj upotrebi a na način definiran postupkom PP-73-01 «Proces projektiranja i razvoja». Kada god je to izvedivo, ovu validaciju treba provesti u potpunosti, prije isporuke ili primjene proizvoda. Ako postoje razlozi da to nije moguće napraviti, onda validaciju treba provesti za onaj dio proizvoda za kojega je to moguće (djelomična validacija).\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0031"},{"char_end":50525,"char_start":49256,"chunk_id":"CHUNK-DOC-0022-0032","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.3.5. Izlazni podaci projektiranja i razvoja [line 892]","next_chunk_id":"CHUNK-DOC-0022-0033","previous_chunk_id":"CHUNK-DOC-0022-0031","sequence":32,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.3.5. Izlazni podaci projektiranja i razvoja\n\n#### Rezultati (izlazni podaci) projektiranja i razvoja\n\nRezultati (izlazni podaci) projektiranja i razvoja moraju:\n\n- Biti u obliku koji omogućava verifikaciju s obzirom na ulazne podatke\n- Biti odobreni prije objavljivanja\n- Ispuniti ulazne zahtjeve za projektiranje i razvoj\n- Osigurati potrebne informacije za nabavu te realizaciju proizvoda i pružanje usluga\n- Definirati kriterije prihvatljivosti za proizvod ili na njih upućivati\n- Odrediti karakteristike proizvoda koje su bitne za njegovu sigurnu i ispravnu uporabu\n\nVoditelj odgovarajućeg projekta odgovoran je da rezultati (izlazni podaci) projektiranja i razvoja ispunjavaju zahtjeve ulaznih podataka te sadržavaju kriterije prihvatljivosti i sve potrebne podatke koji jasno određuju traženi proizvod.\n\n### 8.3.6. Promjene u projektiranju i razvoju\n\n#### Upravljanje promjenama u projektiranju i razvoju\n\nPromjene u projektiranju i razvoju, kada je to svrsishodno, treba ocijeniti, ovjeriti, utvrditi prihvatljivost i odobriti prije primjene.\n\nOcjena promjene treba sadržavati i ocjenu posljedica za sastavne dijelove i ranije isporučene proizvode.\n\nProces promjena u projektiranju i razvoju opisan je u postupku PP-73-01 «Proces projektiranja i razvoja».\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0032"},{"char_end":51492,"char_start":50525,"chunk_id":"CHUNK-DOC-0022-0033","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.4. Nadzor procesa, proizvoda i usluga ostvarenih izvan organizacije [line 917]","next_chunk_id":"CHUNK-DOC-0022-0034","previous_chunk_id":"CHUNK-DOC-0022-0032","sequence":33,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.4. Nadzor procesa, proizvoda i usluga ostvarenih izvan organizacije\n\n### 8.4.1. Općenito\n\n#### Proces nabave\n\nEnconet mora osigurati da nabavljeni proizvod/usluga udovoljava traženim zahtjevima. U tu svrhu:\n\n- Proces nabave mora biti kontroliran radi udovoljavanja zahtjevima\n- Treba utvrditi kriterije za odabir, ocjenu i ponovnu ocjenu dobavljača\n\nEnconet nabavlja proizvode odnosno usluge od svojih dobavljača koji mogu biti:\n\n- Organizacije\n- Osobe\n\n\nNačin i opseg ocjene dobavljača i nabavljenog proizvoda/usluge ovisi o utjecaju nabavljenog proizvoda/usluge na konačni proizvod.\n\nNajmanje jedanput godišnje Enconet ocjenjuje svoje dobavljače. Ocjenjivanje se provodi po utvrđenim kriterijima a podloge za to su zapisi o ulaznoj (prijemnoj) kontroli te drugi dokazi i saznanja o dobavljačima.\n\nAktivnosti i odgovornosti u procesu nabave, ocjenjivanja dobavljača i prijemne kontrole opisani su u postupku PP-74-01 \"Proces nabave i ocjenjivanja dobavljača\".\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0033"},{"char_end":52925,"char_start":51492,"chunk_id":"CHUNK-DOC-0022-0034","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.4.2. Vrsta i opseg nadzora [line 940]","next_chunk_id":"CHUNK-DOC-0022-0035","previous_chunk_id":"CHUNK-DOC-0022-0033","sequence":34,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.4.2. Vrsta i opseg nadzora\n\nEnconet osigurava da svi procesi, proizvodi i usluge ostvareni od dobavljača (izvan Enconeta) ne utječu nepovoljno na dosljednu isporuku sukladnih proizvoda i usluga.\n\nU tu svrhu izvodi se ocjenjivanje i evaluacija dobavljača, audit i nadzor kvalitete.\n\n### Ovjera/verifikacija nabavljenoga proizvoda\n\nEnconet mora uspostaviti i primjenjivati postupke pregleda i inspekcije kako bi verificirao da nabavljeni proizvod udovoljava traženim zahtjevima. Kod postupka prijemne (ulazne) kontrole treba utvrditi da li je proizvod sukladan zahtjevima iz Ugovora po količini i kvaliteti, a ako ne udovoljava tim zahtjevima, treba definirati daljnji status tog proizvoda u skladu s postupkom PP-74-01 «Proces nabave i ocjenjivanje dobavljača».\n\nAko se pokaže potreba za verifikacijom proizvoda kod dobavljača, Enconet treba dogovoriti postupke verifikacije i metode prihvaćanja tog proizvoda.\n\nOdgovornost za verifikaciju nabavljenog proizvoda snosi voditelj odgovarajućeg projekta.\n\n### 8.4.3. Informacije za vanjske pružatelje usluga\n\n#### Podaci za nabavu\n\nDokumenti nabave moraju sadržavati podatke koji jasno i nedvosmisleno opisuju naručeni proizvod. Ako je potrebno, tim podacima treba dodati zahtjeve za odobravanje proizvoda, procesa, postupaka i opreme te zahtjeve za osposobljenost osoblja i zahtjeve za SUK.\n\nZa jasnoću i ispravnost podataka za nabavu odgovoran je voditelj odgovarajućeg projekta.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0034"},{"char_end":53753,"char_start":52925,"chunk_id":"CHUNK-DOC-0022-0035","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.5. Opskrba proizvodnje i usluga [line 962]","next_chunk_id":"CHUNK-DOC-0022-0036","previous_chunk_id":"CHUNK-DOC-0022-0034","sequence":35,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.5. Opskrba proizvodnje i usluga\n\n### 8.5.1. Nadzor opskrbe proizvodnje i usluga\n\n#### Upravljanje proizvodnjom i pružanjem usluga\n\nEnconet mora osigurati da se svi njegovi procesi odvijaju u kontroliranim uvjetima. Ti uvjeti, po potrebi, uključuju:\n\n- Raspoloživost informacija o proizvodu\n- Raspoloživost postupaka i radnih uputa, kada je to potrebno\n- Uporabu odgovarajuće opreme i sredstava\n- Raspoloživost i korištenje opreme za nadzor i mjerenje\n- Provedbu određenih aktivnosti za predaju i isporuku\n- Provedbu određenih aktivnosti nakon isporuke\n\n\nSve procese obavlja kvalificirano osoblje a stalno praćenje procesa treba se odvijati u skladu s utvrđenim Planom realizacije.\n\nOdgovornost za planiranje, praćenje i upravljanje procesom proizvodnje odnosno realizacije proizvoda snosi voditelj odgovarajućeg projekta.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0035"},{"char_end":54286,"char_start":53753,"chunk_id":"CHUNK-DOC-0022-0036","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.5.2. Utvrđivanje i sljedivost [line 982]","next_chunk_id":"CHUNK-DOC-0022-0037","previous_chunk_id":"CHUNK-DOC-0022-0035","sequence":36,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.5.2. Utvrđivanje i sljedivost\n\n### Označivanje i sljedivost\n\nKad god je primjereno, Enconet treba uspostaviti i obnavljati dokumentirane postupke za prepoznavanje proizvoda tijekom realizacije. Sistem označivanja mora osigurati jednoznačno prepoznavanje proizvoda (koji proizvod, za kojega kupca, status odnosno revizija i sl.) Posebno će se voditi briga o označavanju statusa proizvoda s obzirom na zahtjev za nadzor i mjerenje.\n\nOdgovornost za označivanje proizvoda u svrhu sljedivosti snosi voditelj odgovarajućeg projekta.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0036"},{"char_end":54985,"char_start":54286,"chunk_id":"CHUNK-DOC-0022-0037","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.5.3. Imovina koja pripada kupcima i vanjskim pružateljima usluga [line 990]","next_chunk_id":"CHUNK-DOC-0022-0038","previous_chunk_id":"CHUNK-DOC-0022-0036","sequence":37,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.5.3. Imovina koja pripada kupcima i vanjskim pružateljima usluga\n\n### Vlasništvo kupca\n\nEnconet će pažljivo postupati s vlasništvom kupca. To obuhvaća identificiranje (označivanje i popis); verificiranje (u kakvom je stanju); čuvanje i zaštitu ( da ne bude izgubljeno ili oštećeno).\n\nOvaj se zahtjev odnosi i na povjerljive informacije dane od strane kupca, uključujući intelektualno vlasništvo kao što je software, razna idejna rješenja, itd. (upotreba samo za kupca).\n\nProizvod dostavljen od strane kupca mora se označiti da je od kupca i za koji je proizvod.\n\nOdgovornost za preuzimanje, označivanje i upravljanje sa proizvodima dostavljenim od kupca snosi voditelj odgovarajućeg projekta.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0037"},{"char_end":55427,"char_start":54985,"chunk_id":"CHUNK-DOC-0022-0038","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.5.4. Čuvanje proizvoda [line 1002]","next_chunk_id":"CHUNK-DOC-0022-0039","previous_chunk_id":"CHUNK-DOC-0022-0037","sequence":38,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.5.4. Čuvanje proizvoda\n\n### Čuvanje proizvoda\n\nKako bi se očuvala sukladnost proizvoda tijekom procesa realizacije Enconet mora uspostaviti i održavati dokumentirane postupke za identifikaciju (označivanje), rukovanje, pakiranje, skladištenje i zaštitu proizvoda. Sve ovo odnosi se kako na cijeli proizvod tako i na sastavne dijelove proizvoda.\n\nOdgovornost za čuvanje proizvoda do isporuke kupcu snosi voditelj odgovarajućeg projekta.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0038"},{"char_end":56391,"char_start":55427,"chunk_id":"CHUNK-DOC-0022-0039","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.5.5. Aktivnosti poslije isporuke [line 1010]","next_chunk_id":"CHUNK-DOC-0022-0040","previous_chunk_id":"CHUNK-DOC-0022-0038","sequence":39,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.5.5. Aktivnosti poslije isporuke\n\nEnconet udovoljava svim zahtjevima za aktivnosti koje su vezane za period poslije isporuke, u smislu zakonskih zahtjeva, mogućih neželjenih posljedica, roka trajanja proizvoda, ugovornih zahtjeva kupca i povratnih informacija kupca.\n\n\nUtvrđivanje prihvatljivosti/validacija procesa proizvodnje i pružanja usluga\n\nProcese, koji se ne mogu verificirati naknadnim praćenjem i mjerenjem, Enconet mora validirati kako bi dokazao sposobnost tih procesa za ostvarivanje planiranih rezultata. To su oni procesi kod kojih nedostaci postaju vidljivi tek nakon korištenja proizvoda ili nakon što je usluga isporučena. Ako se takvi procesi pojave, Enconet će za njih, kada je to primjenjivo:\n\n- Odrediti kriterije za vrednovanje i odobravanje tih procesa\n- Definirati posebne postupke i metode\n- Odobriti opremu i sredstva te verificirati osposobljenost osoblja\n- Definirati potrebne zapise\n- Ponovno utvrditi prihvatljivost/validaciju\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0039"},{"char_end":56702,"char_start":56391,"chunk_id":"CHUNK-DOC-0022-0040","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.5.6. Nadzor nad promjenama [line 1025]","next_chunk_id":"CHUNK-DOC-0022-0041","previous_chunk_id":"CHUNK-DOC-0022-0039","sequence":40,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.5.6. Nadzor nad promjenama\n\nEnconet preispituje i nadzire sve promjene bitne za opskrbu proizvodnje i/ili usluga u opsegu potrebnom za osiguranje sukladnosti sa zahtjevima.\n\nDokumentiraju se sve informacije koje opisuju rezultate preispitivanja promjena kao i informacije o ovlaštenim odgovornim osobama.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0040"},{"char_end":59175,"char_start":56702,"chunk_id":"CHUNK-DOC-0022-0041","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.6. Predaja proizvoda i usluge [line 1031]","next_chunk_id":"CHUNK-DOC-0022-0042","previous_chunk_id":"CHUNK-DOC-0022-0040","sequence":41,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.6. Predaja proizvoda i usluge\n\n### Nadzor nad procesom i mjerenje procesa\n\nProcesi, obuhvaćeni sustavom kvalitete u Enconetu nadziru se, a kada je to svrsishodno i mjere, na način naveden u samim procesima.\n\nMetode nadzora (indikatori), a kada je to svrsishodno i mjerenja (vrijednosti) trebaju pokazati sposobnost svakog procesa da ostvaruje planirane rezultate. Tamo gdje nisu moguće precizno mjerljive analize i statistike, te metode mogu biti:\n\n- Provođenje internih audita i drugih provjera, nadzor outsourcing-a\n- Periodički izvještaji voditelja procesa\n- Ocjena sustava od strane direktora i mjere za poboljšanje\n\nKada planirani rezultati procesa nisu ostvareni, odgovorne osobe iniciraju primjerene popravne radnje da bi se osigurala sukladnost proizvoda.\n\n### Nadzor nad proizvodom i mjerenje proizvoda\n\nEnconet će provoditi radnje nadzora a, prema potrebi, i mjerenja karakteristika proizvoda kako bi se verificiralo da su zahtjevi za proizvod ispunjeni. Nadzor uključuje i sve eksternalizirane aktivnosti (outsourcing). Te radnje će se provoditi u skladu s planiranim radnjama za svaki konkretni proizvod i u planiranim fazama ostvarivanja proizvoda (prodaja, nabava, realizacija, isporuka):\n\n- Prodaja: Praćenjem zahtjeva kupca, tržišta, konkurencije, dobavljača i sl. utvrđuje se sposobnost ispunjavanja traženih zahtjeva kupca i kriterija ispravnosti proizvoda.\n- Nabava: Ulaznom kontrolom.\n- Realizacija: Nadzorom, a prema potrebi i mjerenjem, na onim mjestima koja su predviđena planom i koja utječu na kvalitetu proizvoda, a na temelju ugovornih zahtjeva i tehničko-tehnološke dokumentacije prema kojoj se proizvod radi.\n\n\nNačin provođenja aktivnosti nadzora tijekom realizacije proizvoda opisan je u postupku PP-73-01 \"Proces projektiranja i razvoja\".\n\nPostupak rješavanja uočenih nesukladnosti na proizvodima opisan je u postupku PP-83-01 \"Upravljanje nesukladnim proizvodima\".\n\nZapisi o nadzoru i, prema potrebi mjerenju, tijekom procesa, održavaju se kao dokaz o sukladnosti proizvoda s kriterijima prihvaćanja.\n\n- Isporuka: Enconet neće isporučiti proizvod kupcu ako nije prošao potrebne nadzore i mjerenja koji dokazuju ispravnost proizvoda odnosno zadovoljenje zahtjeva kupca. Na primjeren način mora biti dokazivo da je ispravan proizvod predan kupcu i da ga je on prihvatio. Iznimno, u slučaju hitnosti, na traženje kupca, isporuka može uslijediti i bez navedenih zahtjeva ali uz pisano odobrenje kupca odnosno odgovarajuće ovlaštene osobe.\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0041"},{"char_end":60247,"char_start":59175,"chunk_id":"CHUNK-DOC-0022-0042","context_truncated_after":true,"context_truncated_before":false,"document_id":"DOC-0022","heading_path":"8. PROVEDBA [line 763] > 8.7. Nadzor nesukladnih izlaznih podataka [line 1062]","next_chunk_id":null,"previous_chunk_id":"CHUNK-DOC-0022-0041","sequence":42,"source_sha256":"6c86f765247d36078ad85c8bc20d3ab341bf122c85a60331a5c53f66e0eab27a","text":"## 8.7. Nadzor nesukladnih izlaznih podataka\n\nEnconet će uspostaviti i održavati dokumentirani postupak za identificiranje (primjerena oznaka, mjesto čuvanja i sl.), nadzor radi sprečavanja neželjenog korištenja, način upravljanja te odgovornosti i ovlaštenja za postupanje s nesukladnim proizvodom.\n\nUpravljanje i postupanje s nesukladnim proizvodom obuhvaća:\n\n- Aktivnosti za uklanjanje uočene nesukladnosti (dorada)\n- Korištenje uz uočenu nesukladnost ali uz odobrenje ovlaštene osobe i, kada je primjenjivo, kupca\n- Aktivnosti za sprečavanje izvorno predviđene upotrebe\n\nKada se nesukladni proizvod doradi (popravi), mora se ponovo provesti postupak verifikacije kako bi se dokazala sukladnost sa zahtjevima.\n\nEnconet će poduzeti odgovarajuće radnje, kada se otkrije nesukladni proizvod i poslije isporuke ili početkom primjene.\n\nOdgovornost za prepoznavanje, označavanje i izdvajanje nesukladnih proizvoda snose voditelji projekata.\n\nAktivnosti i odgovornosti za rješavanje uočenih nesukladnosti opisani su u postupku PP-83-01 \"Upravljanje nesukladnim proizvodom\".\n\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0022-0042"},{"char_end":14210,"char_start":14188,"chunk_id":"CHUNK-DOC-0023-0018","context_truncated_after":false,"context_truncated_before":true,"document_id":"DOC-0023","heading_path":"4     INSTRUCTIONS [line 311]","next_chunk_id":"CHUNK-DOC-0023-0019","previous_chunk_id":null,"sequence":18,"source_sha256":"ba7ed665376b86890bd4c7355cda65c4cd183ae45a721c1ed887293fb9bb1851","text":"# 4     INSTRUCTIONS\n\n","viewer_target":"#evidence/chunk/CHUNK-DOC-0023-0018"},{"char_end":23421,"char_start":14210,"chunk_id":"CHUNK-DOC-0023-0019","context_truncated_after":false,"context_truncated_before":false,"document_id":"DOC-0023","heading_path":"4     INSTRUCTIONS [line 311] > 4.1    Installation and Setup [line 313]","next_chunk_id":"CHUNK-DOC-0023-0020","previous_chunk_id":"CHUNK-DOC-0023-0018","sequence":19,"source_sha256":"ba7ed665376b86890bd4c7355cda65c4cd183ae45a721c1ed887293fb9bb1851","text":"## 4.1    Installation and Setup\n\n### 4.1.1      RELAP5 program\n#### 4.1.1.1.     RELAP5 program shall be installed by RELAP software engineer in following steps:\n\n1. RELAP5 root directory shall be created and named R5MnnnTT, where nnnTT is variable number of alpha-numerical characters reserved for the identification of the program program version. Number of places for nnn and TT is not restricted, but dedicated abbreviation is assigned and recorded by ENCONET Technical Project Leader. It is dependent on the code version used e.g. R5M33 is regular name for the RELAP5/mod33, R5M34scdapsim for RELAP5/SCDAPSIM for 3.4 version installation.\n\n2. RELAP5 program shall be placed in the RELAP5 root directory and named according to following conventions:\n   a. first 3 characters are fixed for RELAP5 - r5m,\n   b. characters between position 3 and last 3 places before extension .exe are reserved for mod description that shall be consistent with name defined in paragraph 1 above (4.1.1.1-1),\n   c. last 3 characters before extension are reserved for executable version description, e.g. r5m32p1a.exe is regular name of executable version of RELAP5/mod32 program.\n\n3. RELAP5 steam tables shall be placed in the RELAP5 root directory and named tpfh2o if they are used with any RELAP5/mod3 based code with ASME-67 formulation or tpfh2onew for IAPSW-95 formulation\n\n4. RELAP5 script program shall be placed in the RELAP5 root directory and named r5m3r.bat or r5sim.bat depending of the RELAP5 version.\n\n5. RELAP5 root directory shall be written in PATH variable.\n\n6. All files in RELAP5 root directory shall be write-protected for all other users.\n\n7. Subdirectory for the testing of RELAP5 program shall be created in RELAP5 root directory and named TEST.\n\n8. TEST directory shall contain results of RELAP5 testing according to Appendix 6.2.\n\n9. Work subdirectories shall be defined in the RELAP5 root directory for the RELAP5 analyses.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                           Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                  Rev.2      Page 13 of 60\n\n### 4.1.1.2. RELAP5 shall satisfy following requirements:\n\n1. Executable version shall be frozen and protected by authentication process.\n\n2. Source code version, time, date and size of executable version shall be written at the beginning of each RELAP5 created output and in the header of RELAP5 restart file.\n\n3. Base input deck and run input deck ID shall be automatically included in every RELAP5 created output and restart file.\n\n### 4.1.1.3. RELAP5 script program to perform RELAP5 calculations shall be written.\n\n### 4.1.1.4. RELAP5 script program shall be stored in RELAP5 root directory.\n\n### 4.1.1.5. RELAP5 script program shall require as input arguments only run input deck ID and base input deck ID\n\n### 4.1.1.6. RELAP5 script program shall satisfy following conventions:\n\n1. Input files for RELAP5 program shall be file type i.\n\n2. Output files of RELAP5 program shall have same name as input deck ID and file type o.\n\n3. Restart files of RELAP5 program shall have same name as input deck ID and file type r.\n\n4. All other files shall be deleted after the end of RELAP5 calculation.\n\n### 4.1.1.7. RELAP5 script program shall be invoked from operating system command line by input of command:\n\nr5m3r (r5sim) input_ ID ..\\base_input_ID\n\nwhere input _ID stands for run input deck ID and\nbase_input_ID stands for base input deck ID.\n\n### 4.1.1.8. RELAP5 script program is presented in Appendix 6.3.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                            Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                   Rev.2     Page 14 of 60\n\n### 4.1.2      RELAP5 Plot Program\n\n#### 4.1.2.1.     RELAP5 plot program shall be installed in following steps:\n\n1. RELAP5 plot program shall be placed in the RELAP5 root directory.\n2. RELAP5 plot program shall be write-protected from other users.\n3. RELAP5 plot program shall satisfy following requirements:\n   a. Executable version shall be frozen and protected by authentication process.\n   b. RELAP5 plot program shall not change nor modify the results of the RELAP5 calculations.\n   c. All types of RELAP5 plot program generated outputs (screen graphics, plots, vector file formats, HPGL files and binary-plot file) shall contain:\n      - version of RELAP5 program that generated plot records;\n      - time and the date when plot records were generated by RELAP5 program;\n      - ID of the run input deck used to run RELAP5 program;\n      - ID of the base input deck used to run RELAP5 program.\n\n#### 4.1.2.2.     RELAP5 plot program shall be used for:\n\n1. the creation of graphs on computer screen\n2. the creation of hardcopy of graphs\n3. the creation of graph output in at least one standard picture file format (WMF, HPGL, postscript, PCX, TIFF, etc.)\n4. the generation of file with all plot data\n5. the generation of ASCII file for each plot variable\n\n### 4.1.3      Base RELAP5 files\n\n#### 4.1.3.1.     Base input deck shall be created by nodalization developers.\n\n##### 4.1.3.1.1. Base input deck shall be complete and prepared to represent model of respective NPP in compliance with Ref. [2].\n\n##### 4.1.3.1.2. The development of base input deck shall be documented by RELAP5 nodalization notebook as specified in 4.3.1.\n\n##### 4.1.3.1.3. Compliance of base input deck models to the NPPsystems, setpoints and geometrical zones shall be summarized in Steady-State Technical Report as specified in 4.3.2.\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                              Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                     Rev.2      Page 15 of 60\n\n#### 4.1.3.1.4. Base input deck ID shall be defined by nodalization supervisor with maximum of 8 characters:\n\n1. characters 1 to 5 shall be used for the abbreviation of reference plant data, (e.g. P1n00 shall represent plant configuration for the version 00 of nominal condditions, P1h1a for version 1a of hot shutdown conditions, etc.)\n\n2. characters 6 to 8 shall be used for numbering of base input deck revisions, (e.g. e0a may stand for 0 revision for end of life configuration and b0a for beginning of life)\n\n#### 4.1.3.1.5. Base input deck shall be file type i.\n\n#### 4.1.3.1.6. Base input deck shall be stored in work directory for each NPP modelled. Backup copies shall be stored on:\n\n1. a CD that shall be kept together with the master version of RELAP5 notebook\n\n2. at least one other removable computer storage media.\n\n3. protected web site http://enconet.no-ip.biz/ifolder\n\n#### 4.1.3.1.7. Base input deck shall be write-protected by nodalization supervisor.\n\n#### 4.1.3.1.8. Base input deck data shall be in compliance with Ref. [1] depending on the code version used. Additional input conventions that shall be part of this procedure are reported in Appendix 6.4.\n\n#### 4.1.3.1.9. Base input deck shall be qualified on the steady-state level, that is:\n\n1. geometrical fidelity with the plant is achieved and well documented (verified by the base input deck notebook that ensures all the input data are traceable and close physical representation of the actual plant).\n\n2. referenced steady-state condition is satisfactory reproduced (that is, difference between calculation results and reference is within predefined limits as verified by Steady-State Technical Report).\n\nENCONET d.o.o., Zagreb\n---\nRadna uputa                                                                               Naziv dok: RU-73-04\nPROCEDURE FOR THE TRANSIENT ANALYSES                                                      Rev.2      Page 16 of 60\n
