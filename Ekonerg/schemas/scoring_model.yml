# Owner-approved local scoring model for the Ekonerg evaluation run.
schema_version: "1.0"
model_version: "1.0-ekonerg-20261004"
calibration_status: "approved"
approval_ref: "G3-RUN-20261003-32"
rating_weights:
  fully: 1.00
  substantially: 0.75
  partially: 0.50
  minimally: 0.25
  unmet: 0.00
  undetermined: 0.00
  na: null
consolidated_score:
  formula: "100 * sum(rating_weights[classification] for applicable criteria) / count(applicable criteria)"
  denominator: "applicable-criteria count (18 minus approved not-applicable rulings)"
  rounding: "half-up to 1 decimal place"
  range: [0.0, 100.0]
classification_thresholds:
  - {min_score: 90.0, class: fully}
  - {min_score: 70.0, class: substantially}
  - {min_score: 40.0, class: partially}
  - {min_score: 10.0, class: minimally}
  - {min_score: 0.0, class: unmet}
change_log:
  - version: "1.0-ekonerg-20261004"
    note: "Owner-approved G3 calibration for vendor-crumb evaluation run RUN-20261003-32."
