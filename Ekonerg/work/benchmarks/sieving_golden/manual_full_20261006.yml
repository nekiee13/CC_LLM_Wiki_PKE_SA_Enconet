  quotes:
  - 'Provodi se međufazna ocjena, kako je planirano, pojedinih faza izrade studija
    i projektiranja, kako bi se:


    - ▪ ocijenila mogućnost da rezultati zadovolje postavljene zahtjeve

    - ▪ utvrdili mogući problemi i predložile potrebne aktivnosti za otklanjanje


    Sudionici takvih ocjena moraju biti i odgovorni za izradu studija i projektiranja.
    O provedenim ocjenama i potrebnim aktivnostima vode se zapisi.'
- item_id: FULL-DOC0031-0119
  criterion_id: APP_B_III
  criterion_name: Design Control
  statement: 'objective_control: Completion requires planned internal analysis and
