  quotes:
  - 'EKONERG temelji svoje poslovanje na kvaliteti. Kvaliteta je stoga zadaća svih
    zaposlenih u poduzeću, a u takvom pristupu pomaže im Služba kvalitete, zaštite
    okoliša te zaštite zdravlja i sigurnosti (Q/EP/HS). Djelatnost EKONERG-a usmjerena
    je pružanju usluga na području energetike, uključujući nuklearnu energetiku, i
    zaštite okoliša u svim mijenama životnog vijeka elektroenergetskih objekata, industrijskih
    energana i kotlovnica, energetski intenzivnih industrijskih procesa, te drugih
    energetskih, industrijskih i komunalnih uređaja i sustava. Obuhvat tako širokog
    područja djelatnosti omogućen je poglavito snažnim kadrovskim potencijalom i izrazito
    dobrom opremljenošću ispitnom, mjernom i informatičkom opremom. Razvijena mreža
    vanjskih suradnika (naročito stručnjaka s tehničkih fakulteta) i mreža komplementarnih
    suradničkih poduzeća iz Hrvatske i inozemstva osigurava pružanje cjelovite i kvalitetne
    usluge u najsloženijim i najvećim projektima.


    EKONERG je ustrojen u sedam stručnih odjela s Q/EP/HS službom i zajedničkim službama.'
