    postavljene zahtjeve.


    ![](../../../../../_resources/_page_27_Picture_3.jpeg)


    Obvezno je obavljanje interne analize i verifikacije, a način se definira u planu
    kvalitete iz kojeg je vidljiva povezanost pojedinih analiza, odnosno verifikacija.


