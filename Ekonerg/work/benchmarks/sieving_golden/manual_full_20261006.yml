- item_id: FULL-DOC0031-0266
  criterion_id: APP_B_XVI
  criterion_name: Corrective Action
  statement: 'supporting_control: The environmental addendum applies cause-removal,
    recurrence prevention and effectiveness checks through the same PQ10.2 controls;
    this corroborates integrated use, not a completed action.'
  source:
    source_locator: Dodatak 2 — 8 to 10 Execution and review / 10.1 Općenito [lines
      2353-2364; source 9492b447c386]
  quotes:
  - 'EKONERG osigurava da se prilikom pojave neusklađenosti u sustavu, neovisno da
    li je ista utvrđena kao rezultat nadzora nad procesima, interne provjere ili reklamacije
    Naručitelja, pokreće korektivna akcija u cilju otklanjanja uzroka neusklađenosti
    i sprječavanja njihovog ponavljanja. Korektivne akcije moraju biti primjerene
    posljedicama uočenih neusklađenosti i obuhvaćaju:


    - ▪ preispitivanje neusklađenosti (uključujući pritužbe Naručitelja)

    - ▪ utvrđivanje uzroka neusklađenosti

    - ▪ procjenu potrebe za pokretanjem korektivne akcije koja bi osigurala da se
    neusklađenosti ne ponove

    - ▪ utvrđivanje i provođenje potrebne korektivne akcije

    - ▪ zapise o rezultatima pokrenute korektivne akcije

    - ▪ preispitivanje uspješnosti pokrenute korektivne akcije


    Postupanje u slučaju neusklađenosti opisano je u postupku PQ.10.2-1.


    Postupanje u slučaju pokretanja korektivne akcije opisano je u postupku PQ.10.2-2.'
