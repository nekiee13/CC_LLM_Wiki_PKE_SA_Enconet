  quotes:
  - 'Sustav upravljanja kvalitetom razvijen je u skladu s normom HRN EN ISO 9001 (važeće
    izdanje). Sustavom su obuhvaćene sve organizacijske cjeline i aktivnosti EKONERG-a,
    osim:


    - ▪ računovodstva, financija te pravnih poslova

    - ▪ osiguranja zgrade i imovine


    Dakle, sustav se odnosi na istraživanje, razvoj, konzalting, inženjering, projektiranje,
    ispitivanja i mjerenja na području energetike, industrije i zaštite okoliša.


    Unutar Odjela za mjerenja i analitiku, a u sklopu sustava kvalitete, djeluju Laboratoriji
    za poslove ispitivanja, umjeravanja i ispitivanja sposobnosti, koji su akreditirani
    prema normama HRN EN ISO/IEC 17025 i HRN EN ISO/IEC 17043 (važeća izdanja). Sustav
    kvalitete Laboratorija opisan je u Priručniku kvalitete laboratorija eLAB-PK,
    u skladu s normama HRN EN ISO/IEC 17025 i HRN EN ISO/IEC 17043 (važeća izdanja),
    te u pripadajućim postupcima sustava kvalitete Laboratorija.


    Ovaj Priručnik sustava upravljanja i dio pripadajućih postupaka sustava kvalitete
    EKONERG-a modificirani su u smislu usklađenja ova dva sustava, odnosno korištenja
    dijela postojećih postupaka sustava kvalitete EKONERG-a, u sustavu kvalitete Laboratorija.


    Unutar Odjela za zaštitu atmosfere i klimatske promjene formirana je Služba za
    verifikacijsku djelatnost koja, neovisno o drugim organizacijskim jedinicama,
    obavlja poslove organizacije, pripreme i provedbe verifikacije emisija stakleničkih
    plinova iz postrojenja klijenata. Služba za verifikacijsku djelatnost predstavlja
    akreditacijsko tijelo sukladno zahtjevima norme HRN EN ISO 14065 (važeće izdanje),
    te je, vezano za te aktivnosti, uspostavljen sustav kvalitete verifikacijske djelatnosti,
    opisan u Priručniku sustava kvalitete verifikacijske djelatnosti. Analogno sustavu
    kvalitete Laboratorija, i sustav kvalitete verifikacijske djelatnosti predstavlja
    dio sustava kvalitete EKONERG-a, i u sklopu istog, koristi se dio postojećih postupaka,
    dok su za specifične zahtjeve izrađeni posebni postupci.


    Obzirom da se dio aktivnosti obavlja i na nuklearnom području, u Priručnik i u
    dio postupaka su na odgovarajući način uključeni zahtjevi zakona 10 CFR 50 App.
